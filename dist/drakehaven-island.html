      DH.ui.add(mid, 'h1', '', 'Choose a Class');
      DH.ui.add(mid, 'div', 'prose', 'All twelve are here. This is the single biggest decision on the sheet: it sets your hit points, your saves, what you can wear, and whether you solve problems with a sword, a spell, a bargain, or a very good idea.');
      return;
    }
    DH.ui.add(mid, 'h1', '', c.name);
    DH.ui.add(mid, 'div', 'sub', 'Hit die d' + c.hitDie + ' · saves in ' +
      c.saves.map(s => s.toUpperCase()).join(' and ') + ' · ' + c.skillCount + ' skills');
    DH.ui.add(mid, 'div', 'prose', DH.ui.esc(c.blurb));
    if (c.flavor) DH.ui.add(mid, 'div', 'prose faint', DH.ui.esc('“' + c.flavor + '”'));
    const tags = DH.ui.add(mid, 'div', 'tagrow');
    const bits = [];
    if (c.armor && c.armor.length) bits.push('Armour: ' + c.armor.join(', '));
    bits.push('Weapons: ' + (c.weapons || []).slice(0, 4).join(', '));
    if (c.caster) bits.push('Casts with ' + c.caster.ability.toUpperCase());
    tags.innerHTML = bits.map(b => '<span class="tag">' + DH.ui.esc(b) + '</span>').join('');

    DH.ui.add(mid, 'div', 'body-h2', 'What You Have by Third Level');
    for (let L = 1; L <= START_LEVEL; L++) {
      (c.features[L] || []).forEach(f => {
        const e = DH.ui.add(mid, 'div', 'feat');
        e.innerHTML = '<b>' + DH.ui.esc(f.name) + '</b><p>' + DH.ui.esc(f.desc) + '</p>';
      });
    }
    DH.ui.add(mid, 'div', 'body-h2', 'And Later');
    for (let L = START_LEVEL + 1; L <= 10; L++) {
      (c.features[L] || []).forEach(f => {
        const e = DH.ui.add(mid, 'div', 'kv');
        e.innerHTML = '<span>Level ' + L + '</span><span>' + DH.ui.esc(f.name) + '</span>';
      });
    }
    let stylesGranted = false;
    for (let L = 1; L <= START_LEVEL; L++) {
      if ((c.features[L] || []).some(f => (f.effects || []).indexOf('fighting_style') >= 0)) stylesGranted = true;
    }
    if (stylesGranted) {
      DH.ui.add(mid, 'div', 'body-h2', 'Fighting Style');
      DH.FIGHTING_STYLES.forEach(fs => {
        const on = draft.fightingStyle === fs.id;
        const o = DH.ui.el('div', 'opt' + (on ? ' on' : ''));
        o.style.marginBottom = '4px';
        o.innerHTML = '<div class="nm">' + fs.name + '<div class="bit">' + DH.ui.esc(fs.desc) + '</div></div>';
        o.onclick = () => { draft.fightingStyle = fs.id; DH.audio.sfx('select'); render(); };
        mid.appendChild(o);
      });
    }
  }

  /* ---------- step: subclass ---------- */
  function stepSubclass(list, mid) {
    const c = cls();
    if (!c) return;
    (c.subclasses || []).forEach(s => {
      const o = DH.ui.el('div', 'opt' + (draft.subclassId === s.id ? ' on' : ''));
      o.innerHTML = '<div class="nm">' + s.name + '</div>';
      o.onclick = () => { draft.subclassId = s.id; DH.audio.sfx('select'); render(); };
      list.appendChild(o);
    });
    const s = sub();
    const at = C.subclassLevel(c);
    if (!s) {
      DH.ui.add(mid, 'h1', '', 'Choose a Path');
      DH.ui.add(mid, 'div', 'prose', c.name + 's choose their speciality at level ' + at +
        ', and you are starting at ' + START_LEVEL + '.');
      return;
    }
    DH.ui.add(mid, 'h1', '', s.name);
    DH.ui.add(mid, 'div', 'sub', 'Begins at level ' + at);
    DH.ui.add(mid, 'div', 'prose', DH.ui.esc(s.blurb));
    Object.keys(s.features || {}).sort((a, b) => a - b).forEach(k => {
      s.features[k].forEach(f => {
        const e = DH.ui.add(mid, 'div', 'feat');
        e.innerHTML = '<b>Level ' + k + ' — ' + DH.ui.esc(f.name) + '</b><p>' + DH.ui.esc(f.desc) + '</p>';
      });
    });
    if (s.caster) DH.ui.add(mid, 'div', 'small dim', 'This path grants spellcasting using ' + s.caster.ability.toUpperCase() + '.');
  }

  /* ---------- step: abilities ---------- */
  function stepAbilities(list, mid) {
    const methods = [
      { id: 'pointbuy', name: 'Point Buy', bit: '27 points, nothing above 15 before racials' },
      { id: 'array', name: 'Standard Array', bit: '15, 14, 13, 12, 10, 8 — assign them' },
      { id: 'roll', name: 'Roll 4d6, Drop Lowest', bit: 'Fate decides. It may be unkind.' }
    ];
    methods.forEach(m => {
      const o = DH.ui.el('div', 'opt' + (draft.method === m.id ? ' on' : ''));
      o.innerHTML = '<div class="nm">' + m.name + '<div class="bit">' + m.bit + '</div></div>';
      o.onclick = () => {
        draft.method = m.id;
        draft.arrayAssign = {};
        if (m.id === 'pointbuy') { draft.base = { str: 8, dex: 8, con: 8, int: 8, wis: 8, cha: 8 }; draft.pool = 27; }
        if (m.id === 'array') draft.base = { str: 8, dex: 8, con: 8, int: 8, wis: 8, cha: 8 };
        if (m.id === 'roll') { draft.rolled = null; draft.base = { str: 8, dex: 8, con: 8, int: 8, wis: 8, cha: 8 }; }
        DH.audio.sfx('select'); render();
      };
      list.appendChild(o);
    });

    DH.ui.add(mid, 'h1', '', 'Ability Scores');
    const c = cls();
    if (c) DH.ui.add(mid, 'div', 'sub', c.name + 's lean on ' + c.primary.map(p =>
      DH.ABILITIES.find(a => a.id === p).name).join(' and ') + '.');

    if (draft.method === 'pointbuy') {
      const bar = DH.ui.add(mid, 'div', 'prose');
      bar.innerHTML = 'Points left: <b class="gold">' + draft.pool + '</b> of 27. ' +
        'Scores run 8 to 15 before your racial bonuses; 14 and 15 cost extra.';
      DH.ABILITIES.forEach(ab => mid.appendChild(abRowPointBuy(ab)));
      const row = DH.ui.add(mid, 'div', 'swrow');
      row.appendChild(DH.ui.btn('Reset', '', () => {
        draft.base = { str: 8, dex: 8, con: 8, int: 8, wis: 8, cha: 8 }; draft.pool = 27; render();
      }));
      row.appendChild(DH.ui.btn('Recommend for my class', '', () => { recommend(); render(); }));
    } else if (draft.method === 'array') {
      DH.ui.add(mid, 'div', 'prose', 'Click a score, then click the ability it belongs to.');
      mid.appendChild(numberBank(STANDARD_ARRAY));
      DH.ABILITIES.forEach(ab => mid.appendChild(abRowAssign(ab)));
    } else {
      if (!draft.rolled) {
        DH.ui.add(mid, 'div', 'prose', 'Six sets of four dice, the lowest of each discarded. No takebacks — that is the point.');
        mid.appendChild(DH.ui.btn('Roll the dice', 'primary', () => {
          draft.rolled = [];
          for (let i = 0; i < 6; i++) {
            const r = DH.dice.roll('4d6dl1');
            draft.rolled.push(r.total);
          }
          draft.rolled.sort((a, b) => b - a);
          DH.audio.sfx('dice');
          render();
        }));
      } else {
        DH.ui.add(mid, 'div', 'prose', 'You rolled: <b class="gold">' + draft.rolled.join(', ') + '</b>. Assign them.');
        mid.appendChild(numberBank(draft.rolled));
        DH.ABILITIES.forEach(ab => mid.appendChild(abRowAssign(ab)));
        mid.appendChild(DH.ui.btn('Roll again (fresh set)', '', () => {
          draft.rolled = null; draft.arrayAssign = {};
          draft.base = { str: 8, dex: 8, con: 8, int: 8, wis: 8, cha: 8 };
          render();
        }));
      }
    }
  }
  function abRowPointBuy(ab) {
    const row = DH.ui.el('div', 'abrow');
    const v = draft.base[ab.id], rac = racialFor(ab.id), fin = v + rac;
    row.innerHTML =
      '<div class="ab">' + ab.short + '</div>' +
      '<div class="full">' + ab.name + '</div>' +
      '<div class="val">' + v + '</div>' +
      '<div class="rac">' + (rac ? U.plus(rac) : '') + '</div>' +
      '<div class="mod">' + U.plus(C.mod(fin)) + '</div>';
    const minus = DH.ui.btn('−', '', () => {
      if (draft.base[ab.id] <= 8) return;
      const cost = POINT_BUY_COST[draft.base[ab.id]] - POINT_BUY_COST[draft.base[ab.id] - 1];
      draft.base[ab.id]--; draft.pool += cost; render();
    });
    const plus = DH.ui.btn('+', '', () => {
      if (draft.base[ab.id] >= 15) return;
      const cost = POINT_BUY_COST[draft.base[ab.id] + 1] - POINT_BUY_COST[draft.base[ab.id]];
      if (cost > draft.pool) return;
      draft.base[ab.id]++; draft.pool -= cost; render();
    });
    row.appendChild(minus); row.appendChild(plus);
    const pips = DH.ui.el('div', 'pips');
    for (let i = 8; i <= 15; i++) {
      const p = DH.ui.el('div', 'pip' + (i <= v ? ' f' : ''));
      pips.appendChild(p);
    }
    for (let i = 0; i < rac; i++) pips.appendChild(DH.ui.el('div', 'pip r'));
    row.appendChild(pips);
    return row;
  }
  let bankPick = null;
  function numberBank(nums) {
    const wrap = DH.ui.el('div', 'swrow');
    nums.forEach((n, i) => {
      const used = Object.keys(draft.arrayAssign).some(k => draft.arrayAssign[k] === i);
      const b = DH.ui.el('div', 'sw' + (bankPick === i ? ' on' : ''));
      b.style.width = '38px'; b.style.height = '32px';
      b.style.display = 'flex'; b.style.alignItems = 'center'; b.style.justifyContent = 'center';
      b.style.fontSize = '15px';
      b.style.opacity = used ? '0.3' : '1';
      b.textContent = n;
      b.onclick = () => { if (used) return; bankPick = (bankPick === i ? null : i); render(); };
      wrap.appendChild(b);
    });
    return wrap;
  }
  function abRowAssign(ab) {
    const row = DH.ui.el('div', 'abrow');
    const assigned = draft.arrayAssign[ab.id];
    const nums = draft.method === 'array' ? STANDARD_ARRAY : (draft.rolled || []);
    const v = assigned != null ? nums[assigned] : null;
    const rac = racialFor(ab.id);
    row.innerHTML =
      '<div class="ab">' + ab.short + '</div>' +
      '<div class="full">' + ab.name + '</div>' +
      '<div class="val">' + (v == null ? '–' : v) + '</div>' +
      '<div class="rac">' + (rac ? U.plus(rac) : '') + '</div>' +
      '<div class="mod">' + (v == null ? '' : U.plus(C.mod(v + rac))) + '</div>';
    row.style.cursor = 'pointer';
    row.onclick = () => {
      if (bankPick != null) {
        /* clear any ability already holding this number */
        Object.keys(draft.arrayAssign).forEach(k => { if (draft.arrayAssign[k] === bankPick) delete draft.arrayAssign[k]; });
        draft.arrayAssign[ab.id] = bankPick;
        bankPick = null;
      } else if (assigned != null) {
        delete draft.arrayAssign[ab.id];
      }
      syncAssign(); render();
    };
    return row;
  }
  function syncAssign() {
    const nums = draft.method === 'array' ? STANDARD_ARRAY : (draft.rolled || []);
    DH.ABILITIES.forEach(ab => {
      const i = draft.arrayAssign[ab.id];
      draft.base[ab.id] = i != null ? nums[i] : 8;
    });
  }
  function recommend() {
    const c = cls(); if (!c) return;
    const order = c.primary.concat(['con', 'dex', 'wis', 'cha', 'int', 'str'].filter(a => c.primary.indexOf(a) < 0));
    const targets = [15, 14, 13, 12, 10, 8];
    draft.base = { str: 8, dex: 8, con: 8, int: 8, wis: 8, cha: 8 };
    draft.pool = 27;
    order.forEach((ab, i) => {
      const want = targets[i];
      while (draft.base[ab] < want) {
        const cost = POINT_BUY_COST[draft.base[ab] + 1] - POINT_BUY_COST[draft.base[ab]];
        if (cost > draft.pool) break;
        draft.base[ab]++; draft.pool -= cost;
      }
    });
  }

  /* ---------- step: background ---------- */
  function stepBackground(list, mid) {
    DH.BACKGROUNDS.forEach(b => {
      const o = DH.ui.el('div', 'opt' + (draft.backgroundId === b.id ? ' on' : ''));
      o.innerHTML = '<div class="nm">' + b.name + '<div class="bit">' +
        b.skills.map(s => DH.SKILLS[s].name).join(', ') + '</div></div>';
      o.onclick = () => {
        draft.backgroundId = b.id;
        draft.skills = draft.skills.filter(s => b.skills.indexOf(s) < 0);
        DH.audio.sfx('select'); render();
      };
      list.appendChild(o);
    });
    const b = bg();
    if (!b) {
      DH.ui.add(mid, 'h1', '', 'Where You Came From');
      DH.ui.add(mid, 'div', 'prose', 'Two free skill proficiencies, some starting gear and coin, and a hook the story will actually use.');
      return;
    }
    DH.ui.add(mid, 'h1', '', b.name);
    DH.ui.add(mid, 'div', 'sub', 'Starting gold ' + b.gold + ' gp, plus 2d4×2 from your class');
    DH.ui.add(mid, 'div', 'prose', DH.ui.esc(b.blurb));
    const tags = DH.ui.add(mid, 'div', 'tagrow');
    tags.innerHTML = b.skills.map(s => '<span class="tag gold">' + DH.SKILLS[s].name + '</span>').join('') +
      (b.tools || []).map(t => '<span class="tag">' + U.titleCase(t) + '</span>').join('');
    const f = DH.ui.add(mid, 'div', 'feat');
    f.innerHTML = '<b>' + DH.ui.esc(b.feature.name) + '</b><p>' + DH.ui.esc(b.feature.desc) + '</p>';
    DH.ui.add(mid, 'div', 'body-h2', 'How This Comes Up');
    DH.ui.add(mid, 'div', 'prose faint', DH.ui.esc(b.hook));
    DH.ui.add(mid, 'div', 'body-h2', 'Kit');
    DH.ui.add(mid, 'div', 'prose', (b.kit || []).map(id => (DH.item(id) || {}).name || id).join(', '));
  }

  /* ---------- step: skills ---------- */
  function stepSkills(list, mid) {
    const pool = skillPool();
    const need = skillsToPick();
    DH.ui.add(mid, 'h1', '', 'Skill Proficiencies');
    DH.ui.add(mid, 'div', 'sub', 'Choose ' + need + ' — ' + draft.skills.length + ' chosen');
    const b = bg();
    if (b) DH.ui.add(mid, 'div', 'prose faint', 'Your background already gives you ' +
      b.skills.map(s => DH.SKILLS[s].name).join(' and ') + '.');
    const rEff = raceEffects().filter(e => e.indexOf('skill:') === 0).map(e => DH.SKILLS[e.slice(6)].name);
    if (rEff.length) DH.ui.add(mid, 'div', 'prose faint', 'Your people already give you ' + U.listing(rEff) + '.');

    pool.forEach(s => {
      const info = DH.SKILLS[s];
      const on = draft.skills.indexOf(s) >= 0;
      const o = DH.ui.el('div', 'opt' + (on ? ' on' : ''));
      const m = C.mod(finalAbilities()[info.ab]) + (on ? 2 : 0);
      o.style.marginBottom = '4px';
      o.innerHTML = '<div class="nm">' + info.name +
        '<div class="bit">' + info.ab.toUpperCase() + ' · ' + U.plus(m) + ' if taken</div></div>';
      o.onclick = () => {
        if (on) U.remove(draft.skills, s);
        else if (draft.skills.length < need) draft.skills.push(s);
        else { DH.audio.sfx('cancel'); return; }
        DH.audio.sfx('select'); render();
      };
      mid.appendChild(o);
    });
    /* rogue and bard expertise */
    const c = cls();
    if (c && (c.id === 'rogue' || c.id === 'bard')) {
      DH.ui.add(mid, 'div', 'body-h2', 'Expertise — double proficiency in two');
      const all = draft.skills.concat(b ? b.skills : []);
      all.forEach(s => {
        const on = draft.expertise.indexOf(s) >= 0;
        const o = DH.ui.el('div', 'opt' + (on ? ' on' : ''));
        o.style.marginBottom = '4px';
        o.innerHTML = '<div class="nm">' + DH.SKILLS[s].name + '</div>';
        o.onclick = () => {
          if (on) U.remove(draft.expertise, s);
          else if (draft.expertise.length < 2) draft.expertise.push(s);
          render();
        };
        mid.appendChild(o);
      });
    }
  }

  /* ---------- step: look ---------- */
  function stepLook(list, mid) {
    const r = race();
    DH.ui.add(mid, 'h1', '', 'Appearance');
    DH.ui.add(mid, 'div', 'sub', 'This is what everyone on the island will see.');
    if (!r) return;

    const mkSwatches = (title, colours, key) => {
      DH.ui.add(mid, 'div', 'body-h2', title);
      const row = DH.ui.add(mid, 'div', 'swrow');
      colours.forEach(col => {
        const s = DH.ui.el('div', 'sw' + (draft.appearance[key] === col ? ' on' : ''));
        s.style.background = col;
        s.onclick = () => { draft.appearance[key] = col; DH.audio.sfx('select'); render(); };
        row.appendChild(s);
      });
    };
    mkSwatches(r.look.flags && r.look.flags.scalesFromSkin ? 'Scale Colour' : 'Skin', r.look.skin || ['#d8a878'], 'skin');
    if (!(r.look.flags && r.look.flags.hairStyle === 'bald')) {
      mkSwatches('Hair', r.look.hair || ['#2b1f16'], 'hair');
      DH.ui.add(mid, 'div', 'body-h2', 'Hair Style');
      const styles = ['short', 'long', 'braid', 'mohawk', 'bald'];
      const row = DH.ui.add(mid, 'div', 'swrow');
      styles.forEach(st => {
        const b = DH.ui.btn(U.cap(st), draft.appearance.hairStyle === st ? 'primary' : '', () => {
          draft.appearance.hairStyle = st; render();
        });
        row.appendChild(b);
      });
    }
    mkSwatches('Clothing', ['#5a4a7a', '#8a3f3a', '#3a5a3a', '#3f5f7a', '#7a5f3a', '#2b2b3a', '#7a2a4a', '#4a6a7a'], 'cloth');
    mkSwatches('Trim', ['#3a3050', '#5a2a28', '#2b4229', '#2b4258', '#5a4228', '#1a1a24', '#5a1f38', '#33485a'], 'cloth2');
  }

  /* ---------- step: name ---------- */
  function stepName(list, mid) {
    DH.ui.add(mid, 'h1', '', 'What Do They Call You?');
    DH.ui.add(mid, 'div', 'sub', 'The captain will use it. So will the higher-ups.');
    const inp = DH.ui.el('input');
    inp.type = 'text'; inp.maxLength = 24; inp.value = draft.name;
    inp.placeholder = 'Your name';
    inp.oninput = () => {
      draft.name = inp.value;
      const n = document.querySelector('#cc-foot button.primary');
      if (n) n.disabled = !canAdvance();
      const port = document.querySelector('#cc-side .who-name');
      if (port) port.textContent = draft.name || 'Unnamed';
    };
    inp.onkeydown = (e) => { if (e.key === 'Enter' && canAdvance()) { step++; render(); } };
    mid.appendChild(inp);
    setTimeout(() => inp.focus(), 30);

    DH.ui.add(mid, 'div', 'body-h2', 'Or take one of these');
    const pool = NAMES[draft.raceId] || NAMES._default;
    const row = DH.ui.add(mid, 'div', 'swrow');
    U.shuffle(pool).slice(0, 8).forEach(n => {
      row.appendChild(DH.ui.btn(n, '', () => { draft.name = n; render(); }));
    });
  }

  const NAMES = {
    _default: ['Ashen', 'Corwin', 'Delle', 'Fenn', 'Halla', 'Iver', 'Marrow', 'Nix', 'Orrin', 'Perrin', 'Sable', 'Wren'],
    human: ['Ansel', 'Bryn', 'Cade', 'Della', 'Halric', 'Joss', 'Maren', 'Rook', 'Sela', 'Tobias'],
    wood_elf: ['Aelric', 'Caladwen', 'Faeryl', 'Ithil', 'Lirien', 'Sylvar', 'Thessaly', 'Yvarien'],
    high_elf: ['Aureliath', 'Celoril', 'Elenwe', 'Ithanor', 'Myrrha', 'Vaelen'],
    hill_dwarf: ['Baern', 'Dagra', 'Hobbard', 'Korran', 'Morgra', 'Thrain'],
    mountain_dwarf: ['Brannock', 'Durgeddin', 'Helja', 'Kordrun', 'Vistra'],
    halfling: ['Bramble', 'Cora', 'Milo', 'Nettie', 'Pip', 'Rosbin', 'Tansy'],
    dragonborn: ['Arkhosh', 'Balasar', 'Kriv', 'Nadarr', 'Rhogar', 'Shamash', 'Thava', 'Verthisathurgiesh'],
    gnome: ['Bimble', 'Cogsworth', 'Fenwick', 'Gimble', 'Nyx', 'Pennywhistle', 'Wobble'],
    half_elf: ['Ardan', 'Cassia', 'Eiran', 'Lissa', 'Rhoen', 'Vessa'],
    half_orc: ['Grash', 'Krusk', 'Mahra', 'Ronk', 'Shump', 'Ulga'],
    tiefling: ['Akmenos', 'Ember', 'Kallista', 'Mordai', 'Rue', 'Sorrow', 'Zaraq'],
    tabaxi: ['Cloud on the Water', 'Four Bells', 'Nine Lives', 'Quiet Paw', 'Sunset Rain'],
    minotaur: ['Bellowhorn', 'Cassorak', 'Dunmar', 'Horrun', 'Tauressa'],
    kobold: ['Chip', 'Grik', 'Meepo', 'Snik', 'Tikk', 'Yipyap'],
    orc: ['Baggi', 'Gharzul', 'Kansif', 'Murnig', 'Thokk', 'Yevelda']
  };

  /* ---------- step: review ---------- */
  function stepReview(list, mid) {
    const ch = preview();
    DH.ui.add(mid, 'h1', '', ch.name);
    DH.ui.add(mid, 'div', 'sub', 'Level ' + ch.level + ' ' + ch.raceName + ' ' + ch.className +
      (sub() ? ' — ' + sub().name : '') + ' · ' + ch.backgroundName);

    const grid = DH.ui.add(mid, 'div', 'statgrid');
    const stat = (k, v) => {
      const s = DH.ui.add(grid, 'div', 'stat');
      s.innerHTML = '<div class="k">' + k + '</div><div class="v">' + v + '</div>';
    };
    stat('HIT POINTS', ch.hpMax);
    stat('ARMOUR CLASS', ch.ac);
    stat('SPEED', ch.speed + ' ft');
    stat('PROFICIENCY', U.plus(ch.prof));
    stat('INITIATIVE', U.plus(ch.initBonus));
    stat('LEVEL', ch.level);

    DH.ui.add(mid, 'div', 'body-h2', 'Abilities');
    DH.ABILITIES.forEach(ab => {
      const v = ch.abilities[ab.id];
      const e = DH.ui.add(mid, 'div', 'kv');
      e.innerHTML = '<span>' + ab.name + '</span><span>' + v + ' (' + U.plus(C.mod(v)) + ')' +
        ((ch.saveProfs || []).indexOf(ab.id) >= 0 ? '  · save ' + U.plus(C.saveMod(ch, ab.id)) : '') + '</span>';
    });

    DH.ui.add(mid, 'div', 'body-h2', 'Skills');
    const skl = ch.skills.slice().sort();
    skl.forEach(s => {
      const e = DH.ui.add(mid, 'div', 'kv');
      e.innerHTML = '<span>' + DH.SKILLS[s].name + '</span><span>' + U.plus(C.skillMod(ch, s)) + '</span>';
    });

    if (ch.caster) {
      DH.ui.add(mid, 'div', 'body-h2', 'Spellcasting');
      const e = DH.ui.add(mid, 'div', 'kv');
      e.innerHTML = '<span>Spell save DC / attack</span><span>' + ch.spellDC + ' / ' + U.plus(ch.spellAtk) + '</span>';
      const e2 = DH.ui.add(mid, 'div', 'kv');
      const slots = C.slotsAvailable(ch).map(s => s.max + '×L' + s.level).join(', ');
      e2.innerHTML = '<span>Slots</span><span>' + (slots || '—') + '</span>';
      C.ensureSpells(ch);
      DH.ui.add(mid, 'div', 'prose faint', 'Cantrips: ' +
        (ch.spells.cantrips.map(id => DH.spellById(id).name).join(', ') || '—') + '. ' +
        'Spells: ' + ((ch.caster.prepares ? ch.spells.prepared : ch.spells.known)
          .map(id => DH.spellById(id).name).join(', ') || '—') +
        '. You can change these later from your character sheet.');
    }

    DH.ui.add(mid, 'div', 'body-h2', 'Starting Kit');
    DH.ui.add(mid, 'div', 'prose', ch.inv.map(s =>
      (DH.item(s.id) || {}).name + (s.qty > 1 ? ' ×' + s.qty : '')).join(', '));

    DH.ui.add(mid, 'div', 'body-h2', 'Then What?');
    DH.ui.add(mid, 'div', 'prose faint',
      'You are asleep — or nearly — in the crew quarters of the Mary Parker, somewhere off Drakehaven Island, ' +
      'in the early hours of a thunderstorm. Four other people are aboard who will matter enormously to you. ' +
      'One of them is punching a metal bar.');
  }

  /* ---------- the live side panel ---------- */
  function sidePanel(side) {
    const ch = preview();
    const port = DH.ui.add(side, 'div'); port.id = 'cc-portrait';
    portraitCv = document.createElement('canvas');
    portraitCv.width = 96; portraitCv.height = 128;
    port.appendChild(portraitCv);

    const nm = DH.ui.add(side, 'div', 'body-h2 who-name', draft.name || 'Unnamed');
    DH.ui.add(side, 'div', 'small dim',
      (race() ? race().name : '—') + ' ' + (cls() ? cls().name : '') +
      (cls() ? ' ' + START_LEVEL : '') + (sub() ? ' · ' + sub().name : ''));
    DH.ui.add(side, 'div', 'hr');

    const grid = DH.ui.add(side, 'div', 'statgrid');
    const stat = (k, v) => {
      const s = DH.ui.add(grid, 'div', 'stat');
      s.innerHTML = '<div class="k">' + k + '</div><div class="v">' + v + '</div>';
    };
    stat('HP', cls() ? ch.hpMax : '–');
    stat('AC', cls() ? ch.ac : '–');
    stat('SPEED', race() ? ch.speed : '–');
    stat('INIT', U.plus(ch.initBonus));

    DH.ABILITIES.forEach(ab => {
      const v = ch.abilities[ab.id];
      const rac = racialFor(ab.id);
      const e = DH.ui.add(side, 'div', 'kv');
      e.innerHTML = '<span>' + ab.short + (rac ? ' <span class="good">' + U.plus(rac) + '</span>' : '') +
        '</span><span>' + v + '  ' + U.plus(C.mod(v)) + '</span>';
    });
    if (ch.caster) {
      DH.ui.add(side, 'div', 'hr');
      const e = DH.ui.add(side, 'div', 'kv');
      e.innerHTML = '<span>Spell DC</span><span>' + ch.spellDC + '</span>';
    }
    drawPortrait(ch);
  }

  /* The creature painters draw to the shared world canvas, so render the portrait
     into a scratch corner of it and copy the pixels across. The DOM panel covers
     the canvas during creation, so nothing shows through. */
  function drawPortrait(ch) {
    if (!portraitCv) return;
    const g = DH.gfx, realCtx = g.ctx;
    const ctx = portraitCv.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0, 0, 96, 128);
    const keep = { x: g.cam.x, y: g.cam.y };
    g.cam.x = 0; g.cam.y = 0;
    realCtx.save();
    realCtx.setTransform(1, 0, 0, 1, 0, 0);
    realCtx.clearRect(0, 0, 100, 132);
    g.creature(C.visualFor(ch), 48, 118, { scale: 2.6, facing: 'down', weapon: C.weaponArt(ch) });
    ctx.drawImage(realCtx.canvas, 0, 0, 96, 128, 0, 0, 96, 128);
    realCtx.clearRect(0, 0, 100, 132);
    realCtx.restore();
    g.cam.x = keep.x; g.cam.y = keep.y;
  }

  /* ---------- finish ---------- */
  function finish() {
    const ch = C.create({
      name: draft.name.trim() || 'Adventurer',
      raceId: draft.raceId, ancestry: draft.ancestry,
      classId: draft.classId, subclassId: draft.subclassId,
      backgroundId: draft.backgroundId,
      abilities: draft.base,
      skills: draft.skills.concat(bg() ? bg().skills : []),
      expertise: draft.expertise,
      appearance: draft.appearance,
      fightingStyle: draft.fightingStyle,
      level: START_LEVEL
    });
    ch.flexBonus = Object.assign({}, draft.flexBonus);
    C.derive(ch);
    ch.hp = ch.hpMax;
    const st = DH.game.state;
    st.party = [ch];
    st.slot = slot;
    DH.ui.clear();
    DH.game.replace(DH.scenes.script, { script: 'prologue' });
  }

  function update(dt) { tick += dt; }
  function draw() {
    /* the DOM panel covers the canvas; only the portrait needs painting */
    if (portraitCv && DH.gfx.tick % 4 === 0) drawPortrait(preview());
  }

  return { name: 'charcreate', enter, exit, update, draw, resume: render };
})();

</script>
<script>
/* ---- js/scenes/overworld.js ---- */
/* Drakehaven Island — the overworld: free walking, time, people, foraging, and doors
   into everything else. */
window.DH = window.DH || {};

DH.scenes.overworld = (function () {
  'use strict';
  const U = DH.util, G = DH.gfx, C = DH.char, T = DH.gfx.TILE;

  /* The overworld is magnified so a room fills the frame. Small rooms zoom in
     further; big maps stay at the base zoom and scroll. */
  const WORLD_ZOOM = 1.5, MAX_ZOOM = 3;
  let worldZoom = WORLD_ZOOM;
  function zoomFor(m) {
    if (!m || !m.pxW) return WORLD_ZOOM;
    const fill = Math.max(G.VW / m.pxW, G.VH / m.pxH);
    return Math.min(MAX_ZOOM, Math.max(WORLD_ZOOM, Math.round(fill * 20) / 20));
  }
  let map = null, player = null, npcs = [], followers = [];
  let hud = null, promptTarget = null, menuOpen = false;
  let stepTimer = 0, walkSfx = 0;
  /* the tile you arrived on, so a doorway cannot fire the moment you come through it */
  let spawnTile = null;

  /* =============== setup =============== */
  function enter(arg) {
    loadMap((arg && arg.map) || DH.game.state.map, (arg && arg.spawn) || DH.game.state.spawn);
    buildHud();
  }
  function exit() { DH.ui.clear(); hud = null; }
  function resume() { buildHud(); DH.input.clearAll(); }
  function pause() { DH.ui.clear(); hud = null; DH.ui.hidePrompt(); }

  function loadMap(id, spawnName) {
    map = DH.MAPS[id];
    if (!map) { console.warn('missing map', id); return; }
    DH.game.state.map = id;
    DH.game.state.placeName = map.name;
    if (map.town) DH.game.state.lastTown = id;

    const sp = (map.spawns && (map.spawns[spawnName] || map.spawns.start)) || { x: 2, y: 2 };
    player = {
      px: sp.x * T + T / 2, py: sp.y * T + T - 2,
      facing: 'down', moving: false, spec: null, scale: 1, isPlayer: true
    };
    spawnTile = { x: sp.x, y: sp.y };
    refreshPlayerLook();

    /* companions trail behind */
    const band = DH.game.party().slice(1);
    followers = band.map((ch, i) => {
      /* A ring for when you stop, wide enough that nobody overlaps anybody. */
      const a = (i / Math.max(1, band.length)) * Math.PI * 2 + 0.6;
      /* And a marching station: alternating sides of the path, stepped further
         out and further back for each companion, so the party reads as a group
         walking together rather than one silhouette four deep. */
      const rank = Math.floor(i / 2) + 1;
      return {
        ch: ch, px: player.px - (i + 1) * 10, py: player.py,
        facing: 'down', moving: false, trail: [],
        side: (i % 2 ? 1 : -1) * (9 + rank * 5),
        lag: 4 + rank * 6,
        ox: Math.round(Math.cos(a) * 30), oy: Math.round(Math.sin(a) * 19)
      };
    });

    /* NPCs present on this map */
    npcs = (map.npcs || []).map(def => {
      const n = Object.assign({}, def);
      n.px = def.x * T + T / 2; n.py = def.y * T + T - 2;
      n.homeX = n.px; n.homeY = n.py;
      n.wanderT = U.rnd() * 3;
      if (def.visualFrom) {
        const src = DH.MONSTERS[def.visualFrom] || DH.companion(def.visualFrom);
        if (src) { n.spec = src.visual; n.scale = def.scale || src.scale || 1; }
      }
      if (!n.spec) n.spec = def.visual || { body: 'humanoid', skin: '#d8a878', hair: '#3a2a18', cloth: '#5a5a6a', cloth2: '#3a3a4a' };
      n.scale = def.scale || n.scale || 1;
      return n;
    }).filter(visibleNpc);

    /* music and weather */
    worldZoom = zoomFor(map);
    G.setZoom(worldZoom);
    if (map.music) DH.audio.play(map.music);
    DH.audio.ambience(map.ambience || null);
    DH.audio.stormThunder(!!map.thunder);
    G.clearParticles();
    G.camSnap(player.px, player.py, { w: map.pxW, h: map.pxH });
  }

  function visibleNpc(n) {
    if (n.appearAfter && !DH.game.flag(n.appearAfter)) return false;
    if (n.hidden && DH.game.flag(n.hidden)) return false;
    if (n.goneAfter && DH.game.flag(n.goneAfter)) return false;
    /* companions that have joined the party walk with you instead of standing here */
    if (n.visualFrom && DH.game.hasCompanion(n.visualFrom) && n.id === n.visualFrom) return false;
    return true;
  }
  function refreshPlayerLook() {
    const pc = DH.game.pc();
    if (!pc) return;
    player.spec = C.visualFor(pc);
    player.weapon = C.weaponArt(pc);
    player.scale = pc.scale || (player.spec.smallBody ? 0.85 : player.spec.bigBody ? 1.12 : 1);
  }

  /* =============== HUD =============== */
  function buildHud() {
    DH.ui.clear();
    const root = document.getElementById('ui');
    hud = DH.ui.el('div'); hud.id = 'hud';
    root.appendChild(hud);

    const tl = DH.ui.add(hud, 'div', 'tl');
    const bar = DH.ui.add(tl, 'div', 'hpbar');
    DH.ui.add(bar, 'div', 'fill');
    DH.ui.add(bar, 'div', 'txt');
    const pcPlate = DH.ui.add(tl, 'div', 'plate small');
    pcPlate.id = 'hud-pc';

    const tr = DH.ui.add(hud, 'div', 'tr');
    const place = DH.ui.add(tr, 'div', 'plate'); place.id = 'hud-place';
    const clock = DH.ui.add(tr, 'div', 'plate clock'); clock.id = 'hud-clock';
    const gold = DH.ui.add(tr, 'div', 'plate small'); gold.id = 'hud-gold';

    const bl = DH.ui.add(hud, 'div', 'bl');
    bl.appendChild(DH.ui.btn('Sheet (C)', '', () => openBook('sheet')));
    bl.appendChild(DH.ui.btn('Journal (J)', '', () => openBook('quests')));
    bl.appendChild(DH.ui.btn('Party', '', () => openBook('party')));
    bl.appendChild(DH.ui.btn('Menu (Esc)', '', openMenu));

    const br = DH.ui.add(hud, 'div', 'br');
    br.id = 'hud-hint';
    br.innerHTML = 'WASD move · Space interact';
    updateHud();
  }
  function updateHud() {
    if (!hud) return;
    const pc = DH.game.pc();
    if (!pc) return;
    const fill = hud.querySelector('.hpbar .fill');
    const txt = hud.querySelector('.hpbar .txt');
    if (fill) fill.style.width = Math.max(0, (pc.hp / pc.hpMax) * 100) + '%';
    if (txt) txt.textContent = pc.hp + ' / ' + pc.hpMax + ' HP';
    const p = document.getElementById('hud-pc');
    if (p) p.innerHTML = DH.ui.esc(pc.name) + ' · <b>' + pc.className + ' ' + pc.level + '</b>' +
      (pc.pod ? ' · pod ' + pc.pod.charges + '/' + pc.pod.max : '');
    const pl = document.getElementById('hud-place');
    if (pl) pl.innerHTML = '<b>' + DH.ui.esc(DH.game.state.placeName) + '</b>';
    const cl = document.getElementById('hud-clock');
    if (cl) cl.textContent = DH.game.clock() + '  ·  Day ' + DH.game.state.day;
    const gd = document.getElementById('hud-gold');
    if (gd) gd.innerHTML = '<b>' + U.commas(pc.gold) + '</b> gold';
  }

  function openBook(tab) { DH.game.push(DH.scenes.journal, { tab: tab }); }

  function openMenu() {
    menuOpen = true;
    DH.ui.modal({
      title: 'Menu',
      build(m) {
        const row = DH.ui.add(m, 'div', 'sect');
        row.appendChild(DH.ui.btn('Save game', 'primary', () => {
          const slot = DH.game.state.slot || 1;
          DH.game.saveTo(slot);
          DH.ui.closeModal(); menuOpen = false;
        }));
        row.appendChild(DH.ui.btn('Short rest (1 hour)', '', () => {
          DH.game.shortRest(); DH.ui.closeModal(); menuOpen = false; updateHud();
        }));
        row.appendChild(DH.ui.btn('How to play', '', () => {
          DH.ui.closeModal(); menuOpen = false;
          DH.scenes.title && DH.ui.modal({
            title: 'How to Play',
            html: '<p><kbd>WASD</kbd> move · <kbd>Space</kbd> interact and advance dialogue · ' +
              '<kbd>C</kbd> sheet · <kbd>J</kbd> journal · <kbd>I</kbd> inventory.</p>' +
              '<p>In combat: click a glowing square to move, click an enemy to attack, ' +
              '<kbd>T</kbd> ends the turn, <kbd>P</kbd> raises your Pod shield.</p>',
            buttons: [{ label: 'Close' }]
          });
        }));
        DH.ui.add(m, 'div', 'hr');
        DH.ui.add(m, 'p', 'small dim', 'Day ' + DH.game.state.day + ', ' + DH.game.clock() +
          ' — ' + DH.game.state.placeName);
        const row2 = DH.ui.add(m, 'div', 'sect');
        row2.appendChild(DH.ui.btn('Quit to main menu', 'danger', () => {
          DH.ui.modal({
            title: 'Quit to the main menu?',
            html: '<p>Anything since your last save will be lost.</p>',
            buttons: [
              { label: 'Save and quit', cls: 'primary', fn: () => { DH.game.saveTo(DH.game.state.slot || 1); DH.game.replace(DH.scenes.title); menuOpen = false; } },
              { label: 'Quit without saving', cls: 'danger', fn: () => { DH.game.replace(DH.scenes.title); menuOpen = false; } },
              { label: 'Cancel' }
            ]
          });
        }));
      },
      buttons: [{ label: 'Close', fn: () => { menuOpen = false; } }]
    });
  }

  /* =============== collision =============== */
  function solidAt(px, py) {
    const tx = Math.floor(px / T), ty = Math.floor(py / T);
    const leg = DH.mapAt(map, tx, ty);
    if (leg.s) return true;
    return false;
  }
  function canStand(px, py) {
    /* a small box at the feet */
    return !solidAt(px - 3, py - 2) && !solidAt(px + 3, py - 2) &&
      !solidAt(px - 3, py - 6) && !solidAt(px + 3, py - 6);
  }
  function tileOf(e) { return { x: Math.floor(e.px / T), y: Math.floor((e.py - 4) / T) }; }

  /* =============== update =============== */
  function update(dt) {
    if (!map || !player) return;
    const blocked = DH.ui.dlgVisible() || DH.ui.modalOpen() || menuOpen;

    if (!blocked) handleInput(dt);
    updateFollowers(dt);
    updateNpcs(dt);
    G.camFollow(player.px, player.py - 8, { w: map.pxW, h: map.pxH });
    findPrompt();
    if (!blocked) checkExits();
    if (!blocked) checkTriggers();
    if (G.tick % 20 === 0) updateHud();
  }

  function handleInput(dt) {
    const pc = DH.game.pc();
    const ax = DH.input.axis();
    const run = DH.input.isDown('run');
    const spd = (run ? 96 : 58) * (pc && pc.speed ? pc.speed / 30 : 1);
    let moved = false;

    if (ax.x || ax.y) {
      /* mud and the like */
      const leg = DH.mapAt(map, Math.floor(player.px / T), Math.floor((player.py - 4) / T));
      const slowK = leg.slow ? 0.55 : 1;
      const stepX = ax.x * spd * dt * slowK, stepY = ax.y * spd * dt * slowK;
      if (canStand(player.px + stepX, player.py)) { player.px += stepX; moved = true; }
      if (canStand(player.px, player.py + stepY)) { player.py += stepY; moved = true; }
      player.px = U.clamp(player.px, 4, map.pxW - 4);
      player.py = U.clamp(player.py, 8, map.pxH - 1);
      if (Math.abs(ax.x) > Math.abs(ax.y)) player.facing = ax.x > 0 ? 'right' : 'left';
      else if (ax.y) player.facing = ax.y > 0 ? 'down' : 'up';
      /* time passes while you walk: one in-game minute per second of walking */
      DH.game.advanceMinutes(dt * 1.4);
      walkSfx += dt;
      if (walkSfx > (run ? 0.22 : 0.34)) { walkSfx = 0; DH.audio.sfx('step'); }
    }
    player.moving = moved;

    if (DH.input.tapped('use')) interact();
    if (DH.input.tapped('sheet')) openBook('sheet');
    if (DH.input.tapped('journal')) openBook('quests');
    if (DH.input.tapped('inventory')) openBook('inventory');
    if (DH.input.tapped('cancel')) openMenu();
    /* click to walk toward a point */
    if (DH.input.mouse.clicked) {
      const w = G.toWorld(DH.input.mouse.x, DH.input.mouse.y);
      const dx = w.x - player.px, dy = w.y - player.py;
      if (Math.hypot(dx, dy) < 26) interact();
    }
  }

  function updateFollowers(dt) {
    /* leader breadcrumb trail so companions walk where you walked */
    if (!player.trail) player.trail = [];
    if (player.moving && (!player.trail.length ||
      U.dist(player.px, player.py, player.trail[0].x, player.trail[0].y) > 5)) {
      player.trail.unshift({ x: player.px, y: player.py, f: player.facing });
      if (player.trail.length > 90) player.trail.pop();
    }
    followers.forEach((f, i) => {
      const lead = player.trail[Math.min(player.trail.length - 1, f.lag)];
      if (!lead) return;
      /* Walking, they used to stack onto the exact breadcrumbs you left, which
         put the whole party in single file inside your own footprints. Each one
         now holds station off to one side of the path — the offset is turned
         perpendicular to the direction you were facing at that breadcrumb, so
         the formation swings around corners with you instead of through walls.
         Standing still, they spread into their own spots around you. */
      let want;
      if (player.moving) {
        const along = lead.f === 'left' ? [-1, 0] : lead.f === 'right' ? [1, 0]
          : lead.f === 'up' ? [0, -1] : [0, 1];
        const perp = [-along[1], along[0]];
        want = { x: lead.x + perp[0] * f.side, y: lead.y + perp[1] * f.side };
        /* never hold station inside scenery */
        if (!canStand(want.x, want.y)) want = lead;
      } else {
        want = { x: player.px + f.ox, y: player.py + f.oy };
      }
      const dx = want.x - f.px, dy = want.y - f.py;
      const d = Math.hypot(dx, dy);
      if (d > 3) {
        const sp = Math.min(130, 50 + d * 3);
        f.px += dx / d * sp * dt; f.py += dy / d * sp * dt;
        f.moving = true;
        f.facing = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
      } else f.moving = false;
    });
  }

  function updateNpcs(dt) {
    npcs.forEach(n => {
      if (!n.wander) return;
      n.wanderT -= dt;
      if (n.wanderT <= 0) {
        n.wanderT = 1.4 + U.rnd() * 3;
        n.wdx = U.rint(-1, 1); n.wdy = U.rint(-1, 1);
      }
      if (n.wdx || n.wdy) {
        const nx = n.px + n.wdx * 18 * dt, ny = n.py + n.wdy * 18 * dt;
        if (canStand(nx, ny) && U.dist(nx, ny, n.homeX, n.homeY) < 34) {
          n.px = nx; n.py = ny; n.moving = true;
          n.facing = Math.abs(n.wdx) > Math.abs(n.wdy) ? (n.wdx > 0 ? 'right' : 'left') : (n.wdy > 0 ? 'down' : 'up');
        } else n.moving = false;
      }
    });
  }

  /* =============== interaction =============== */
  function findPrompt() {
    promptTarget = null;
    /* an NPC within reach */
    let best = null, bestD = 22;
    npcs.forEach(n => {
      const d = U.dist(player.px, player.py, n.px, n.py);
      if (d < bestD) { bestD = d; best = { kind: 'npc', npc: n, label: n.name }; }
    });
    if (best) promptTarget = best;
    else {
      /* a tile in front */
      const dirs = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
      const d = dirs[player.facing];
      const t = tileOf(player);
      const cands = [{ x: t.x + d[0], y: t.y + d[1] }, { x: t.x, y: t.y }];
      for (const c of cands) {
        const leg = DH.mapAt(map, c.x, c.y);
        if (leg.i) {
          const lbl = interactLabel(leg, c);
          if (lbl) { promptTarget = { kind: 'tile', x: c.x, y: c.y, leg: leg, label: lbl }; break; }
        }
      }
    }
    if (promptTarget) DH.ui.showPrompt('<b>Space</b> ' + DH.ui.esc(promptTarget.label));
    else DH.ui.hidePrompt();
  }

  function interactLabel(leg, c) {
    const key = c.x + ',' + c.y;
    switch (leg.i) {
      case 'forage': return nodeUsed(key) ? null : 'Forage here';
      case 'mine': return nodeUsed(key) ? null : 'Work the ore';
      case 'fish': return 'Fish';
      case 'bed': return 'Sleep until morning';
      case 'chest': return DH.game.flag('chest_' + DH.game.state.map + '_' + key) ? null : 'Open the chest';
      case 'workbench': return 'Use the workbench';
      case 'plot': return plotLabel(c);
      case 'barrel': return 'Search the barrel';
      case 'crate': return 'Search the crate';
      case 'bookshelf': return 'Read the shelves';
      case 'sign': return 'Read the sign';
      case 'stall': return 'Look over the stall';
      case 'pole': return 'Examine the pole';
      case 'statue': return 'Examine the statue';
      case 'lever': return 'Pull the lever';
      case 'commandpod': return 'The Command Pod';
      case 'pedestal': return 'Examine the pedestal';
      case 'hammock': return 'A hammock';
      case 'gel': return 'The dead gelatinous cube';
      case 'bones': return 'Search the bones';
      case 'glowtile': return 'A glowing tile';
      case 'egg': return 'The golden egg';
      case 'door': case 'stairs': return null;
      default: return null;
    }
  }
  function nodeUsed(key) {
    const m = DH.game.state.nodes[DH.game.state.map] || {};
    return m[key] === DH.game.state.day;
  }
  function markNode(key) {
    const st = DH.game.state;
    st.nodes[st.map] = st.nodes[st.map] || {};
    st.nodes[st.map][key] = st.day;
  }
  function plotLabel(c) {
    const crop = DH.game.state.crops.find(k => k.map === DH.game.state.map && k.x === c.x && k.y === c.y);
    if (!crop) return 'Plant a seed';
    if (crop.growth >= 4) return 'Harvest';
    return crop.watered ? 'Already watered' : 'Water the plant';
  }

  function interact() {
    if (!promptTarget) return;
    if (DH.scenes.script.isRunning()) return;
    DH.audio.sfx('select');
    if (promptTarget.kind === 'npc') {
      const n = promptTarget.npc;
      if (n.script) DH.scenes.script.run(n.script, { npc: n });
      return;
    }
    const c = promptTarget, key = c.x + ',' + c.y;
    switch (c.leg.i) {
      case 'forage': doForage(c, key); break;
      case 'mine': doMine(c, key); break;
      case 'fish': DH.game.push(DH.scenes.minigames, { game: 'fishing' }); break;
      case 'bed': doSleep(); break;
      case 'chest': doChest(c, key); break;
      case 'workbench': DH.game.push(DH.scenes.minigames, { game: 'craft' }); break;
      case 'plot': doPlot(c); break;
      case 'barrel': case 'crate': doSearch(c, key); break;
      case 'bookshelf': flavour('Ledgers, tide tables and one novel with the cover torn off. Nothing you need.'); break;
      case 'sign': doSign(); break;
      case 'stall': flavour('Trinkets, salt fish and a bucket of something that used to be alive. The seller watches you.'); break;
      case 'pole': doPole(); break;
      case 'statue': DH.scenes.script.run('statue_examine'); break;
      case 'lever': DH.scenes.script.run('mine_lever'); break;
      case 'commandpod': DH.scenes.script.run('command_pod'); break;
      case 'pedestal': DH.scenes.script.run('pedestal_examine'); break;
      case 'hammock': flavour('Canvas, rope, and the smell of other people\'s sleep. It swings when the ship rolls.'); break;
      case 'gel': DH.scenes.script.run('mine_cube'); break;
      case 'bones': doSearch(c, key); break;
      case 'glowtile': flavour('Four tiles glow faintly on this side of the rays. Standing on one feels like being measured.'); break;
      case 'egg': DH.scenes.script.run('ball_egg'); break;
    }
  }
  function flavour(text) { DH.scenes.script.runInline([{ t: 'say', text: text }]); }

  async function doForage(c, key) {
    markNode(key);
    const node = c.leg.node;
    const pool = node === 'mushroom' ? [['mushroom_cap', 3], ['herb_bloodroot', 1]]
      : node === 'drift' ? [['driftwood', 3], ['gem_small', 0.2]]
        : [['herb_bloodroot', 3], ['herb_seaglass_moss', 2], ['herb_emberleaf', 1.4]];
    const got = U.pickWeighted(pool);
    const qty = U.rint(1, 2);
    DH.game.giveItem(got, qty);
    DH.audio.sfx('dig');
    G.emit('dust', c.x * T + 8, c.y * T + 10, 6, { up: 0.6, life: 22 });
    DH.game.advanceMinutes(10);
    /* a survival check for a bonus find */
    const pc = DH.game.pc();
    if (U.chance(0.3)) {
      const r = DH.dice.d20({ mod: C.skillMod(pc, 'survival'), dc: 13 });
      if (r.success) { DH.game.giveItem(got, 1); DH.ui.toast('A good eye — an extra ' + DH.item(got).name, 'good'); }
    }
  }
  async function doMine(c, key) {
    const pc = DH.game.pc();
    markNode(key);
    DH.audio.sfx('dig');
    G.shake(2);
    G.emit('dust', c.x * T + 8, c.y * T + 8, 10, { life: 24 });
    const r = DH.dice.d20({ mod: C.abMod(pc, 'str'), dc: 10 });
    const kind = U.pickWeighted([['ore_copper', 5], ['ore_iron', 2.5], ['ore_silver', 0.8]]);
    DH.game.giveItem(kind, r.success ? 2 : 1);
    DH.game.advanceMinutes(15);
  }
  async function doSleep() {
    const yes = await DH.ui.choose([
      { text: 'Sleep until morning. (Long rest — restores everything, advances the day)' },
      { text: 'Not yet.' }
    ], { text: 'A bed, blankets, and the sound of rain on a roof for once.' });
    DH.ui.hideDlg();
    if (yes !== 0) return;
    await DH.ui.fadeOut(500);
    DH.game.longRest();
    DH.game.checkDeadlines();
    updateHud();
    await U.wait(300);
    await DH.ui.fadeIn(600);
  }
  async function doChest(c, key) {
    DH.game.setFlag('chest_' + DH.game.state.map + '_' + key);
    DH.audio.sfx('door');
    const table = DH.LOOT[map.lootTable || 'crew_chest'] || DH.LOOT.crew_chest;
    const lines = [];
    table.forEach(row => {
      if (U.chance(0.75)) { DH.game.giveItem(row[0], row[1], true); lines.push(DH.item(row[0]).name + (row[1] > 1 ? ' ×' + row[1] : '')); }
    });
    const gold = U.rint(8, 40);
    DH.game.giveGold(gold);
    DH.scenes.script.runInline([{ t: 'say', text: 'Inside: ' + (lines.length ? U.listing(lines) : 'not much') + ', and ' + gold + ' gold.' }]);
  }
  async function doSearch(c, key) {
    if (DH.game.flag('searched_' + DH.game.state.map + '_' + key)) {
      flavour('You have already been through this one.'); return;
    }
    DH.game.setFlag('searched_' + DH.game.state.map + '_' + key);
    if (U.chance(0.55)) {
      const row = U.pick(DH.LOOT.town_barrel);
      DH.game.giveItem(row[0], row[1]);
    } else {
      flavour('Bilge water and a dead spider.');
    }
  }
  function doSign() {
    const lines = {
      town_square: 'DRAKEHAVEN — market west, tavern east, town hall south, dock north. Below that, someone has scratched: "the dragons are not asking politely."',
      market: 'NO REFUNDS ON ANYTHING THAT MOVES.',
      dig_site: 'CAVE CLOSED BY ORDER OF THE MAYOR. Underneath, in different handwriting: "closed by a rockfall, actually."'
    };
    flavour(lines[DH.game.state.map] || 'The paint has gone. Whatever it said, the weather won.');
  }
  function doPole() {
    if (DH.game.flag('act2_started')) {
      DH.scenes.script.run('act2_investigate');
    } else {
      flavour('An iron pole in the middle of the square with rope wound round it. Something was tied here.');
    }
  }
  async function doPlot(c) {
    const st = DH.game.state;
    let crop = st.crops.find(k => k.map === st.map && k.x === c.x && k.y === c.y);
    if (!crop) {
      if (!C.hasItem(DH.game.pc(), 'herb_bloodroot')) {
        flavour('Tilled soil, ready for something. You would need a root or a cutting to plant.');
        return;
      }
      C.removeItem(DH.game.pc(), 'herb_bloodroot', 1);
      st.crops.push({ map: st.map, x: c.x, y: c.y, growth: 1, watered: true, day: st.day });
      DH.ui.toast('Planted, and watered.', 'good');
      DH.game.advanceMinutes(10);
    } else if (crop.growth >= 4) {
      U.remove(st.crops, crop);
      DH.game.giveItem('herb_bloodroot', U.rint(2, 3));
      DH.game.advanceMinutes(5);
    } else if (!crop.watered) {
      crop.watered = true;
      DH.ui.toast('Watered.', '');
      DH.game.advanceMinutes(5);
    } else {
      flavour('It has had its water. Give it a day.');
    }
  }

  /* =============== exits and triggers =============== */
  function checkExits() {
    const t = tileOf(player);
    /* a door you just walked out of should not immediately suck you back in */
    if (spawnTile) {
      if (spawnTile.x === t.x && spawnTile.y === t.y) return;
      spawnTile = null;
    }
    for (const e of (map.exits || [])) {
      if (e.x !== t.x || e.y !== t.y) continue;
      if (e.gate && !DH.game.flag(e.gate)) {
        if (G.tick % 40 === 0) DH.ui.toast('Not yet.', '', 900);
        continue;
      }
      DH.audio.sfx('door');
      DH.game.travel(e.to, e.spawn);
      return;
    }
  }
  function checkTriggers() {
    /* Never consume a one-shot beat while another script owns the screen — the
       runner would refuse it and the scene would be lost for good. */
    if (DH.scenes.script.isRunning()) return;
    const t = tileOf(player);
    for (const tr of (map.triggers || [])) {
      if (t.x < tr.x || t.y < tr.y || t.x >= tr.x + tr.w || t.y >= tr.y + tr.h) continue;
      if (tr.needFlag && !DH.game.flag(tr.needFlag)) continue;
      const key = 'trig_' + map.id + '_' + tr.script;
      if (tr.once && DH.game.flag(key)) continue;
      if (tr.once) DH.game.setFlag(key);
      DH.scenes.script.run(tr.script);
      return;
    }
  }

  /* =============== drawing =============== */
  function draw() {
    if (!map) return;
    const cam = G.cam;
    const x0 = Math.max(0, Math.floor(cam.x / T)), y0 = Math.max(0, Math.floor(cam.y / T));
    const x1 = Math.min(map.w - 1, Math.ceil((cam.x + G.viewW()) / T));
    const y1 = Math.min(map.h - 1, Math.ceil((cam.y + G.viewH()) / T));

    /* ground — the painters subtract the camera themselves */
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        G.drawTile(DH.LEGEND[map.rows[y][x]].t, x, y);
      }
    }
    /* props and creatures share one depth-sorted list */
    const drawables = [];
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const leg = DH.LEGEND[map.rows[y][x]];
        if (!leg.p) continue;
        const px = x, py = y, lg = leg;
        drawables.push({ sortY: y * T + T, fn: () => G.drawProp(lg.p, px, py, propOpts(px, py, lg)) });
      }
    }
    /* creatures sorted by feet so they layer like a top-down world */
    npcs.forEach(n => drawables.push({
      sortY: n.py, fn: () => {
        G.creature(n.spec, n.px, n.py, {
          scale: n.scale, facing: n.facing, moving: n.moving, bob: !n.asleep,
          phase: (n.px + n.py) * 0.05
        });
        drawName(n.name, n.px, n.py - 26 * (n.scale || 1));
      }
    }));
    followers.forEach(f => drawables.push({
      sortY: f.py, fn: () => {
        G.creature(C.visualFor(f.ch), f.px, f.py, {
          scale: f.ch.scale || 1, facing: f.facing, moving: f.moving,
          weapon: C.weaponArt(f.ch), phase: f.delay
        });
      }
    }));
    drawables.push({
      sortY: player.py + 1, fn: () => {
        G.creature(player.spec, player.px, player.py, {
          scale: player.scale, facing: player.facing, moving: player.moving, weapon: player.weapon
        });
      }
    });
    drawables.sort((a, b) => a.sortY - b.sortY);
    drawables.forEach(d => d.fn());

    /* the highlighted interactable */
    if (promptTarget && promptTarget.kind === 'tile') {
      const px = promptTarget.x * T - cam.x, py = promptTarget.y * T - cam.y;
      G.alpha(0.35 + Math.sin(G.tick * 0.15) * 0.2, () => {
        G.stroke(px, py, T, T, G.C.gold, 1, true);
      });
    }
    if (promptTarget && promptTarget.kind === 'npc') {
      const n = promptTarget.npc;
      G.alpha(0.5 + Math.sin(G.tick * 0.15) * 0.3, () => {
        G.label('▾', n.px, n.py - 34 * (n.scale || 1), { align: 'center', size: 10, color: G.C.gold });
      });
    }

    G.updateParticles();
    G.updateFloaters();

    /* weather, then light */
    if (map.rain) G.rain(map.rain, 5);
    if (map.fog) {
      G.alpha(0.22, () => G.rect(0, 0, G.viewW(), G.viewH(), '#7a8a7a', true));
    }
    const dark = map.indoor ? (map.baseDark || 0) : Math.max(map.baseDark || 0, DH.game.darkness());
    if (dark > 0.02) {
      const lights = [{ x: player.px, y: player.py - 10, r: 92, flicker: false }];
      (map.lights || []).forEach(l => lights.push({ x: l.x * T + T / 2, y: l.y * T + T / 2, r: l.r, flicker: l.flicker }));
      /* torches on the map light themselves */
      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
        const leg = DH.LEGEND[map.rows[y][x]];
        if (leg.l) lights.push({ x: x * T + T / 2, y: y * T + T / 2, r: leg.l, flicker: true });
      }
      G.lighting(dark, lights);
    }
    if (map.thunder && U.chance(0.002)) { G.flash(0.4); G.shake(3); }
    G.vignette(0.35);
  }

  function propOpts(x, y, leg) {
    if (leg.plot) {
      const crop = DH.game.state.crops.find(k => k.map === map.id && k.x === x && k.y === y);
      return crop ? { growth: crop.growth } : null;
    }
    if (leg.i === 'chest') return { open: DH.game.flag('chest_' + map.id + '_' + x + ',' + y) };
    if (leg.i === 'lever') return { on: DH.game.flag('lever_pulled') };
    if (leg.i === 'pole') return { rope: !DH.game.flag('act2_started') };
    if (leg.p === 'rune') return { i: x + y };
    return null;
  }
  function drawName(name, wx, wy) {
    if (!name) return;
    G.alpha(0.85, () => G.label(name, wx, wy, { align: 'center', size: 8, color: G.C.inkDim }));
  }

  return {
    name: 'overworld', get zoom() { return worldZoom; }, enter, exit, resume, pause, update, draw,
    loadMap, updateHud, refreshPlayerLook,
    get player() { return player; },
    get map() { return map; },
    get npcs() { return npcs; },
    /* read-only seam for tooling: lets a test measure the follow formation */
    inspect() { return { player: player, followers: followers, npcs: npcs, zoom: worldZoom }; }
  };
})();

</script>
<script>
/* ---- js/scenes/combat.js ---- */
/* Drakehaven Island — grid combat. Squares are five feet. Click one to go there.
   Implements the table's house rules: Ending Action, no opportunity attacks,
   crits that carry, shared initiative, and the P.A.C.T. Pod shield. */
window.DH = window.DH || {};

DH.scenes.combat = (function () {
  'use strict';
  const U = DH.util, G = DH.gfx, C = DH.char, CELL = DH.gfx.CELL;

  let arena = null, grid = null, units = [], order = [], turn = 0, round = 1;
  let ox = 0, oy = 0;                    // grid origin on screen
  let mode = null;                       // current selected action
  let reach = null;                      // reachable tiles for the active unit
  let hoverTile = null, hoverUnit = null;
  let busy = false, finished = false, onDone = null, encounter = null;
  let log = [], animQueue = [];
  let bannerShown = false, resolved = false;
  /* guards a turn from being advanced twice — by a key press racing the AI, say */
  let advancing = false;

  /* How long each piece of feedback lasts, in frames at 60fps. Kept together so
     the animation and the countdown that drives it cannot drift apart. */
  const ATTACK_FRAMES = 12;   // lunge out and back
  const FLASH_FRAMES = 10;    // the struck body lit up
  const DOWN_FRAMES = 26;     // sinking as it falls
  /* Squares a struck body is thrown, and where an attacker stops short of one. */
  const LUNGE_PX = 7;
  /* tiles lit for a moment to show what an area effect covered */
  let tileFx = [];
  /* which particle palette a spell's damage type flies as */
  const SPELL_MOTE = {
    fire: 'fire', cold: 'ice', lightning: 'spark', thunder: 'spark',
    acid: 'acid', poison: 'poison', necrotic: 'necro', radiant: 'gold',
    force: 'arcane', psychic: 'arcane'
  };

  /* =============== entry =============== */
  function enter(arg) {
    encounter = arg || {};
    finished = false; busy = false; advancing = false; round = 1; turn = 0; mode = null; log = [];
    bannerShown = false; resolved = false; tileFx = [];
    onDone = encounter.onDone || null;
    buildArena(encounter.arena || 'town_street');
    placeUnits();
    rollInitiative();
    buildUI();
    DH.audio.play(arena.music || 'battle');
    if (arena.rain) DH.audio.stormThunder(true);
    DH.ui.banner('BATTLE', arena.name, 1800);
    setTimeout(() => beginTurn(), 900);
  }
  function exit() {
    DH.ui.clear(); DH.audio.stormThunder(false); G.clearParticles(); G.clearFloaters();
    /* A bolt still in flight is awaited by whatever fired it, so release those
       before anything else — otherwise a mid-attack travel hangs the script. */
    G.clearBolts(); tileFx = [];
    /* If we are torn down without the fight ending — a travel, a reset — release
       whatever story script is awaiting us rather than leaving it hanging. */
    if (!resolved && onDone) { resolved = true; const f = onDone; onDone = null; f({ won: false, aborted: true }); }
  }

  function buildArena(id) {
    const def = DH.ARENAS[id] || DH.ARENAS.town_street;
    arena = def;
    grid = [];
    for (let y = 0; y < def.h; y++) {
      grid[y] = [];
      for (let x = 0; x < def.w; x++) {
        grid[y][x] = { t: def.tile || 'stonefloor', solid: false, prop: null, hazard: null, difficult: !!def.difficultAll, cold: false, climb: false };
      }
    }
    (def.water || []).forEach(r => {
      for (let y = r.y; y < r.y + r.h; y++) for (let x = r.x; x < r.x + r.w; x++)
        if (grid[y] && grid[y][x]) { grid[y][x].t = 'water'; grid[y][x].solid = true; }
    });
    (def.walls || []).forEach(r => {
      for (let y = r.y; y < r.y + r.h; y++) for (let x = r.x; x < r.x + r.w; x++)
        if (grid[y] && grid[y][x]) { grid[y][x].t = 'wall'; grid[y][x].solid = true; }
    });
    (def.props || []).forEach(p => {
      const c = grid[p.y] && grid[p.y][p.x];
      if (!c) return;
      c.prop = p.kind;
      c.solid = !!p.solid;
      c.hazard = p.hazard || null;
      c.cold = !!p.cold;
      c.climb = !!p.climb;
      c.throwable = ['barrel', 'coldbarrel', 'crate', 'bottle'].indexOf(p.kind) >= 0;
      c.hp = c.throwable ? 8 : null;
      c.light = p.light || null;
    });
    /* centre the grid on screen */
    ox = Math.floor((G.VW - def.w * CELL) / 2);
    oy = Math.floor((G.VH - def.h * CELL) / 2) - 6;
  }

  /* =============== unit construction =============== */
  /* isPC  — the one character the player drives with the action bar.
     isCharacter — anyone using the full character rules (the player and the five
     companions), as opposed to a monster stat block. Your companions are other
     people's characters: they fight alongside you, they do not wait for orders. */
  function unitFromChar(ch, side) {
    return {
      ch: ch, side: side, name: ch.name,
      x: 0, y: 0, px: 0, py: 0,
      spec: C.visualFor(ch), scale: ch.scale || 1,
      weapon: C.weaponArt(ch),
      isPC: !!ch.isPlayer, isCharacter: true, dead: false,
      ai: ch.ai || { prefer: 'melee', focus: 'nearest' },
      eco: freshEconomy(ch), used: {},
      facing: side === 'party' ? 'right' : 'left',
      /* animation state, counted down in update() */
      attackAnim: 0, flash: 0, downAnim: 0, walking: false, lunge: null
    };
  }
  function unitFromMonster(id, side, tweaks) {
    const src = DH.monster(id);
    if (!src) return null;
    const m = U.deep(src);
    const ch = {
      name: (tweaks && tweaks.name) || m.name, kind: 'npc', monsterId: id,
      level: 1, abilities: m.abilities, hp: m.hp, hpMax: m.hp, tempHp: 0, ac: m.ac,
      speed: m.speed, prof: 2, skills: [], saveProfs: [], expertise: [],
      effects: [], conditions: [], inv: [], equipped: {}, res: {},
      spells: { known: [], cantrips: [], prepared: [], slots: {}, slotsMax: {} },
      resistList: m.resist || [], immuneList: m.immune || [], vulnList: m.vuln || [],
      npcActions: m.actions || [], multiattack: m.multiattack || 1,
      traits: m.traits || [], initBonus: m.init || 0,
      xp: m.xp || 0, boss: !!m.boss, blurb: m.blurb, dying: false, dead: false,
      deathSaves: { s: 0, f: 0 }, monsterSaves: m.saves || {}, monsterSkills: m.skills || {}
    };
    if (tweaks && tweaks.hp) { ch.hp = ch.hpMax = tweaks.hp; }
    /* monsters use fixed lists rather than the effect engine */
    (m.traits || []).forEach(t => (t.effects || []).forEach(e => ch.effects.push(e)));
    (m.resist || []).forEach(t => ch.effects.push('resist:' + t));
    (m.immune || []).forEach(t => ch.effects.push('immune:' + t));
    (m.vuln || []).forEach(t => ch.effects.push('vuln:' + t));
    (m.actions || []).forEach(a => { if (a.uses) ch.res['act_' + a.name] = { cur: a.uses, max: a.uses }; });
    return {
      ch: ch, side: side, name: ch.name, x: 0, y: 0, px: 0, py: 0,
      spec: m.visual, scale: m.scale || 1, isPC: false, dead: false,
      eco: freshEconomy(ch), used: {}, recharge: {},
      facing: side === 'party' ? 'right' : 'left', monsterId: id, ai: m.ai || { prefer: 'melee' },
      /* animation state, counted down in update() */
      attackAnim: 0, flash: 0, downAnim: 0, walking: false, lunge: null
    };
  }
  function freshEconomy(ch) {
    return {
      move: ch.speed || 30, moveMax: ch.speed || 30,
      action: 1, bonus: 1, reaction: 1, ending: 1, extra: 0,
      attacksLeft: 0
    };
  }

  function placeUnits() {
    units = [];
    const pz = arena.playerZone || { x: 2, y: 4, w: 4, h: 4 };
    const ez = arena.enemyZone || { x: 14, y: 4, w: 4, h: 4 };
    /* the party */
    const party = DH.game.party().filter(c => !c.dead);
    party.forEach((ch, i) => {
      const u = unitFromChar(ch, 'party');
      const spot = freeSpot(pz, i);
      u.x = spot.x; u.y = spot.y;
      snap(u);
      units.push(u);
    });
    /* the pet, if you tamed it */
    if (DH.game.state.pet) {
      const u = unitFromMonster(DH.game.state.pet, 'party');
      if (u) { const s = freeSpot(pz, party.length); u.x = s.x; u.y = s.y; snap(u); u.ch.name = 'Cat'; units.push(u); }
    }
    /* the enemies */
    (encounter.enemies || []).forEach((e, i) => {
      const id = typeof e === 'string' ? e : e.id;
      const u = unitFromMonster(id, 'foe', typeof e === 'object' ? e : null);
      if (!u) return;
      const spot = (typeof e === 'object' && e.x != null) ? { x: e.x, y: e.y } : freeSpot(ez, i);
      u.x = spot.x; u.y = spot.y;
      snap(u);
      units.push(u);
      DH.game.state.bestiary[id] = (DH.game.state.bestiary[id] || 0) + 1;
    });
    /* friendly extras (crew, guards) */
    (encounter.allies || []).forEach((a, i) => {
      const id = typeof a === 'string' ? a : a.id;
      const u = unitFromMonster(id, 'party');
      if (!u) return;
      const spot = freeSpot(pz, 20 + i);
      u.x = spot.x; u.y = spot.y; snap(u);
      units.push(u);
    });
  }
  function freeSpot(zone, i) {
    for (let tries = 0; tries < 200; tries++) {
      const x = zone.x + ((i + tries) % zone.w);
      const y = zone.y + Math.floor(((i + tries) / zone.w) % zone.h);
      if (walkable(x, y) && !unitAt(x, y)) return { x, y };
    }
    /* fall back to anything open */
    for (let y = 0; y < arena.h; y++) for (let x = 0; x < arena.w; x++)
      if (walkable(x, y) && !unitAt(x, y)) return { x, y };
    return { x: zone.x, y: zone.y };
  }
  function snap(u) { u.px = ox + u.x * CELL + CELL / 2; u.py = oy + u.y * CELL + CELL - 3; }
  /* Walk a unit into an adjacent square instead of teleporting into it. The grid
     position changes immediately — rules and reach must not see a unit halfway
     between two squares — while px/py catch up over the same time the old
     instant hop used to wait, with the walk cycle running. Used by the player's
     movement and by every AI mover, so nobody slides around without legs. */
  async function glideTo(u, gx, gy, ms) {
    u.facing = gx > u.x ? 'right' : gx < u.x ? 'left' : u.facing;
    const fromX = u.px, fromY = u.py;
    u.x = gx; u.y = gy;
    const toX = ox + gx * CELL + CELL / 2, toY = oy + gy * CELL + CELL - 3;
    const frames = 5, step = Math.max(8, Math.round((ms == null ? 75 : ms) / frames));
    u.walking = true;
    for (let k = 1; k <= frames; k++) {
      u.px = fromX + (toX - fromX) * k / frames;
      u.py = fromY + (toY - fromY) * k / frames;
      await U.wait(step);
    }
    u.walking = false;
    snap(u);
  }

  /* =============== initiative =============== */
  function rollInitiative() {
    units.forEach(u => {
      const ch = u.ch;
      const bonus = u.isCharacter ? (ch.initBonus != null ? ch.initBonus : C.abMod(ch, 'dex')) : (ch.initBonus || 0);
      const adv = u.isCharacter && C.hasEffect(ch, 'adv_initiative');
      const r = DH.dice.d20({ mod: bonus, adv: adv });
      u.init = r.total;
      u.initRoll = r.natural;
    });
    /* Shared initiative: on a tie the party goes first, and party ties keep
       their listed order so the player can coordinate. */
    order = units.slice().sort((a, b) => {
      if (b.init !== a.init) return b.init - a.init;
      if (a.side !== b.side) return a.side === 'party' ? -1 : 1;
      return 0;
    });
    logLine('Initiative: ' + order.map(u => u.name + ' ' + u.init).join(', '), 'turn');
  }

  /* =============== queries =============== */
  function unitAt(x, y) { return units.find(u => !u.dead && u.x === x && u.y === y); }
  function cell(x, y) { return (grid[y] && grid[y][x]) || null; }
  function inBounds(x, y) { return x >= 0 && y >= 0 && x < arena.w && y < arena.h; }
  function walkable(x, y) {
    if (!inBounds(x, y)) return false;
    const c = cell(x, y);
    return c && !c.solid;
  }
  function active() { return order[turn % order.length]; }
  function foesOf(u) { return units.filter(v => !v.dead && v.side !== u.side); }
  function alliesOf(u) { return units.filter(v => !v.dead && v.side === u.side && v !== u); }
  function partyAlive() { return units.some(u => !u.dead && u.side === 'party' && !u.ch.dying); }
  function foesAlive() { return units.some(u => !u.dead && u.side === 'foe'); }

  /* movement cost map for the active unit */
  function computeReach(u) {
    const speed = u.eco.move;
    const res = U.flood(u.x, u.y, arena.w, arena.h, (nx, ny) => {
      if (!walkable(nx, ny)) return false;
      const other = unitAt(nx, ny);
      if (other && other !== u) return false;
      const c = cell(nx, ny);
      return (c.difficult || c.hazard === 'spore' ? 10 : 5);
    }, speed, true);
    return res;
  }

  /* =============== turn flow =============== */
  function beginTurn() {
    advancing = false;
    if (finished) return;
    const u = active();
    if (!u) return;
    if (u.dead) { nextTurn(); return; }
    u.eco = freshEconomy(u.ch);
    if (C.hasCondition(u.ch, 'hasted')) u.eco.move *= 2;
    if (C.hasCondition(u.ch, 'slowed')) u.eco.move = Math.floor(u.eco.move / 2);
    if (C.hasCondition(u.ch, 'grappled') || C.hasCondition(u.ch, 'restrained') ||
      C.hasCondition(u.ch, 'stuck')) u.eco.move = 0;
    /* the pod shield lapses at the start of your turn */
    C.removeCondition(u.ch, 'shielded');
    C.removeCondition(u.ch, 'dodging');
    mode = null;
    /* start-of-turn damage */
    if (C.hasCondition(u.ch, 'burning')) {
      const r = DH.dice.roll('1d6');
      damage(u, r.total, 'fire', { src: 'burning' });
      logLine(u.name + ' is burning: ' + r.total + ' fire.', 'hit');
    }
    if (u.ch.dying) { deathSaveFor(u); nextTurn(); return; }
    if (C.incapacitated(u.ch)) {
      logLine(u.name + ' cannot act.', 'turn');
      setTimeout(() => nextTurn(), 500);
      return;
    }
    logLine('— ' + u.name + '\'s turn (round ' + round + ') —', 'turn');
    reach = computeReach(u);
    refreshUI();
    if (u.side === 'foe' || (!u.isPC && u.side === 'party')) {
      busy = true;
      setTimeout(() => aiTurn(u), 520);
    } else busy = false;
  }

  function endTurn() {
    if (advancing || finished) return;
    const u = active();
    if (!u) return;
    /* concentration and conditions tick down at the end of the turn */
    C.tickConditions(u.ch);
    /* recharge abilities */
    if (u.recharge) Object.keys(u.recharge).forEach(k => { if (u.recharge[k] > 0) u.recharge[k]--; });
    nextTurn();
  }
  function nextTurn() {
    if (finished || advancing) return;
    advancing = true;
    mode = null; reach = null;
    turn++;
    if (turn % order.length === 0) {
      round++;
      onRoundEnd();
    }
    if (checkEnd()) return;
    setTimeout(beginTurn, 160);
  }
  function onRoundEnd() {
    logLine('=== Round ' + round + ' ===', 'turn');
    if (encounter.onRound) encounter.onRound(round, api());
  }

  function checkEnd() {
    if (finished) return false;
    if (!foesAlive()) { finish(true); return true; }
    if (!partyAlive()) { finish(false); return true; }
    if (encounter.winWhen && encounter.winWhen(api())) { finish(true); return true; }
    return false;
  }

  async function finish(won) {
    finished = true;
    busy = true;
    DH.audio.play(won ? 'victory' : 'defeat', { restart: true });
    DH.ui.banner(won ? 'VICTORY' : 'DEFEAT', won ? arena.name : 'The party falls', 2200);
    await U.wait(1600);

    /* the house rule: a dead character loses a level */
    const fallen = DH.game.party().filter(c => c.dead);
    if (won) {
      let xp = 0;
      units.filter(u => u.side === 'foe').forEach(u => xp += (u.ch.xp || 50));
      xp = Math.max(25, Math.floor(xp / Math.max(1, DH.game.party().length)));
      /* stabilise anyone who was down */
      DH.game.party().forEach(c => {
        if (c.dying) { c.dying = false; c.hp = 1; c.deathSaves = { s: 0, f: 0 }; C.removeCondition(c, 'unconscious'); }
        c.conditions = (c.conditions || []).filter(x => ['exhaustion'].indexOf(x.id) >= 0);
        c.concentration = null;
      });
      DH.game.awardXp(xp);
    }
    for (const c of fallen) {
      await DH.ui.say({
        who: 'The Table', narr: true,
        text: c.name + ' failed their last death save.\n\nHouse rule: you lose one character level. You may keep this character, or make a new one a level below the others.'
      });
      C.loseLevel(c);
      DH.ui.hideDlg();
      DH.ui.toast(c.name + ' is back on their feet, one level lighter.', 'bad', 3200);
    }
    DH.ui.hideDlg();
    const result = { won: won, xp: 0 };
    resolved = true;
    const cb = onDone; onDone = null;
    DH.game.pop(result);
    DH.game.flushOps();
    if (cb) cb(result);
  }

  /* =============== the log =============== */
  function logLine(text, cls) {
    log.unshift({ text, cls });
    if (log.length > 40) log.pop();
    const box = document.getElementById('combat-log');
    if (box) {
      const d = DH.ui.el('div', cls || '', DH.ui.esc(text));
      box.appendChild(d);
      while (box.children.length > 9) box.removeChild(box.firstChild);
    }
  }

  /* =============== damage and healing =============== */
  function damage(target, amount, type, opts) {
    opts = opts || {};
    const res = C.applyDamage(target.ch, amount, type, opts);
    if (res.dealt > 0) {
      G.floater('-' + res.dealt, target.px, target.py - 30, '#f0a09a', 11);
      G.emit(type === 'fire' ? 'fire' : type === 'cold' ? 'ice' : type === 'poison' || type === 'acid' ? 'poison'
        : type === 'necrotic' ? 'necro' : type === 'radiant' ? 'spark' : 'blood',
        target.px, target.py - 14, 8, { speed: 1.4, up: 0.6 });
      DH.audio.sfx('hit');
      G.shake(target.ch.boss ? 3 : 2);
      /* the body itself registers the hit, tinted by what hit it */
      target.flash = FLASH_FRAMES;
      target.flashCol = type === 'fire' ? '#ffd0a0' : type === 'cold' ? '#d8f4ff'
        : type === 'poison' || type === 'acid' ? '#d8ffa0' : type === 'necrotic' ? '#d8b0ff'
          : type === 'radiant' ? '#fff4c8' : '#ffe0d8';
    } else if (res.dealt === 0 && amount > 0) {
      G.floater('resisted', target.px, target.py - 30, '#9ad0f0', 9);
    }
    if (res.relentless) { G.floater('ENDURES', target.px, target.py - 42, '#7fbf5f', 10); logLine(target.name + ' refuses to go down.', 'crit'); }
    if (res.lostConcentration) logLine(target.name + ' loses concentration.', '');
    if (res.dropped) {
      logLine(target.name + ' drops!', 'hit');
      if (!target.isCharacter) { target.dead = true; onUnitDown(target); }
    }
    if (res.killed) { target.dead = true; logLine(target.name + ' is killed.', 'crit'); onUnitDown(target); }
    if (target.isCharacter && target.ch.dead) { target.dead = true; onUnitDown(target); }
    /* monsters simply die at 0 */
    if (!target.isCharacter && target.ch.hp <= 0 && !target.dead) { target.dead = true; onUnitDown(target); }
    checkEnd();
    return res;
  }
  function onUnitDown(u) {
    DH.audio.sfx('death');
    G.emit('smoke', u.px, u.py - 12, 14, { life: 40, up: 0.3 });
    /* a fall you can see: the figure sinks and fades over half a second */
    u.downAnim = DOWN_FRAMES;
    G.floater(u.isCharacter ? 'DOWN' : 'SLAIN', u.px, u.py - 44,
      u.isCharacter ? '#e9a49c' : '#d8c0ff', 10);
    if (encounter.onDown) encounter.onDown(u, api());
  }
  function healUnit(target, amount) {
    const got = C.heal(target.ch, amount);
    if (got > 0) {
      G.floater('+' + got, target.px, target.py - 30, '#7fbf5f', 11);
      G.emit('heal', target.px, target.py - 14, 8, { up: 0.8 });
      DH.audio.sfx('heal');
    }
    return got;
  }

  /* =============== attack resolution =============== */
  function attackModifiers(attacker, target, opt) {
    let adv = false, dis = false;
    const a = attacker.ch, t = target.ch;
    if (C.hasCondition(t, 'prone') && U.gdist(attacker.x, attacker.y, target.x, target.y) <= 1) adv = true;
    if (C.hasCondition(t, 'prone') && (opt && opt.ranged)) dis = true;
    if (C.hasCondition(t, 'restrained') || C.hasCondition(t, 'outlined')) adv = true;
    if (C.hasCondition(t, 'paralyzed') || C.hasCondition(t, 'unconscious') || C.hasCondition(t, 'stunned')) adv = true;
    if (C.hasCondition(a, 'prone')) dis = true;
    if (C.hasCondition(a, 'poisoned') || C.hasCondition(a, 'blinded')) dis = true;
    if (C.hasCondition(a, 'frightened')) dis = true;
    if (C.hasCondition(t, 'dodging')) dis = true;
    if (C.hasEffect(a, 'reckless_attack') && attacker.reckless) adv = true;
    if (C.hasEffect(a, 'pack_tactics')) {
      if (alliesOf(attacker).some(al => U.gdist(al.x, al.y, target.x, target.y) <= 1)) adv = true;
    }
    if (attacker.boon) { adv = true; attacker.boon = false; }
    if (attacker.markedAdvantage === target) { adv = true; attacker.markedAdvantage = null; }
    /* high ground from climbing the rigging */
    if (attacker.climbing && !(opt && opt.ranged)) adv = true;
    return { adv, dis };
  }

  function totalAC(u) {
    let ac = u.ch.ac;
    if (C.hasCondition(u.ch, 'shielded')) ac += 2;
    if (u.ch.buffs) Object.keys(u.ch.buffs).forEach(k => { if (u.ch.buffs[k].ac) ac += u.ch.buffs[k].ac; });
    if (C.hasCondition(u.ch, 'slowed')) ac -= 2;
    if (u.ch.aoeOnly && !u.aoeHit) ac = 26;   // the fly
    return ac;
  }

  async function weaponAttack(attacker, target, atkDef, opts) {
    opts = opts || {};
    const a = attacker.ch;
    const mods = attackModifiers(attacker, target, { ranged: atkDef.ranged });
    const critAt = attacker.isCharacter ? C.critRange(a) : 20;
    const r = DH.dice.d20({ mod: atkDef.atk, adv: mods.adv, dis: mods.dis, dc: totalAC(target) });
    const isCrit = r.natural >= critAt;
    attacker.facing = target.x < attacker.x ? 'left' : 'right';
    attacker.attackAnim = ATTACK_FRAMES;
    /* melee leans into the target; a bowman plants and does not */
    const dx = target.px - attacker.px, dy = target.py - attacker.py;
    const d = Math.hypot(dx, dy) || 1;
    attacker.lunge = atkDef.ranged ? { x: 0, y: 0 }
      : { x: dx / d * LUNGE_PX, y: dy / d * LUNGE_PX };
    DH.audio.sfx(atkDef.ranged ? 'bow' : 'swing');

    const hit = isCrit || (r.natural !== 1 && r.total >= totalAC(target));

    /* Watch the shot cross the ground before anything resolves at the far end. */
    if (atkDef.ranged) {
      await G.bolt(attacker.px, attacker.py - 14, target.px, target.py - 14, {
        kind: atkDef.type === 'fire' ? 'fire' : atkDef.type === 'cold' ? 'ice' : 'dust',
        size: 2, arc: 9, dur: Math.max(8, Math.min(22, Math.round(d / 9)))
      });
    } else {
      await U.wait(90);            // let the swing land before the number appears
    }

    if (!hit) {
      logLine(attacker.name + ' misses ' + target.name + ' (' + DH.dice.fmt(r) + ' vs AC ' + totalAC(target) + ')');
      G.floater('miss', target.px, target.py - 30, '#8b7a5f', 9);
      /* a near miss throws sparks off whatever it hit instead */
      G.emit('dust', target.px + (dx > 0 ? -6 : 6), target.py - 10, 5, { life: 18, speed: 1.1 });
      DH.audio.sfx('miss');
      return { hit: false, roll: r };
    }
    if (isCrit) {
      G.floater('CRIT', target.px, target.py - 48, '#e8bd58', 12);
      G.shake(5);
      G.emit('spark', target.px, target.py - 16, 22, { life: 34, speed: 2 });
    }
    /* damage */
    let total = 0;
    const parts = [];
    const gwf = attacker.isCharacter && C.hasEffect(a, 'style:great_weapon') &&
      (atkDef.props || []).indexOf('two_handed') >= 0;
    const dmgRoll = DH.dice.roll(atkDef.dmg, { crit: isCrit, rerollBelow: gwf ? 2 : 0 });
    total += dmgRoll.total + (atkDef.dmgMod || 0);
    parts.push(atkDef.dmg + (atkDef.dmgMod ? U.plus(atkDef.dmgMod) : ''));

    /* extra weapon die on a crit for savage attacks / brutal critical */
    if (isCrit && attacker.isCharacter) {
      const extraDice = (C.hasEffect(a, 'savage_crit') ? 1 : 0) + C.effectValue(a, 'brutal_crit');
      for (let i = 0; i < extraDice; i++) {
        const die = /d(\d+)/.exec(atkDef.dmg);
        if (die) total += DH.dice.d(+die[1]);
      }
    }
    /* riders that apply to any hit */
    if (attacker.isCharacter) {
      C.bonusDamage(a).forEach(b => {
        if (b.unarmedOnly && atkDef.id !== 'unarmed' && atkDef.id !== 'blue_brass_knuckles') return;
        if (b.strOnly && atkDef.ranged) return;
        if (b.flat) { total += b.flat; parts.push(U.plus(b.flat) + ' ' + b.src); }
        else { const rr = DH.dice.roll(b.dmg, { crit: isCrit }); total += rr.total; parts.push(b.dmg + ' ' + b.src); }
      });
    }
    /* the cold-water trick against the Half-Dragon */
    if (attacker.coldDipped && target.monsterId === 'half_dragon') {
      const rr = DH.dice.roll('1d6', { crit: isCrit });
      total += rr.total; parts.push('1d6 freezing water');
    }
    /* the black dragon's wounded leg */
    if (opts.weakPoint && target.ch.effects.some(e => e.indexOf('weak_point:') === 0)) {
      const dice = target.ch.effects.find(e => e.indexOf('weak_point:') === 0).split(':')[1];
      const rr = DH.dice.roll(dice, { crit: isCrit });
      total += rr.total; parts.push(dice + ' to the wounded leg');
    }
    /* sneak attack */
    if (attacker.isCharacter && C.sneakAttackDice(a) > 0 && !attacker.usedSneak &&
      ((atkDef.props || []).indexOf('finesse') >= 0 || atkDef.ranged)) {
      const canSneak = mods.adv || alliesOf(attacker).some(al => U.gdist(al.x, al.y, target.x, target.y) <= 1);
      if (canSneak) {
        const n = C.sneakAttackDice(a);
        const rr = DH.dice.roll(n + 'd6', { crit: isCrit });
        total += rr.total; parts.push(n + 'd6 sneak attack');
        attacker.usedSneak = true;
      }
    }
    /* hunter's mark / hex */
    if (attacker.mark === target) {
      const rr = DH.dice.roll('1d6', { crit: isCrit });
      total += rr.total; parts.push('1d6 mark');
    }
    /* poisons applied to the blade */
    if (attacker.coating) {
      const co = attacker.coating; attacker.coating = null;
      const sv = saveAgainst(target, co.save, co.dc);
      if (!sv.success) {
        if (co.dmg) { const rr = DH.dice.roll(co.dmg); total += rr.total; parts.push(co.dmg + ' poison'); }
