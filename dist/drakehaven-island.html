        { text: 'None, thank you.', then: [{ t: 'say', who: 'Captain Hobbs', text: '"Suit yerself. More for me."' }] }
      ]
    }
  ],
  ship_games_again: [
    {
      t: 'choice', text: 'Another?',
      options: [
        { text: 'Yes — pick another game.', run: 'ship_games' },
        { text: 'No, that is enough.', then: [{ t: 'say', who: 'Captain Hobbs', text: '"Fair enough. Ya got good sense, which is rare on my boat."' }] }
      ]
    }
  ],
  captain_dice_tell: [
    {
      t: 'choice', text: 'How are you watching him?',
      options: [
        {
          text: 'Perception — look at what is on the table. (DC 12)', then: [
            {
              t: 'check', skill: 'perception', dc: 12, label: 'Perception — the captain\'s table',
              ok: [
                { t: 'narr', text: 'There is a small box tucked half under the chart, on his side of the desk. It is the size of a set of dice, and it is not the set he handed you.' },
                { t: 'flag', k: 'saw_dice_box' }
              ],
              fail: [{ t: 'narr', text: 'Charts, a bottle, a knife holding down a corner. Nothing unusual.' }]
            }
          ]
        },
        {
          text: 'Insight — watch the man, not the table. (DC 14)', then: [
            {
              t: 'check', skill: 'insight', dc: 14, label: 'Insight — the captain',
              ok: [
                { t: 'narr', text: 'He is shifting uncomfortably in his chair and smiling in a way that has nothing to do with being happy. Whatever is about to happen on this table, he already knows the result.' },
                { t: 'flag', k: 'read_the_captain' }
              ],
              fail: [{ t: 'narr', text: 'He grins at you. He is, as far as you can tell, delighted.' }]
            }
          ]
        }
      ]
    },
    {
      t: 'if', flag: 'saw_dice_box',
      then: [{ t: 'run', id: 'captain_charlatan' }],
      else: [{ t: 'if', flag: 'read_the_captain', then: [{ t: 'run', id: 'captain_charlatan' }] }]
    }
  ],
  captain_charlatan: [
    {
      t: 'choice', text: 'Charlatan\'s dice. He has a weighted set within arm\'s reach.',
      options: [
        {
          text: 'Call him on it.', then: [
            { t: 'say', who: 'Captain Hobbs', text: '*A long pause. Then an enormous laugh.* "HA! Ya got me. Ya got me." *He slides the box across the desk to you.* "Keep \'em. I got another."' },
            { t: 'give', item: 'weighted_dice' },
            { t: 'do', fn: () => DH.game.addAffinity('captain', 3, 'Captain Hobbs') }
          ]
        },
        {
          text: 'Say nothing. Play anyway. Lose on purpose.', then: [
            { t: 'narr', text: 'You let him win. He is so pleased with himself that he tops up your glass twice and tells you a story about a whale that is almost certainly untrue.' },
            { t: 'do', fn: () => DH.game.addAffinity('captain', 2, 'Captain Hobbs') },
            { t: 'flag', k: 'let_captain_win' }
          ]
        },
        {
          text: 'Steal the box while he pours.', hint: 'Sleight of Hand', then: [
            {
              t: 'check', skill: 'sleight_of_hand', dc: 15, label: 'Sleight of Hand — the dice box',
              ok: [{ t: 'narr', text: 'It is in your sleeve before the bottle finishes glugging.' }, { t: 'give', item: 'weighted_dice' }],
              fail: [
                { t: 'say', who: 'Captain Hobbs', text: '*His hand closes over your wrist without him appearing to look.* "Nnnope." *He is still grinning.* "But I like ya more now."' },
                { t: 'do', fn: () => DH.game.addAffinity('captain', 1, 'Captain Hobbs') }
              ]
            }
          ]
        }
      ]
    }
  ],

  act0_arrival: [
    { t: 'wait', ms: 400 },
    { t: 'sfx', id: 'hit' },
    { t: 'shake', amt: 6 },
    { t: 'narr', text: 'You feel a hard rock in the ship, and you hear a crewmate yell — "WE\'RE HERE!"' },
    { t: 'say', who: 'Captain Hobbs', text: '*He stands and opens the door.* "Ah, seems like we\'re here. Drakehaven Island!"' },
    { t: 'say', who: 'Captain Hobbs', text: '"Ahh, I lived here when I was young but was kicked out for losing in the arena. Hahaha, good memories."' },

    { t: 'flag', k: 'act0_done' },
    { t: 'questDone', id: 'pact', xp: 150 },
    { t: 'travel', map: 'dock', spawn: 'start' }
  ],

  npc_captain: [
    {
      t: 'if', flag: 'invited_to_cabin',
      then: [{ t: 'say', who: 'Captain Hobbs', text: '"Cabin\'s that way. Mind the step, it\'s rotten."' }],
      else: [{ t: 'say', who: 'Captain Hobbs', text: '"Hold the rail an\' don\'t fall in. That\'s all I ask of anybody."' }]
    }
  ],
  npc_captain_cabin: [
    {
      t: 'choice', text: 'Captain Hobbs, behind his desk.',
      options: [
        { text: 'Ship games.', run: 'ship_games' },
        { text: '"Tell me about Drakehaven."', then: [{ t: 'say', who: 'Captain Hobbs', text: '"Market\'ll rob ya, tavern\'ll fleece ya, an\' the mayor\'ll thank ya politely while he does both. Arena\'s honest, though. Arena\'s the only honest thing there."' }] },
        { text: 'Nothing.', then: [] }
      ]
    }
  ],

  /* ==========================================================================
     ACT ONE — landfall and the golden dragon
     ========================================================================== */
  act1_landfall: [
    { t: 'music', id: 'town' },
    { t: 'narr', text: 'You step off the plank onto the dock. Behind you the captain waves and yells — "Nice meetin\' ya!"' },
    { t: 'narr', text: 'A few moments after you are clear, they have already cast off. The Mary Parker pulls away into the grey.' },
    { t: 'wait', ms: 500 },
    { t: 'sfx', id: 'death' },
    { t: 'narr', text: 'And right as you step off the dock, your knees hit the boards and you start to shake.' },
    { t: 'music', id: 'vision', restart: true },
    { t: 'wait', ms: 500 },
    { t: 'narr', text: 'You all see it. Not in front of you — behind your eyes. An Ancient Golden Dragon, vast beyond scale, curled in a dark that has no walls.' },
    { t: 'say', who: 'The Ancient Golden Dragon', text: '"Where have they gone. Please. Help me, child."' },
    { t: 'particles', kind: 'gold', n: 40 },
    { t: 'narr', text: 'Your eyes are glowing. The others can see it. So is your mouth.' },
    { t: 'wait', ms: 400 },
    { t: 'narr', text: 'Behind you, the large pod starts to speak in a man\'s voice.' },
    { t: 'say', who: 'The Command Pod', text: '"We\'ve heard that the main creatures going rogue are dragonic. Something dragonic just spoke through our own recruit. Get one of these into them."' },
    { t: 'sfx', id: 'quest' },
    { t: 'narr', text: 'Five green potions materialise in a pocket you were not aware you had.' },
    { t: 'give', item: 'green_potion', qty: 5 },
    {
      t: 'choice', text: 'You are on your knees on the boards with light coming out of your mouth.',
      options: [
        {
          text: 'Drink one of the green potions.', then: [
            { t: 'take', item: 'green_potion', qty: 1 },
            { t: 'sfx', id: 'heal' },
            { t: 'narr', text: 'You get it down. The glow goes out of you. Anvil hauls you up by the back of your coat without being asked.' },
            { t: 'say', who: () => DH.game.pc().name, text: '"It wasn\'t asking me." *You wipe your mouth.* "It was asking through me. There\'s a difference and I don\'t like it."' }
          ]
        },
        {
          text: 'Wait. Let it finish saying whatever it is saying.', then: [
            { t: 'say', who: () => DH.game.pc().name, text: '*Not with your own voice.* "WHERE. HAVE. THEY. GONE."' },
            { t: 'narr', text: 'Umarion puts the potion in your hand and folds your fingers round it. You drink. The light goes out.' },
            { t: 'take', item: 'green_potion', qty: 1 }
          ]
        }
      ]
    },
    { t: 'music', id: 'town' },
    { t: 'flag', k: 'act1_done' },
    { t: 'quest', id: 'eggs', title: 'Where Are The Eggs?', desc: 'Something ancient and golden is missing its eggs, and it is speaking through dragons all over this island. Find out what happened to them.' },
    { t: 'xp', n: 100 }
  ],

  /* ==========================================================================
     ACT TWO — the crazy ones
     ========================================================================== */
  act2_the_crazy_ones: [
    { t: 'narr', text: 'Before you have even properly left the dock road, you can see the town working: creatures and wagons bustling, voices everywhere, metal clanking somewhere, and the smell of smoke and bread.' },
    { t: 'wait', ms: 400 },
    { t: 'say', who: 'Someone, Screaming', text: '"OH NO! THEY\'RE GONE! The crazy ones are on the loose!"' },
    { t: 'narr', text: 'There is a metal pole in the middle of the town with rope tied round it. The rope has been broken.' },
    { t: 'wait', ms: 300 },
    { t: 'narr', text: 'The streets go silent. Then everyone runs and screams at the same time.' },
    { t: 'sfx', id: 'roar' },
    { t: 'flag', k: 'act2_started' },
    { t: 'quest', id: 'crazy', title: 'The Crazy Ones', desc: 'Three of them broke loose from the pole in the square: two dragonborn and a kobold. People are shouting different directions.' },
    { t: 'do', fn: () => DH.scenes.overworld.loadMap(DH.game.state.map, null) },
    { t: 'narr', text: 'People are shouting different directions — you will need to figure out where the crazy ones went.' },
    { t: 'run', id: 'act2_investigate' }
  ],

  act2_investigate: [
    {
      t: 'choice', text: 'How do you find them?',
      options: [
        {
          text: 'Perception — listen for crashing and shouting.', then: [
            {
              t: 'check', skill: 'perception', dc: 13, by: 'party', label: 'Perception — listen',
              ok: [{ t: 'narr', text: 'Two directions, clearly. Furniture breaking and a roar from the tavern up the east road. And screaming — the frightened kind, not the fleeing kind — from the square behind you.' }, { t: 'flag', k: 'lead_tavern' }, { t: 'flag', k: 'lead_civilians' }],
              fail: [{ t: 'narr', text: 'Everything is crashing and everyone is shouting. That is not narrowing it down.' }]
            }
          ]
        },
        {
          text: 'Investigation — broken stalls, footprints, the snapped rope.', then: [
            {
              t: 'check', skill: 'investigation', dc: 13, by: 'party', label: 'Investigation — the square',
              ok: [{ t: 'narr', text: 'The rope was not cut, it was pulled apart. Three sets of tracks leave the pole: two heavy, clawed, going different ways — and one small set that goes up a rain barrel and onto a roof.' }, { t: 'flag', k: 'lead_kobold' }, { t: 'flag', k: 'lead_civilians' }],
              fail: [{ t: 'narr', text: 'Wreckage, and a great many people\'s footprints on top of whatever was underneath.' }]
            }
          ]
        },
        {
          text: 'Survival — track them through the mud and dust.', then: [
            {
              t: 'check', skill: 'survival', dc: 13, by: 'party', label: 'Survival — track',
              ok: [{ t: 'narr', text: 'You have all three. One toward the tavern, one into the crowd, and one climbing. The climbing one is not running away from anything — it is looking for height.' }, { t: 'flag', k: 'lead_tavern' }, { t: 'flag', k: 'lead_civilians' }, { t: 'flag', k: 'lead_kobold' }],
              fail: [{ t: 'narr', text: 'Cobbles. Hundreds of feet. No trail worth the name.' }]
            }
          ]
        },
        {
          text: 'Persuasion — get a straight answer out of a witness.', then: [
            {
              t: 'check', skill: 'persuasion', dc: 12, by: 'party', label: 'Persuasion — a witness',
              ok: [{ t: 'narr', text: 'A baker with flour to the elbow points, firmly. "One went for the Keg. One\'s in the square going for folk. And there\'s a little one on my roof and it will not stop screaming."' }, { t: 'flag', k: 'lead_tavern' }, { t: 'flag', k: 'lead_civilians' }, { t: 'flag', k: 'lead_kobold' }],
              fail: [{ t: 'narr', text: 'Three people give you three different directions and one of them is upward, which you assume is a joke.' }]
            }
          ]
        },
        {
          text: 'Intimidation — stop somebody and make them talk.', then: [
            {
              t: 'check', skill: 'intimidation', dc: 12, by: 'party', label: 'Intimidation — a witness',
              ok: [{ t: 'narr', text: 'A dockhand freezes solid and tells you everything, at speed, including two things about his brother that you did not need.' }, { t: 'flag', k: 'lead_civilians' }, { t: 'flag', k: 'lead_kobold' }],
              fail: [{ t: 'narr', text: 'He screams and runs. Everyone near him also screams and runs.' }]
            }
          ]
        },
        { text: 'Stop investigating and just look around.', then: [] }
      ]
    },
    {
      t: 'choice', text: 'Where do you go?',
      options: [
        { text: 'The one attacking civilians, here in the square.', run: 'act2_dragonborn_civilians' },
        { text: 'The tavern, where something is breathing fire.', run: 'act2_dragonborn_tavern' },
        { text: 'Up onto the roof, after whatever is shrieking.', run: 'act2_kobold' },
        { text: 'Keep looking for leads first.', run: 'act2_investigate' }
      ]
    }
  ],

  act2_dragonborn_civilians: [
    { t: 'if', flag: 'caught_db2', then: [{ t: 'narr', text: 'That one is already down and tied.' }, { t: 'run', id: 'act2_status' }, { t: 'stop' }] },
    { t: 'narr', text: 'It is in the middle of the square with a fishmonger\'s apron in one fist and the fishmonger still in it. Its eyes and open mouth are glowing gold.' },
    { t: 'say', who: 'The Dragonborn', text: '*In a voice much too large for it.* "WHERE ARE MY EGGS."' },
    { t: 'narr', text: 'It drops the fishmonger, who runs. It looks at you instead.' },
    { t: 'banner', big: 'INITIATIVE', small: 'a crazed dragonborn in the square', ms: 1500 },

        { t: 'narr', text: 'It goes down. The guards get rope on it before it can get up, and its eyes are ordinary again — frightened, and entirely its own.' },
        { t: 'say', who: 'The Dragonborn', text: '"I don\'t— I was at the market. I was buying rope." *It looks at the rope on its own wrists.* "Oh."' },
        { t: 'flag', k: 'caught_db2' },
        { t: 'run', id: 'act2_status' }
      ]
    }
  ],

  act2_dragonborn_tavern: [

    { t: 'music', id: 'battle' },
    { t: 'narr', text: 'The door of the Dragon\'s Keg is off one hinge. Inside, a dragonborn is flipping tables and breathing fire at the ceiling, and a minotaur behind the bar is holding a wet cloth over a burning stool with an expression of profound resignation.' },

        { t: 'do', fn: () => DH.game.addAffinity('mimsy', 3, 'Little Mimsy') },
        { t: 'run', id: 'act2_status' }
      ]
    }
  ],

  act2_kobold: [
    { t: 'if', flag: 'caught_kobold', then: [{ t: 'narr', text: 'The roof is quiet now.' }, { t: 'run', id: 'act2_status' }, { t: 'stop' }] },

          ]

      ]

    { t: 'banner', big: 'INITIATIVE', small: 'the shrieking kobold', ms: 1400 },
    {
      t: 'combat', arena: 'town_street', enemies: ['crazed_kobold'],
      set: 'caught_kobold',
      onWin: [
        { t: 'narr', text: 'It comes off the roof and lands badly. When you get rope on it, it is still trying to shriek, and its eyes are glowing gold like the others.' },

        { t: 'run', id: 'act2_status' }
      ]
    }
  ],

            { text: 'There is movement in a shadow behind a building.', run: 'npc_cat' },
            { text: 'Catch your breath first.', then: [{ t: 'narr', text: 'You take a moment. The town does not.' }] }
          ]
        }
      ]
    }
  ],

     ACT THREE — the market, the tavern, and the thing in Erza's house
     ========================================================================== */
  shop_potion_stand: [

    { t: 'shop', id: 'potion_stand' }

    { t: 'shop', id: 'smith' }

      options: [
        {

            { t: 'say', who: 'The Shady Man', text: '"I\'ve got someone that needs to be eliminated. He will be at a royal ball, and you will need to dispose of him."' },

            { t: 'say', who: 'The Shady Man', text: '"If you fail to eliminate him in the next two months, you all will be new targets."' },

            { t: 'deadline', days: 60 },

          ]

        {
          text: '"No."', then: [
            { t: 'say', who: 'The Shady Man', text: '"Mm." *He looks past you at nothing.* "The offer will be here. So will I."' }
          ]

        {
          text: '"Who is he?"', then: [

  ],

  npc_mimsy: [
    { t: 'narr', text: 'The bell rings as you open the door to The Dragon\'s Keg. The air is bustling with townsfolk settling down after a hard day, and behind the bar a minotaur is polishing a glass. Above him hangs a giant dragon skull.' },
    { t: 'say', who: 'Little Mimsy', text: '"Heyyyy, can I get you a drinkkk? Our special today is something called Dragon\'s Breath."' },
    {
      t: 'choice', text: 'The bartender is named Mimsy Huddle, but he goes by Little Mimsy.',
      options: [
        { text: '"What is in a Dragon\'s Breath?" (15 gp)', then: [{ t: 'say', who: 'Little Mimsy', text: '"It gives you any breath weapon off the dragonborn list for fifteen minutes. Also you will not be able to do anything delicate for fifteen minutes. Trade-offsss."' }, { t: 'shop', id: 'tavern' }] },
        { text: 'Buy something.', then: [{ t: 'shop', id: 'tavern' }] },
        {
          text: '"Who is worth talking to in here?"', then: [
            { t: 'say', who: 'Little Mimsy', text: '"Orc in the corner is talking business with a man I do not like. Tabaxi at the bar knows more about magic weapons than anyone should. Gnome by himself is sad and will tell you why. Dwarf with the full plate has not looked up in an hour."' },
            { t: 'flag', k: 'mimsy_pointers' }
          ]
        },
        {
          text: '"Anyone been talking about dragon eggs?"', then: [
            { t: 'say', who: 'Little Mimsy', text: '*The cloth stops.* "Everyone. Since the dragons started saying it." *He leans in.* "Ask the gnome by himself. He came in from a cave and he has been muttering about a hatchling."' },
            { t: 'flag', k: 'mine_hint' }
          ]
        }
      ]
    }
  ],
  npc_musicians: [
    { t: 'narr', text: 'Three of them in the corner, playing for whatever the room throws, and trying very hard to get a day\'s worth of dollar out of a room this tired.' },
    {
      t: 'choice', text: '',
      options: [
        { text: 'Throw them a coin.', then: [{ t: 'do', fn: () => { DH.game.spendGold(5); } }, { t: 'sfx', id: 'coin' }, { t: 'narr', text: 'The fiddler nods at you mid-phrase, which from a working musician is a standing ovation.' }, { t: 'do', fn: () => DH.game.addAffinity('musicians', 2, 'the musicians') }] },
        { text: 'Play with them.', hint: 'Performance', then: [{ t: 'check', skill: 'performance', dc: 12, label: 'Performance — sit in with the band', ok: [{ t: 'narr', text: 'The room actually stops talking for a bar and a half, which in the Dragon\'s Keg counts as a riot.' }, { t: 'gold', n: 25 }, { t: 'do', fn: () => DH.game.addAffinity('musicians', 4, 'the musicians') }], fail: [{ t: 'narr', text: 'You are enthusiastic. That is the kindest available word.' }] }] },
        { text: 'Listen.', then: [{ t: 'narr', text: 'It is a song about a ship that does not come back, which given the harbour outside is a bold choice.' }] }
      ]
    }
  ],
  npc_dwarf: [
    { t: 'say', who: 'The Dwarf', text: '*Through food.* "S\'good. Try the pie." *He does not look up.*' }
  ],
  npc_orc: [
    { t: 'say', who: 'The Orc', text: '*He stops talking to the man in the corner as you approach, and waits for you to leave.* "Somethin\' you need?"' },
    {
      t: 'choice', text: 'The man he was talking to is not looking at you either.',
      options: [
        { text: 'Insight — what is this conversation?', then: [{ t: 'check', skill: 'insight', dc: 14, label: 'Insight — the corner table', ok: [{ t: 'narr', text: 'Money is being counted under the table, and neither of them wants to be the one holding it when you walk past. Nothing to do with dragons. Just ordinary crime.' }], fail: [{ t: 'narr', text: 'Two men, one table, nothing you can read.' }] }] },
        { text: 'Leave them to it.', then: [] }
      ]
    }
  ],
  npc_gnome_alone: [
    { t: 'say', who: 'The Gnome', text: '*He is holding a beer he has not drunk any of.* "You\'re the boat lot. Good. Somebody should hear this."' },
    { t: 'say', who: 'The Gnome', text: '"There is a cave east of town, past where they\'re digging. Somebody put trials in it. Actual trials, with doors and riddles and a poison gas room, like it\'s a game."' },
    { t: 'say', who: 'The Gnome', text: '"And at the end of it there\'s another gnome with a baby dragon that isn\'t crazy." *He finally drinks.* "Not crazy. Do you understand what that\'s worth right now?"' },
    { t: 'flag', k: 'mine_hint' },
    { t: 'quest', id: 'mine', title: 'The Trials in the Mine', desc: 'Somebody built a course of trials into a cave east of Drakehaven, and at the end of it is a gnome with a dragon that is not going mad.' }
  ],
  npc_tabaxi: [
    { t: 'say', who: 'The Orange Tabaxi', text: '"Ordering a drink. Then I am going to talk to you about weapons, because that is what I do to strangers."' },
    {
      t: 'choice', text: '',
      options: [
        {
          text: '"Go on then."', then: [
            { t: 'say', who: 'The Orange Tabaxi', text: '"Enspelled weapons. A weapon with a spell folded into it that you can use as an action, no slot, no book, no fuss." *He taps the bar.* "Rare. Worth knowing what one looks like."' },
            { t: 'flag', k: 'knows_enspelled' }
          ]
        },
        { text: 'Walk away.', then: [{ t: 'narr', text: 'He shrugs and goes back to his drink, entirely unoffended.' }] }
      ]
    }
  ],
  npc_erza: [
    {
      t: 'if', flag: 'erza_done',
      then: [{ t: 'say', who: 'Erza', text: '"House is mine again. That is not a small thing." *He turns his glass round on the bar.* "Thank you."' }],
      else: [
        { t: 'say', who: 'Erza', text: '*A tabaxi with fur the colour of old parchment, and one ear notched.* "Is it OK to ask you something? About my home."' },
        { t: 'say', who: 'Erza', text: '"There is a thing living in it. I opened the door six days ago and there was a wall of spores and something at the back of the room with eyes on the ends of it. I have been sleeping here since."' },
        {
          t: 'choice', text: '"Would you go and look? Please. It is my house."',
          options: [
            {
              text: '"We will deal with it."', then: [
                { t: 'flag', k: 'erza_quest' },
                { t: 'quest', id: 'erza', title: 'The Thing in Erza\'s House', desc: 'A fungal horror has taken over a tabaxi\'s home on the north side of the square. It has eyes on tendrils and it has not noticed you yet.' },
                { t: 'say', who: 'Erza', text: '"North side of the square. Shuttered windows. I would come with you but I have discovered that I am a coward, at forty-one." ' },
                { t: 'do', fn: () => DH.game.addAffinity('erza', 2, 'Erza') }
              ]
            },
            { text: '"Not right now."', then: [{ t: 'say', who: 'Erza', text: '"No. Fair. It is a lot to ask of strangers." *He goes back to his drink.*' }] }
          ]
        }
      ]
    }
  ],

        },
        { text: '"Have you heard a golden voice asking about eggs?"', then: [{ t: 'say', who: 'The Copper Dragon', text: '"All of us have heard it." *Her eyes close.* "It is not asking us. It is asking through us. There is a difference and none of you understand it yet."' }] }

              then: [
                { t: 'do', fn: (s) => { s.flags.pod_supply_day = s.day; } },
                { t: 'sfx', id: 'quest' },
                { t: 'say', who: 'The Command Pod', text: '"Acknowledged. Sending." *Something small materialises in the tray.*' },

            }

        {

            { t: 'say', who: 'The Command Pod', text: '"We\'ve heard that the main creatures that are going rogue are dragonic. Beyond that: hold position, gather information, do not engage anything with a wingspan." *A pause.* "You have already engaged something with a wingspan."' }

/* A tiny sanity pass: warn in the console about any `run` or option target that
   does not exist, so a typo in the campaign shows up immediately. */
(function validateStory() {
  const ids = Object.keys(DH.STORY);
  const missing = [];
  function walk(list, where) {
    (list || []).forEach(step => {
      if (!step) return;
      if (step.t === 'run' && ids.indexOf(step.id) < 0) missing.push(where + ' → run:' + step.id);
      (step.options || []).forEach(o => {
        if (o.run && ids.indexOf(o.run) < 0) missing.push(where + ' → option run:' + o.run);
        if (o.then) walk(o.then, where);
      });
      if (step.then) walk(step.then, where);
      if (step.else) walk(step.else, where);
      if (step.ok) walk(step.ok, where);
      if (step.fail) walk(step.fail, where);
      if (step.onWin) walk(step.onWin, where);
      if (step.onLose) walk(step.onLose, where);
    });
  }
  ids.forEach(id => walk(DH.STORY[id], id));
  if (missing.length) console.warn('story: unresolved targets —', missing);
})();

<script>
/* ---- js/rules/character.js ---- */
/* Drakehaven Island — character construction and derived statistics.
   Everything a sheet shows is computed here from race + class + level + gear. */
window.DH = window.DH || {};

DH.char = (function () {
  'use strict';
  const U = DH.util;

  const mod = (score) => Math.floor((score - 10) / 2);
  const profFor = (level) => 2 + Math.floor((level - 1) / 4);
  const MAX_LEVEL = 10;

  const XP_TABLE = [0, 0, 300, 900, 2700, 6500, 14000, 23000, 34000, 48000, 64000];

  /* ---------------- creation ---------------- */
  function blank() {
    return {
      name: 'Adventurer',
      raceId: 'human', raceName: 'Human', ancestry: null,
      classId: 'fighter', className: 'Fighter', subclassId: null, subclassName: null,
      backgroundId: 'sailor', backgroundName: 'Sailor',
      level: 1, xp: 0,
      base: { str: 10, dex: 10, con: 10, int: 10, wis: 10, cha: 10 },
      abilities: { str: 10, dex: 10, con: 10, int: 10, wis: 10, cha: 10 },
      skills: [], expertise: [], saveProfs: [],
      profs: { armor: [], weapons: [], tools: [] },
      effects: [],
      inv: [], equipped: {},
      spells: { known: [], prepared: [], cantrips: [], slots: {}, slotsMax: {}, pactLevel: 0 },
      gold: 0,
      pod: null,
      res: {},                    // per-rest resources
      fightingStyle: null, metamagic: [], invocations: [], pactBoon: null,
      appearance: { skin: null, hair: null, cloth: '#5a4a7a', cloth2: '#3a3050', hairStyle: 'short' },
      hp: 1, hpMax: 1, tempHp: 0, hitDiceLeft: 1,
      deathSaves: { s: 0, f: 0 }, dying: false, dead: false,
      conditions: [], concentration: null,
      isPlayer: false, kind: 'pc'
    };
  }

  /** Build a fresh player character from the creator's choices. */
  function create(o) {
    const ch = blank();
    const race = DH.raceById(o.raceId) || DH.RACES[0];
    const cls = DH.classById(o.classId) || DH.CLASSES[0];
    const bg = DH.backgroundById(o.backgroundId) || DH.BACKGROUNDS[0];

    ch.name = (o.name || 'Adventurer').slice(0, 24);
    ch.raceId = race.id; ch.raceName = race.name;
    ch.ancestry = o.ancestry || null;
    ch.classId = cls.id; ch.className = cls.name;
    ch.subclassId = o.subclassId || null;
    ch.backgroundId = bg.id; ch.backgroundName = bg.name;
    ch.level = o.level || 1;
    ch.xp = XP_TABLE[ch.level] || 0;
    ch.base = Object.assign({}, o.abilities || ch.base);
    ch.skills = (o.skills || []).slice();
    ch.appearance = Object.assign(ch.appearance, o.appearance || {});
    ch.isPlayer = true;
    ch.fightingStyle = o.fightingStyle || null;
    ch.gold = (bg.gold || 10) + DH.dice.roll('4d4').total * 2;

    /* background skills, tools */
    (bg.skills || []).forEach(s => { if (ch.skills.indexOf(s) < 0) ch.skills.push(s); });
    (bg.tools || []).forEach(t => { if (ch.profs.tools.indexOf(t) < 0) ch.profs.tools.push(t); });

    /* class proficiencies */
    ch.saveProfs = (cls.saves || []).slice();
    ch.profs.armor = (cls.armor || []).slice();
    ch.profs.weapons = (cls.weapons || []).slice();

    /* starting kit */
    (cls.kit || []).forEach(id => addItem(ch, id));
    (bg.kit || []).forEach(id => addItem(ch, id));

    /* expertise picks (rogue/bard) default to the first proficient skills */
    if (o.expertise) ch.expertise = o.expertise.slice();

    /* spells chosen at creation */
    if (o.cantrips) ch.spells.cantrips = o.cantrips.slice();
    if (o.spellsKnown) ch.spells.known = o.spellsKnown.slice();
    if (o.prepared) ch.spells.prepared = o.prepared.slice();
    if (o.metamagic) ch.metamagic = o.metamagic.slice();
    if (o.invocations) ch.invocations = o.invocations.slice();
    if (o.pactBoon) ch.pactBoon = o.pactBoon;

    derive(ch);
    autoEquip(ch);
    derive(ch);
    ch.hp = ch.hpMax;
    /* prepare a sensible default spell list if the player skipped the step */
    ensureSpells(ch);
    return ch;
  }

  /* ---------------- effect gathering ---------------- */
  function gatherEffects(ch) {
    const out = [];
    const race = DH.raceById(ch.raceId);
    if (race) (race.traits || []).forEach(t => (t.effects || []).forEach(e => out.push(e)));

    const cls = DH.classById(ch.classId);
    if (cls) {
      for (let L = 1; L <= ch.level; L++) {
        (cls.features[L] || []).forEach(f => (f.effects || []).forEach(e => out.push(e)));
      }
      const sub = subclass(ch);
      if (sub) {
        Object.keys(sub.features || {}).forEach(k => {
          if (+k <= ch.level) (sub.features[k] || []).forEach(f => (f.effects || []).forEach(e => out.push(e)));
        });
      }
    }
    if (ch.fightingStyle) out.push('style:' + ch.fightingStyle);
    (ch.invocations || []).forEach(i => out.push('invocation:' + i));

    /* equipped magic items */
    Object.keys(ch.equipped || {}).forEach(slot => {
      const it = DH.item(ch.equipped[slot]);
      if (it && it.effects) it.effects.forEach(e => out.push(e));
    });
    if (ch.pod) out.push('pod');
    if (ch.podArchetype) out.push('pod_arch:' + ch.podArchetype);
    return out;
  }
  function hasEffect(ch, token) { return (ch.effects || []).indexOf(token) >= 0; }
  function effectValue(ch, prefix) {
    let total = 0;
    (ch.effects || []).forEach(e => {
      if (e.indexOf(prefix + ':') === 0) {
        const v = parseInt(e.slice(prefix.length + 1), 10);
        if (!isNaN(v)) total += v;
      }
    });
    return total;
  }
  function effectArg(ch, prefix) {
    const hit = (ch.effects || []).find(e => e.indexOf(prefix + ':') === 0);
    return hit ? hit.slice(prefix.length + 1) : null;
  }
  function subclass(ch) {
    const cls = DH.classById(ch.classId);
    if (!cls || !ch.subclassId) return null;
    return (cls.subclasses || []).find(s => s.id === ch.subclassId) || null;
  }

  /* ---------------- derivation ---------------- */
  function derive(ch) {
    const race = DH.raceById(ch.raceId);
    const cls = DH.classById(ch.classId);

    /* abilities = base + racial */
    const ab = Object.assign({}, ch.base);
    if (race) {
      Object.keys(race.bonus || {}).forEach(k => ab[k] += race.bonus[k]);
      Object.keys(race.penalty || {}).forEach(k => ab[k] += race.penalty[k]);
    }
    if (ch.flexBonus) Object.keys(ch.flexBonus).forEach(k => ab[k] += ch.flexBonus[k]);
    if (ch.asi) Object.keys(ch.asi).forEach(k => ab[k] += ch.asi[k]);
    Object.keys(ab).forEach(k => ab[k] = U.clamp(ab[k], 1, 20));
    ch.abilities = ab;

    ch.prof = profFor(ch.level);
    ch.effects = gatherEffects(ch);

    /* skills from race/subclass effects */
    (ch.effects || []).forEach(e => {
      if (e.indexOf('skill:') === 0) {
        const s = e.slice(6);
        if (ch.skills.indexOf(s) < 0) ch.skills.push(s);
      }
      if (e.indexOf('armor:') === 0) {
        const a = e.slice(6);
        if (ch.profs.armor.indexOf(a) < 0) ch.profs.armor.push(a);
      }
      if (e.indexOf('weapons:') === 0) {
        const w = e.slice(8);
        if (ch.profs.weapons.indexOf(w) < 0) ch.profs.weapons.push(w);
      }
      if (e.indexOf('tool:') === 0) {
        const t = e.slice(5);
        if (ch.profs.tools.indexOf(t) < 0) ch.profs.tools.push(t);
      }
    });

    /* hit points */
    const hd = (cls && cls.hitDie) || 8;
    ch.hitDie = hd;
    const conM = mod(ab.con);
    let hp = hd + conM;
    for (let L = 2; L <= ch.level; L++) hp += Math.floor(hd / 2) + 1 + conM;
    hp += effectValue(ch, 'hp_per_level') * ch.level;
    ch.hpMax = Math.max(1, hp);
    if (ch.hp == null || ch.hp > ch.hpMax) ch.hp = ch.hpMax;
    if (ch.hitDiceLeft == null) ch.hitDiceLeft = ch.level;

    /* speed */
    let sp = (race && race.speed) || 30;
    if (hasEffect(ch, 'speed:10') && !heavyArmorWorn(ch)) sp += 10;
    ch.speed = sp;
    ch.size = (race && race.size) || 'Medium';

    /* armour class */
    ch.ac = computeAC(ch);

    /* initiative */
    ch.initBonus = mod(ab.dex) + (hasEffect(ch, 'adv_initiative') ? 0 : 0)
      + (hasEffect(ch, 'dread_ambusher') ? mod(ab.wis) : 0);

    /* spellcasting */
    deriveSpellcasting(ch);

    /* per-rest resources */
    deriveResources(ch);

    /* P.A.C.T. pod capacity: 2 charges to start, 5 by level 9 */
    if (ch.pod) {
      const cap = ch.level >= 9 ? 5 : ch.level >= 7 ? 4 : ch.level >= 4 ? 3 : 2;
      ch.pod.max = cap;
      if (ch.pod.charges == null) ch.pod.charges = cap;
      ch.pod.charges = Math.min(ch.pod.charges, cap);
    }
    return ch;
  }

  function heavyArmorWorn(ch) {
    const a = DH.item(ch.equipped.armor);
    return !!(a && a.armorKind === 'heavy');
  }
  function armorWorn(ch) { return !!DH.item(ch.equipped.armor); }

  function computeAC(ch) {
    const ab = ch.abilities, dexM = mod(ab.dex);
    const armor = DH.item(ch.equipped.armor);
    let ac;
    if (armor) {
      const cap = armor.dexCap == null ? 99 : armor.dexCap;
      ac = armor.ac + Math.min(dexM, cap);
    } else {
      const ud = effectArg(ch, 'unarmored_defense');
      if (ud === 'con') ac = 10 + dexM + mod(ab.con);
      else if (ud === 'wis' && !ch.equipped.shield) ac = 10 + dexM + mod(ab.wis);
      else if (hasEffect(ch, 'draconic_ac')) ac = 13 + dexM;
      else ac = 10 + dexM;
    }
    const shield = DH.item(ch.equipped.shield);
    if (shield && shield.acBonus) ac += shield.acBonus;
    if (hasEffect(ch, 'style:defense') && armor) ac += 1;
    ac += effectValue(ch, 'ac');
    return ac;
  }

  function casterInfo(ch) {
    const cls = DH.classById(ch.classId);
    if (!cls) return null;
    const sub = subclass(ch);
    if (sub && sub.caster) return sub.caster;
    return cls.caster || null;
  }

  function deriveSpellcasting(ch) {
    const ci = casterInfo(ch);
    ch.caster = ci;
    if (!ci) { ch.spells.slotsMax = {}; ch.spellDC = null; return; }
    const abMod = mod(ch.abilities[ci.ability]);
    ch.spellAbility = ci.ability;
    ch.spellDC = 8 + ch.prof + abMod;
    ch.spellAtk = ch.prof + abMod;

    /* effective caster level for the slot table */
    let eff = ch.level;
    if (ci.type === 'half') eff = ch.level;          // table already accounts
    if (ci.type === 'third') eff = ch.level;
    const table = DH.SLOTS[ci.type] || DH.SLOTS.full;
    const row = table[Math.min(eff, MAX_LEVEL)] || {};
    if (ci.type === 'pact') {
      ch.spells.slotsMax = {}; ch.spells.pactLevel = row.lv || 0;
      if (row.n) ch.spells.slotsMax[row.lv] = row.n;
    } else {
      ch.spells.slotsMax = Object.assign({}, row);
    }
    /* current slots default to full */
    Object.keys(ch.spells.slotsMax).forEach(k => {
      if (ch.spells.slots[k] == null) ch.spells.slots[k] = ch.spells.slotsMax[k];
      ch.spells.slots[k] = Math.min(ch.spells.slots[k], ch.spells.slotsMax[k]);
    });
    Object.keys(ch.spells.slots).forEach(k => {
      if (ch.spells.slotsMax[k] == null) delete ch.spells.slots[k];
    });

    /* how many cantrips and spells */
    const cl = ci.cantrips || DH.CANTRIPS[ch.classId];
    ch.cantripCount = cl ? (cl[Math.min(ch.level, MAX_LEVEL)] || 0) : 0;
    if (ci.known) ch.spellsKnownCount = ci.known[Math.min(ch.level, MAX_LEVEL)] || 0;
    else ch.spellsKnownCount = null;      // prepared caster
    if (ci.prepares) {
      const base = ci.type === 'half' ? Math.floor(ch.level / 2) : ch.level;
      ch.preparedCount = Math.max(1, mod(ch.abilities[ci.ability]) + base);
    } else ch.preparedCount = null;
    ch.maxSpellLevel = maxSpellLevel(ch);
  }

  function maxSpellLevel(ch) {
    if (!ch.caster) return 0;
    if (ch.caster.type === 'pact') return ch.spells.pactLevel || 0;
    let m = 0;
    Object.keys(ch.spells.slotsMax).forEach(k => { m = Math.max(m, +k); });
    return m;
  }

  function deriveResources(ch) {
    const r = ch.res || (ch.res = {});
    const ab = ch.abilities;
    const set = (k, max) => {
      if (max <= 0) { delete r[k]; return; }
      if (!r[k]) r[k] = { cur: max, max: max };
      else { r[k].max = max; r[k].cur = Math.min(r[k].cur, max); }
    };
    if (hasEffect(ch, 'rage')) set('rage', ch.level >= 6 ? 4 : ch.level >= 3 ? 3 : 2);
    if (hasEffect(ch, 'ki')) set('ki', ch.level);
    if (hasEffect(ch, 'second_wind')) set('second_wind', 1);
    if (hasEffect(ch, 'action_surge')) set('action_surge', 1);
    if (hasEffect(ch, 'bardic_inspiration')) set('inspiration', Math.max(1, mod(ab.cha)));
    if (hasEffect(ch, 'lay_on_hands')) set('lay_on_hands', ch.level * 5);
    if (hasEffect(ch, 'divine_sense')) set('divine_sense', 1 + mod(ab.cha));
    if (hasEffect(ch, 'channel_divinity:1')) set('channel_divinity', ch.level >= 6 ? 2 : 1);
    if (hasEffect(ch, 'wild_shape')) set('wild_shape', 2);
    if (hasEffect(ch, 'sorcery_points')) set('sorcery', ch.level);
    if (hasEffect(ch, 'arcane_recovery')) set('arcane_recovery', 1);
    if (hasEffect(ch, 'superiority:4')) set('superiority', 4);
    if (hasEffect(ch, 'feline_agility')) set('feline_agility', 1);
    if (hasEffect(ch, 'breath')) set('breath', 1);
    if (hasEffect(ch, 'relentless')) set('relentless', 1);
    if (hasEffect(ch, 'indomitable:1')) set('indomitable', 1);
    if (hasEffect(ch, 'war_priest')) set('war_priest', Math.max(1, mod(ab.wis)));
    if (hasEffect(ch, 'warding_flare')) set('warding_flare', Math.max(1, mod(ab.wis)));
    if (hasEffect(ch, 'wrath_of_storm')) set('wrath_of_storm', Math.max(1, mod(ab.wis)));
    if (hasEffect(ch, 'portent')) set('portent', 2);
    if (hasEffect(ch, 'fey_presence')) set('fey_presence', 1);
    if (hasEffect(ch, 'tides_of_chaos')) set('tides_of_chaos', 1);
    if (hasEffect(ch, 'divine_intervention')) set('divine_intervention', 1);
  }

  /* ---------------- modifiers ---------------- */
  function abMod(ch, ab) { return mod(ch.abilities[ab]); }
  function saveMod(ch, ab) {
    let m = mod(ch.abilities[ab]);
    if ((ch.saveProfs || []).indexOf(ab) >= 0) m += ch.prof;
    m += effectValue(ch, 'saves');
    if (hasEffect(ch, 'aura_protection')) m += mod(ch.abilities.cha);
    return m;
  }
  function skillMod(ch, skill) {
    const info = DH.SKILLS[skill];
    if (!info) return 0;
    let m = mod(ch.abilities[info.ab]);
    if ((ch.expertise || []).indexOf(skill) >= 0) m += ch.prof * 2;
    else if ((ch.skills || []).indexOf(skill) >= 0) m += ch.prof;
    else if (hasEffect(ch, 'jack_of_all_trades')) m += Math.floor(ch.prof / 2);
    return m;
  }
  function passive(ch, skill) { return 10 + skillMod(ch, skill); }
  function isProficient(ch, skill) {
    return (ch.skills || []).indexOf(skill) >= 0 || (ch.expertise || []).indexOf(skill) >= 0;
  }

  /* Advantage sources the engine knows about, given a tag describing the test. */
  function advantageFor(ch, tag) {
    if (!tag) return false;
    if (tag === 'vs_charmed' && hasEffect(ch, 'adv_vs_charmed')) return true;
    if (tag === 'vs_poison' && hasEffect(ch, 'adv_vs_poison')) return true;
    if (tag === 'vs_frightened' && hasEffect(ch, 'adv_vs_frightened')) return true;
    if (tag === 'vs_gas' && hasEffect(ch, 'adv_vs_gas')) return true;
    if (tag === 'stealth' && hasEffect(ch, 'adv_stealth')) return true;
    if (tag === 'initiative' && hasEffect(ch, 'adv_initiative')) return true;
    return false;
  }

  /* ---------------- damage & healing ---------------- */
  function resistances(ch) {
    const out = { resist: [], immune: [], vuln: [] };
    (ch.effects || []).forEach(e => {
      if (e.indexOf('resist:') === 0) out.resist.push(e.slice(7));
      if (e.indexOf('immune:') === 0) out.immune.push(e.slice(7));
      if (e.indexOf('vuln:') === 0) out.vuln.push(e.slice(5));
    });
    if (ch.ancestry) {
      const race = DH.raceById(ch.raceId);
      const anc = race && (race.ancestries || []).find(a => a.id === ch.ancestry);
      if (anc && hasEffect(ch, 'draconic_resist')) out.resist.push(anc.dmg);
    }
    if (hasCondition(ch, 'raging') && !hasEffect(ch, 'bear_totem')) {
      out.resist.push('bludgeoning', 'piercing', 'slashing');
    }
    if (hasCondition(ch, 'raging') && hasEffect(ch, 'bear_totem')) {
      ['bludgeoning', 'piercing', 'slashing', 'fire', 'cold', 'acid', 'lightning', 'thunder', 'poison', 'necrotic', 'radiant', 'force'].forEach(t => out.resist.push(t));
    }
    (ch.runtimeResist || []).forEach(t => out.resist.push(t));
    return out;
  }

  function applyDamage(ch, amount, type, opts) {
    opts = opts || {};
    const R = resistances(ch);
    let dmg = Math.max(0, Math.floor(amount));
    if (type && R.immune.indexOf(type) >= 0) dmg = 0;

<script>
/* ---- js/core/game.js ---- */
/* Drakehaven Island — the engine: global state, the scene stack, the main loop. */
window.DH = window.DH || {};

DH.game = (function () {
  'use strict';
  const U = DH.util;

  /* ---------------- global state ---------------- */
  function freshState() {
    return {
      party: [],                 // characters; [0] is the player
      day: 1, minutes: 5 * 60 + 40, weather: 'storm',
      map: 'ship_quarters', placeName: 'The Mary Parker',
      spawn: 'start',
      flags: {}, quests: [], counters: {},
      affinity: {},              // npcId -> 0..10
      shops: {},                 // shopId -> [{id, qty}]
      nodes: {},                 // mapId -> {key: harvestedOnDay}
      crops: [],                 // {map,x,y,seed,growth,watered,day}
      chapter: 0, act: 0,
      commandPod: { charges: 4, max: 4 },
      pet: null,                 // the grey cat, once tamed
      bestiary: {},              // monsterId -> times fought
      contractDeadlineDay: null, // the shady man's two months
      musterDay: null,
      lastTown: 'town_square',
      playTime: 0,
      seenIntro: false
    };
  }
  let state = freshState();

  /* ---------------- scene stack ---------------- */
  const stack = [];
  let pendingOps = [];

  function current() { return stack[stack.length - 1] || null; }
  /* Each scene declares the world zoom it wants to draw at; set it before the
     scene runs so nothing has to remember. */
  function applyZoom(scene) { DH.gfx.setZoom((scene && scene.zoom) || 1); }
  function push(scene, arg) {
    pendingOps.push(() => {
      const cur = current();
      if (cur && cur.pause) cur.pause();
      stack.push(scene);
      applyZoom(scene);
      if (scene.enter) scene.enter(arg);
    });
  }
  function pop(result) {
    pendingOps.push(() => {
      const s = stack.pop();
      if (s && s.exit) s.exit(result);
      const cur = current();
      applyZoom(cur);
      if (cur && cur.resume) cur.resume(result);
    });
  }
  function replace(scene, arg) {
    pendingOps.push(() => {
      while (stack.length) { const s = stack.pop(); if (s && s.exit) s.exit(); }
      DH.ui.clear();
      stack.push(scene);
      applyZoom(scene);
      if (scene.enter) scene.enter(arg);
    });
  }
  function clearScenes() {
    pendingOps.push(() => {
      while (stack.length) { const s = stack.pop(); if (s && s.exit) s.exit(); }
      DH.ui.clear();
    });
  }
  function flushOps() {
    while (pendingOps.length) { const op = pendingOps.shift(); op(); }
  }
  function inScene(name) { return stack.some(s => s.name === name); }

  /* ---------------- party helpers ---------------- */
  function pc() { return state.party[0]; }
  function party() { return state.party; }
  function alive() { return state.party.filter(c => !c.dead); }
  function addCompanion(id) {
    if (state.party.find(c => c.companionId === id)) return null;
    const data = DH.companion(id);
    if (!data) return null;
    const ch = DH.char.fromCompanion(data);
    state.party.push(ch);
    return ch;
  }
  function hasCompanion(id) { return !!state.party.find(c => c.companionId === id); }

  function partyGold() { return pc() ? pc().gold : 0; }
  function spendGold(n) {
    const p = pc();
    if (!p || p.gold < n) return false;
    p.gold -= n; return true;
  }
  function giveGold(n) {
    const p = pc(); if (!p) return;
    p.gold += n;
    DH.ui.toast('[gold]+' + U.commas(n) + ' gold[/]', 'item');
    DH.audio.sfx('coin');
  }
  function giveItem(id, qty, quiet) {
    const it = DH.item(id);
    if (!it) return;
    DH.char.addItem(pc(), id, qty || 1);
    if (!quiet) {
      DH.ui.toast('Received [gold]' + it.name + (qty > 1 ? ' ×' + qty : '') + '[/]', 'item');
      DH.audio.sfx('quest');
    }
  }
  function giveItemToAll(id, qty) {
    state.party.forEach(c => DH.char.addItem(c, id, qty || 1));
    const it = DH.item(id);
    if (it) DH.ui.toast('Everyone receives [gold]' + it.name + '[/]', 'item');
  }
  /* Give every party member a P.A.C.T. pod. */
  function issuePods() {
    state.party.forEach(c => {
      if (!c.pod) c.pod = { charges: 2, max: 2, archetype: null, bonded: false };
      DH.char.addItem(c, 'pact_pod');
      DH.char.derive(c);
    });
    state.commandPod = { charges: 4, max: 4 };
    setFlag('has_pods', true);
  }

  function awardXp(amount, quiet) {
    let any = false;
    state.party.forEach(c => {
      if (c.dead) return;
      if (DH.char.gainXp(c, amount)) any = true;
    });
    if (!quiet) DH.ui.toast('+' + amount + ' experience', '');
    if (any) {
      DH.audio.sfx('levelup');
      const names = state.party.filter(c => !c.dead).map(c => c.name + ' ' + c.level);
      DH.ui.toast('[good]Level up![/] ' + names.join(', '), 'good', 3200);
    }
    return any;
  }

  /* ---------------- flags, quests, counters ---------------- */
  function setFlag(k, v) { state.flags[k] = v === undefined ? true : v; }
  function flag(k) { return !!state.flags[k]; }
  function flagVal(k) { return state.flags[k]; }
  function bump(k, n) { state.counters[k] = (state.counters[k] || 0) + (n == null ? 1 : n); return state.counters[k]; }
  function counter(k) { return state.counters[k] || 0; }

  function addQuest(id, title, desc) {
    if (state.quests.find(q => q.id === id)) return;
    state.quests.push({ id, title, desc, done: false, steps: [] });
    DH.ui.toast('New task: [gold]' + title + '[/]', 'item', 3000);
    DH.audio.sfx('quest');
  }
  function questStep(id, text) {
    const q = state.quests.find(x => x.id === id);
    if (!q) return;
    q.steps.push(text);
  }
  function completeQuest(id, xp) {
    const q = state.quests.find(x => x.id === id);
    if (!q || q.done) return;
    q.done = true;
    DH.ui.toast('[good]Task complete:[/] ' + q.title, 'good', 3000);
    DH.audio.sfx('quest');
    if (xp) awardXp(xp);
  }
  function questDone(id) {
    const q = state.quests.find(x => x.id === id);
    return !!(q && q.done);
  }
  function hasQuest(id) { return !!state.quests.find(x => x.id === id); }

  /* ---------------- affinity ---------------- */
  function affinity(npcId) { return state.affinity[npcId] || 0; }
  function addAffinity(npcId, n, name) {
    const before = affinity(npcId);
    state.affinity[npcId] = U.clamp(before + (n == null ? 1 : n), 0, 10);
    if (state.affinity[npcId] > before && name) {
      DH.ui.toast('♥ ' + name + ' warms to you (' + state.affinity[npcId] + '/10)', '', 1800);
    }
  }

  /* ---------------- time ---------------- */
  function advanceMinutes(n) {
    state.minutes += n;
    while (state.minutes >= 1440) { state.minutes -= 1440; newDay(); }
  }
  function newDay() {
    state.day++;
    /* crops grow */
    state.crops.forEach(c => {
      if (c.watered) { c.growth = Math.min(4, c.growth + 1); c.watered = false; }
    });
    /* foraging nodes come back */
    state.nodes = {};
    /* restock shops lightly */
    Object.keys(state.shops).forEach(sid => {
      const def = DH.SHOPS[sid];
      if (!def) return;
      state.shops[sid].forEach(row => {
        const orig = def.stock.find(s => s.id === row.id);
        if (orig && row.qty < orig.qty && U.chance(0.5)) row.qty++;
      });
    });
    checkDeadlines();
  }
  function checkDeadlines() {
    if (state.contractDeadlineDay && state.day > state.contractDeadlineDay && !flag('contract_done') && !flag('contract_failed')) {
      setFlag('contract_failed', true);
      DH.ui.toast('[bad]The shady man\'s two months are up. You are the target now.[/]', 'bad', 5000);
    }
  }
  function clock() { return U.clockStr(state.minutes); }
  function isNight() { const m = state.minutes; return m < 6 * 60 || m >= 20 * 60; }
  function darkness() {
    const m = state.minutes;
    if (m >= 6 * 60 && m < 18 * 60) return 0;
    if (m >= 18 * 60 && m < 20 * 60) return (m - 18 * 60) / (2 * 60) * 0.55;
    if (m >= 20 * 60) return 0.55 + Math.min(0.15, (m - 20 * 60) / (4 * 60) * 0.15);
    return 0.6;                              // small hours
  }

  function longRest() {
    state.party.forEach(c => {
      if (c.dead) return;
      DH.char.longRest(c);
    });
    /* the Command Pod recharges four pods */
    let charged = 0;
    state.party.forEach(c => {
      if (c.pod && charged < 4) {
        c.pod.charges = Math.min(c.pod.max, c.pod.charges + 4);
        charged++;
      }
    });
    const before = state.day;
    state.minutes = 6 * 60;
    if (before === state.day) newDay();
    DH.ui.toast('You wake on day ' + state.day + '. Everyone is rested.', 'good', 2600);
  }
  function shortRest() {
    const notes = [];
    state.party.forEach(c => { if (!c.dead) DH.char.shortRest(c); });
    advanceMinutes(60);
    DH.ui.toast('An hour\'s rest. Hit dice spent, abilities restored.', 'good', 2400);
    return notes;
  }

  /* ---------------- shops ---------------- */
  function shopStock(id) {
    if (!state.shops[id]) {
      const def = DH.SHOPS[id];
      state.shops[id] = def ? def.stock.map(s => ({ id: s.id, qty: s.qty })) : [];
    }
    return state.shops[id];
  }

  /* ---------------- travel ---------------- */
  async function travel(mapId, spawn, opts) {
    opts = opts || {};
    const map = DH.MAPS[mapId];
    if (!map) { console.warn('no map', mapId); return; }
    if (!opts.noFade) await DH.ui.fadeOut(320);
    state.map = mapId;
    state.spawn = spawn || 'start';
    state.placeName = map.name;
    if (map.town) state.lastTown = mapId;
    const ow = DH.scenes.overworld;
    if (current() !== ow) replace(ow, { map: mapId, spawn: state.spawn });
    else ow.loadMap(mapId, state.spawn);
    flushOps();
    if (!opts.noFade) {
      setTimeout(() => DH.ui.fadeIn(380), 60);
      DH.ui.toast(map.name, '', 1800);
    }
  }

  /* ---------------- persistence ---------------- */
  function serialize() {
    return {
      party: state.party, day: state.day, minutes: state.minutes, weather: state.weather,
      map: state.map, placeName: state.placeName, spawn: state.spawn,
      flags: state.flags, quests: state.quests, counters: state.counters,
      affinity: state.affinity, shops: state.shops, nodes: state.nodes, crops: state.crops,
      chapter: state.chapter, act: state.act, commandPod: state.commandPod,
      pet: state.pet, bestiary: state.bestiary,
      contractDeadlineDay: state.contractDeadlineDay, musterDay: state.musterDay,
      lastTown: state.lastTown, playTime: state.playTime, seenIntro: state.seenIntro,
      storyPointer: state.storyPointer || null
    };
  }
  function saveTo(slot) {
    const ok = DH.save.write(slot, serialize());
    if (ok) DH.ui.toast('Saved to slot ' + slot, 'good');
    return ok;
  }
  function loadFrom(slot) {
    const blob = DH.save.read(slot);
    if (!blob || !blob.state) return false;
    state = Object.assign(freshState(), blob.state);
    /* rebuild derived values that we do not persist */
    state.party.forEach(c => {
      c.conditions = c.conditions || [];
      c.buffs = c.buffs || {};
      if (c.isPlayer) DH.char.derive(c);
    });
    return true;
  }
  function reset() { state = freshState(); }

  /* ---------------- main loop ---------------- */
  let last = 0, running = false, acc = 0;
  function frame(t) {
    if (!running) return;
    const dt = Math.min(0.05, (t - last) / 1000 || 0);
    last = t;
    state.playTime += dt;
    flushOps();
    const scene = current();
    DH.gfx.begin();
    if (scene) {
      if (scene.update) scene.update(dt);
      if (scene.draw) scene.draw(dt);
    }
    DH.gfx.end();
    DH.input.clearFrame();
    requestAnimationFrame(frame);
  }
  function start() {
    if (running) return;
    running = true; last = performance.now();
    requestAnimationFrame(frame);
  }
  function stop() { running = false; }

  return {
    get state() { return state; },
    set state(s) { state = s; },
    freshState, reset, serialize, saveTo, loadFrom,
    push, pop, replace, clearScenes, current, inScene, flushOps,
    pc, party, alive, addCompanion, hasCompanion,
    partyGold, spendGold, giveGold, giveItem, giveItemToAll, issuePods, awardXp,
    setFlag, flag, flagVal, bump, counter,
    addQuest, questStep, completeQuest, questDone, hasQuest,
    affinity, addAffinity,
    advanceMinutes, newDay, clock, isNight, darkness, longRest, shortRest, checkDeadlines,
    shopStock, travel,
    start, stop
  };
})();

DH.scenes = DH.scenes || {};

</script>

<script>
/* ---- js/scenes/title.js ---- */
/* Drakehaven Island — the main screen. Storm at sea, drawn live behind the menu. */
window.DH = window.DH || {};

DH.scenes.title = (function () {
  'use strict';
  const U = DH.util, G = DH.gfx;

  let t = 0, flashT = 0, nextFlash = 3, ui = null;

  function enter() {
    t = 0; nextFlash = 2;
    G.cam.x = 0; G.cam.y = 0;
    DH.audio.play('title');
    DH.audio.ambience('sea');
    build();
  }
  function exit() { DH.ui.clear(); DH.audio.stormThunder(false); }
  function resume() { build(); }

  function build() {
    DH.ui.clear();
    const root = document.getElementById('ui');
    ui = DH.ui.el('div'); ui.id = 'title-screen';
    root.appendChild(ui);

    const logo = DH.ui.add(ui, 'div', 'logo', 'DRAKEHAVEN<em>ISLAND</em>');
    DH.ui.add(ui, 'div', 'tag', 'A P.A.C.T. POSTING · FIVE ADVENTURERS · ONE VERY ANGRY ISLAND');

    const menu = DH.ui.add(ui, 'div'); menu.id = 'title-menu';
    const anySave = [1, 2, 3].some(s => DH.save.has(s));

    menu.appendChild(DH.ui.btn('New Game', 'primary', newGame));
    const cont = DH.ui.btn('Continue', '', loadMenu);
    if (!anySave) cont.disabled = true;
    menu.appendChild(cont);
    menu.appendChild(DH.ui.btn('How to Play', '', howTo));
    menu.appendChild(DH.ui.btn('House Rules', '', houseRules));
    menu.appendChild(DH.ui.btn('Settings', '', settings));
    menu.appendChild(DH.ui.btn('Credits', '', credits));

    DH.ui.add(ui, 'div', 'foot', 'Click anywhere first to let the sound in. Everything you hear is generated live.');
    DH.ui.add(ui, 'div', 'vsn', 'v1.0');

    ui.addEventListener('mousedown', () => DH.audio.unlock(), { once: true });
  }

  /* ---------------- menu actions ---------------- */
  function newGame() {
    DH.audio.unlock();
    slotPicker('Begin a new story in which slot?', (slot) => {
      DH.game.reset();
      DH.game.state.slot = slot;
      DH.game.replace(DH.scenes.charcreate, { slot: slot });
    });
  }

  function slotPicker(title, fn) {
    DH.ui.modal({
      title: title,
      build(m) {
        for (let s = 1; s <= 3; s++) {
          const sum = DH.save.summary(s);
          const row = DH.ui.el('div', 'slot' + (sum ? '' : ' empty'));
          if (sum) {
            row.innerHTML = '<div class="who"><b>' + DH.ui.esc(sum.name) + '</b><br>' +
              '<span class="meta">' + DH.ui.esc(sum.line) + ' · ' + DH.ui.esc(sum.place) +
              ' · day ' + sum.day + '</span></div><div class="meta">' + DH.ui.esc(sum.when) + '</div>';
          } else {
            row.innerHTML = '<div class="who">Slot ' + s + ' — empty</div>';
          }
          row.onclick = () => {
            if (sum) {
              DH.ui.modal({
                title: 'Overwrite ' + sum.name + '?',
                html: '<p>This will erase that save permanently.</p>',
                buttons: [
                  { label: 'Overwrite', cls: 'danger', fn: () => { DH.save.wipe(s); DH.ui.closeModal(); fn(s); } },
                  { label: 'Cancel' }
                ]
              });
            } else { DH.ui.closeModal(); fn(s); }
          };
          m.appendChild(row);
        }
      },
      buttons: [{ label: 'Cancel' }]
    });
  }

  function loadMenu() {
    DH.ui.modal({
      title: 'Continue',
      build(m) {
        let any = false;
        for (let s = 1; s <= 3; s++) {
          const sum = DH.save.summary(s);
          if (!sum) continue;
          any = true;
          const row = DH.ui.el('div', 'slot');
          row.innerHTML = '<div class="who"><b>' + DH.ui.esc(sum.name) + '</b><br>' +
            '<span class="meta">' + DH.ui.esc(sum.line) + ' · ' + DH.ui.esc(sum.place) +
            ' · day ' + sum.day + '</span></div><div class="meta">' + DH.ui.esc(sum.when) + '</div>';
          row.onclick = () => {
            if (DH.game.loadFrom(s)) {
              DH.game.state.slot = s;
              DH.ui.closeModal();
              DH.audio.unlock();
              const st = DH.game.state;
              DH.game.replace(DH.scenes.overworld, { map: st.map, spawn: st.spawn });
              DH.ui.toast('Welcome back to ' + st.placeName, '', 2400);
            } else DH.ui.toast('That save could not be read.', 'bad');
          };
          m.appendChild(row);
        }
        if (!any) m.appendChild(DH.ui.el('p', 'dim', 'No saved games yet.'));
      },
      buttons: [{ label: 'Back' }]
    });
  }

  function howTo() {
    DH.ui.modal({
      title: 'How to Play',
      html: `
        <h3>Walking about</h3>
        <ul>
          <li><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or the arrow keys to move. <kbd>Shift</kbd> to hurry.</li>
          <li><kbd>Space</kbd> or <kbd>E</kbd> to talk, open, forage, mine, fish, sleep, and to advance dialogue.</li>
          <li><kbd>C</kbd> character sheet · <kbd>J</kbd> journal · <kbd>I</kbd> inventory · <kbd>Esc</kbd> menu and saving.</li>
          <li>Time passes as you walk. Sleep in a bed for a long rest and the next day.</li>
        </ul>
        <h3>Fighting on squares</h3>
        <ul>
          <li>Each square is five feet. Reachable squares glow — click one to move there.</li>
          <li>You get <b>movement</b>, one <b>Action</b>, one <b>Bonus Action</b>, one <b>Reaction</b>,
              and one <b>Ending Action</b> per turn.</li>
          <li>Click an enemy to attack with the selected action. Hover anything for its numbers.</li>
          <li><kbd>T</kbd> ends your turn. <kbd>P</kbd> raises your P.A.C.T. Pod shield.</li>
          <li>Terrain matters: throw barrels, climb ropes, smash bottles, and dip your weapon in freezing water.</li>
        </ul>
        <h3>The island</h3>
        <ul>
          <li>Forage herbs, mine ore, fish off the dock, grow things behind the inn, and craft at a cauldron.</li>
          <li>Named people remember you. Talking and helping raises their regard, and that opens doors.</li>
        </ul>`,
      buttons: [{ label: 'Close' }]
    });
  }

  function houseRules() {
    DH.ui.modal({
      title: 'House Rules at This Table',
      html: `
        <h3>Ending Action</h3>
        <p>Once per turn, after your Action, Bonus Action and movement are spent, you get one more
        thing: a knowledge or observation check (Arcana, Investigation, Nature, History, Perception,
        Religion, Insight, Survival), or using a consumable — including feeding one to a willing
        creature within five feet.</p>
        <h3>No Opportunity Attacks</h3>
        <p>Walk away from whatever you like. Nobody gets a free swing.</p>
        <h3>Critical Hits Carry</h3>
        <p>A critical that kills its target passes the leftover damage on to a new target in reach.</p>
        <h3>Shared Initiative</h3>
        <p>Tie with a friend and you choose the order, or act together. Tie with a monster and you go first.</p>
        <h3>Death</h3>
        <p>Fail your third death save and you lose one character level. You may keep the character,
        or make a new one a level below the rest.</p>
        <h3>P.A.C.T. Pods</h3>
        <p>A reaction press of the blue "S" raises your AC by 2 until your next turn and spends a
        charge. You get more charges as you level, five by ninth. The Command Pod restores four
        charges on a long rest and is how the higher-ups send you things. At seventh level you choose
        a Pod Archetype — Attack, Defence or Utility — and at tenth you bond with the thing.</p>`,
      buttons: [{ label: 'Close' }]
    });
  }

  function settings() {
    const cfg = DH.save.loadConfig();
    DH.ui.modal({
      title: 'Settings',
      build(m) {
        const mk = (label, key) => {
          const wrap = DH.ui.add(m, 'div', 'sect');
          const lab = DH.ui.add(wrap, 'div', 'small dim', label + ': ' + Math.round(DH.audio.getVolume(key) * 100) + '%');
          const inp = DH.ui.el('input'); inp.type = 'range'; inp.min = 0; inp.max = 100;
          inp.value = Math.round(DH.audio.getVolume(key) * 100);
          inp.oninput = () => {
            DH.audio.setVolume(key, inp.value / 100);
            lab.textContent = label + ': ' + inp.value + '%';
            cfg['vol_' + key] = inp.value / 100;
            DH.save.saveConfig(cfg);
          };
          wrap.appendChild(inp);
        };
        mk('Master volume', 'master');
        mk('Music', 'music');
        mk('Sound effects', 'sfx');
        const row = DH.ui.add(m, 'div', 'sect');
        row.appendChild(DH.ui.btn(DH.audio.isMuted() ? 'Unmute everything' : 'Mute everything', '', (e) => {
          DH.audio.setMuted(!DH.audio.isMuted());
          e.target.textContent = DH.audio.isMuted() ? 'Unmute everything' : 'Mute everything';
        }));
        DH.ui.add(m, 'p', 'tiny faint', 'All music and sound is synthesized in the browser at runtime. There are no audio files.');
      },
      buttons: [{ label: 'Close' }]
    });
  }

  function credits() {
    DH.ui.modal({
      title: 'Credits',
      html: `
        <p><b>Drakehaven Island</b> — a tactical role-playing game built from nothing: no engine,
        no libraries, no image files, no audio files. Every sprite is drawn by code onto a canvas and
        every note is synthesized live.</p>
        <h3>The Story</h3>
        <p>The campaign, its people, its stat blocks and its house rules come from a real table:
        the Mary Parker in a storm, the sea hags, P.A.C.T. and its pods, the crazy ones, the
        Half-Dragon, Grimble's trials, the swamp, the arena, and the golden egg at the ball.</p>
        <h3>The Party</h3>
        <p>Anvil, Umarion and the Ball Wizard — plus whoever you just made.</p>
        <h3>Rules</h3>
        <p>A hand-written implementation of fifth-edition-style play: d20 tests, advantage,
        conditions, spell slots, and a grid where a square is five feet.</p>`,
      buttons: [{ label: 'Close' }]
    });
  }

  /* ---------------- animated background ---------------- */
  function update(dt) {
    t += dt;
    flashT -= dt;
    nextFlash -= dt;
    if (nextFlash <= 0) {
      nextFlash = U.rint(4, 11);
      flashT = 0.42;
      DH.audio.sfx('thunder');
      G.shake(4);
    }
  }

  function draw() {
    const W = G.VW, H = G.VH;
    /* sky */
    G.rect(0, 0, W, H, '#0b1220', true);
    for (let i = 0; i < 5; i++) {
      const y = 8 + i * 12;
      G.alpha(0.12 + i * 0.03, () => G.rect(0, y, W, 12, '#1b2740', true));
    }
    /* distant lightning glow */
    if (flashT > 0) {
      const a = Math.max(0, flashT / 0.42);
      G.flash(a * 0.5);
    }
    /* the island silhouette */
    const horizon = H * 0.55;
    G.alpha(0.9, () => {
      G.poly([[W * 0.55, horizon], [W * 0.66, horizon - 46], [W * 0.72, horizon - 30],
      [W * 0.80, horizon - 62], [W * 0.9, horizon - 20], [W, horizon], [W, H], [W * 0.55, H]], '#0a1018', true);
    });
    /* sea */
    G.rect(0, horizon, W, H - horizon, '#0e2438', true);
    for (let i = 0; i < 22; i++) {
      const yy = horizon + i * 6;
      const amp = 3 + i * 0.8;
      const off = Math.sin(t * 1.4 + i * 0.7) * amp;
      G.alpha(0.5 - i * 0.014, () => {
        G.rect(0 + off, yy, W, 3, i % 2 ? '#183a55' : '#12303f', true);
      });
      if (i % 5 === 0) {
        G.alpha(0.35, () => G.rect((Math.sin(t * 0.8 + i) * 0.5 + 0.5) * W, yy, 22, 2, '#7fb8d0', true));
      }
    }
    /* the ship, small and pitching */
    const sx = W * 0.26, sy = horizon + 26 + Math.sin(t * 1.1) * 5;
    const tilt = Math.sin(t * 1.1) * 0.1;
    const ctx = G.ctx;
    ctx.save();
    ctx.translate(sx, sy); ctx.rotate(tilt);
    ctx.fillStyle = '#2b1f14'; ctx.fillRect(-30, -6, 60, 12);
    ctx.fillStyle = '#3d2c1c'; ctx.fillRect(-26, -9, 52, 4);
    ctx.fillStyle = '#4a3826'; ctx.fillRect(-2, -52, 4, 46);
    ctx.fillStyle = '#c8bca0';
    ctx.beginPath(); ctx.moveTo(0, -48); ctx.lineTo(20, -18); ctx.lineTo(0, -18); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(0, -44); ctx.lineTo(-16, -20); ctx.lineTo(0, -20); ctx.closePath(); ctx.fill();
    /* lantern */
    const lit = 0.6 + Math.sin(t * 6) * 0.15;
    ctx.fillStyle = 'rgba(232,189,88,' + lit + ')';
    ctx.fillRect(-24, -14, 3, 4);
    ctx.restore();
    /* rain and vignette */
    G.rain(1.3, 5);
    G.vignette(0.62);
    G.updateParticles();
  }

  return { name: 'title', enter, exit, resume, update, draw };
})();

</script>
<script>
/* ---- js/scenes/charcreate.js ---- */
/* Drakehaven Island — character creation, staged like Baldur's Gate 3:
   Race ▸ Class ▸ Subclass ▸ Abilities ▸ Background ▸ Skills ▸ Look ▸ Name ▸ Review */
window.DH = window.DH || {};

DH.scenes.charcreate = (function () {
  'use strict';
  const U = DH.util, C = DH.char;

  const STEPS = ['Race', 'Class', 'Subclass', 'Abilities', 'Background', 'Skills', 'Look', 'Name', 'Review'];
  /* You are one of five adventurers already posted together, so you begin as
     their peer rather than three levels behind them. */
  const START_LEVEL = 3;
  const POINT_BUY_COST = { 8: 0, 9: 1, 10: 2, 11: 3, 12: 4, 13: 5, 14: 7, 15: 9 };
  const STANDARD_ARRAY = [15, 14, 13, 12, 10, 8];

  let step = 0, draft = null, slot = 1, portraitCv = null, tick = 0;

  function enter(arg) {
    slot = (arg && arg.slot) || 1;
    step = 0;
    draft = {
      raceId: null, ancestry: null, classId: null, subclassId: null,
      backgroundId: null, skills: [], expertise: [],
      method: 'pointbuy', pool: 27,
      base: { str: 8, dex: 8, con: 8, int: 8, wis: 8, cha: 8 },
      rolled: null, arrayAssign: {},
      flexBonus: {},
      appearance: { skin: null, hair: null, cloth: '#5a4a7a', cloth2: '#3a3050', hairStyle: 'short' },
      name: '', fightingStyle: null, cantrips: [], spellsKnown: [], metamagic: [], invocations: [], pactBoon: null
    };
    DH.audio.play('title');
    DH.audio.ambience('sea');
    render();
  }
  function exit() { DH.ui.clear(); }

  /* =============== helpers =============== */
  const race = () => draft.raceId ? DH.raceById(draft.raceId) : null;
  const cls = () => draft.classId ? DH.classById(draft.classId) : null;
  const sub = () => {
    const c = cls();
    return c && draft.subclassId ? (c.subclasses || []).find(s => s.id === draft.subclassId) : null;
  };
  const bg = () => draft.backgroundId ? DH.backgroundById(draft.backgroundId) : null;

  function finalAbilities() {
    const out = Object.assign({}, draft.base);
    const r = race();
    if (r) {
      Object.keys(r.bonus || {}).forEach(k => out[k] += r.bonus[k]);
      Object.keys(r.penalty || {}).forEach(k => out[k] += r.penalty[k]);
    }
    Object.keys(draft.flexBonus || {}).forEach(k => out[k] += draft.flexBonus[k]);
    return out;
  }
  function racialFor(ab) {
    const r = race(); let n = 0;
    if (r) { n += (r.bonus || {})[ab] || 0; n += (r.penalty || {})[ab] || 0; }
    n += (draft.flexBonus || {})[ab] || 0;
    return n;
  }

  /** A live preview character so the side panel can show real numbers. */
  function preview() {
    const ch = C.blank();
    ch.name = draft.name || 'Unnamed';
    if (race()) { ch.raceId = draft.raceId; ch.raceName = race().name; }
    ch.ancestry = draft.ancestry;
    if (cls()) { ch.classId = draft.classId; ch.className = cls().name; }
    ch.subclassId = draft.subclassId;
    if (bg()) { ch.backgroundId = draft.backgroundId; ch.backgroundName = bg().name; }
    ch.base = Object.assign({}, draft.base);
    ch.flexBonus = Object.assign({}, draft.flexBonus);
    ch.level = START_LEVEL;
    ch.skills = draft.skills.slice();
    if (bg()) (bg().skills || []).forEach(s => { if (ch.skills.indexOf(s) < 0) ch.skills.push(s); });
    ch.fightingStyle = draft.fightingStyle;
    ch.appearance = Object.assign({}, draft.appearance);
    if (cls()) {
      ch.saveProfs = (cls().saves || []).slice();
      ch.profs.armor = (cls().armor || []).slice();
      ch.profs.weapons = (cls().weapons || []).slice();
      (cls().kit || []).forEach(id => C.addItem(ch, id));
    }
    if (bg()) (bg().kit || []).forEach(id => C.addItem(ch, id));
    C.derive(ch);
    C.autoEquip(ch);
    C.derive(ch);
    return ch;
  }

  function canAdvance() {
    switch (STEPS[step]) {
      case 'Race': return !!draft.raceId && (!race().ancestries || !!draft.ancestry) &&
        (!race().flexBonus || Object.keys(draft.flexBonus).length === race().flexBonus.count);
      case 'Class': return !!draft.classId;
      case 'Subclass': return subclassNeededNow() ? !!draft.subclassId : true;
      case 'Abilities': return abilitiesValid();
      case 'Background': return !!draft.backgroundId;
      case 'Skills': return draft.skills.length === skillsToPick();
      case 'Look': return true;
      case 'Name': return (draft.name || '').trim().length > 0;
      case 'Review': return true;
    }
    return true;
  }
  /* Every class has its subclass by 3rd level, so it is always part of creation. */
  function subclassNeededNow() {
    const c = cls(); if (!c) return false;
    return C.subclassLevel(c) <= START_LEVEL;
  }
  function abilitiesValid() {
    if (draft.method === 'pointbuy') return draft.pool === 0 || draft.pool >= 0;
    if (draft.method === 'array') return Object.keys(draft.arrayAssign).length === 6;
    if (draft.method === 'roll') return !!draft.rolled && Object.keys(draft.arrayAssign).length === 6;
    return true;
  }
  function skillsToPick() {
    const c = cls(); if (!c) return 0;
    let n = c.skillCount || 2;
    n += C.effectValue({ effects: raceEffects() }, 'skill_choice');
    return n;
  }
  function raceEffects() {
    const r = race(); const out = [];
    if (r) (r.traits || []).forEach(t => (t.effects || []).forEach(e => out.push(e)));
    return out;
  }
  function skillPool() {
    const c = cls();
    const extra = C.effectValue({ effects: raceEffects() }, 'skill_choice') > 0;
    let pool = c ? c.skillList.slice() : [];
    if (extra) pool = DH.ALL_SKILLS.slice();
    /* background skills come free and cannot be double-picked */
    const b = bg();
    if (b) pool = pool.filter(s => (b.skills || []).indexOf(s) < 0);
    const rEff = raceEffects();
    pool = pool.filter(s => rEff.indexOf('skill:' + s) < 0);
    return pool;
  }

  /* =============== rendering =============== */
  function render() {
    DH.ui.clear();
    const root = document.getElementById('ui');
    const wrap = DH.ui.el('div'); wrap.id = 'cc';
    root.appendChild(wrap);

    /* step rail */
    const rail = DH.ui.add(wrap, 'div'); rail.id = 'cc-steps';
    STEPS.forEach((s, i) => {
      const e = DH.ui.add(rail, 'div', 'st' + (i === step ? ' on' : i < step ? ' done' : ''), (i + 1) + '. ' + s);
      if (i < step) e.onclick = () => { step = i; render(); };
    });

    const body = DH.ui.add(wrap, 'div'); body.id = 'cc-body';
    const list = DH.ui.add(body, 'div'); list.id = 'cc-list';
    const mid = DH.ui.add(body, 'div'); mid.id = 'cc-mid';
    const side = DH.ui.add(body, 'div'); side.id = 'cc-side';

    const foot = DH.ui.add(wrap, 'div'); foot.id = 'cc-foot';
    const back = DH.ui.btn(step === 0 ? '← Main Menu' : '← Back', 'ghost', () => {
      if (step === 0) DH.game.replace(DH.scenes.title);
      else { step--; render(); }
    });
    foot.appendChild(back);
    DH.ui.add(foot, 'div', 'grow');
    const hint = DH.ui.add(foot, 'div', 'tiny faint', '');
    const next = DH.ui.btn(step === STEPS.length - 1 ? 'Begin the Story  ▸' : 'Next  ▸', 'primary', () => {
      if (step === STEPS.length - 1) { finish(); return; }
      step++;
      /* skip the subclass step for any class that has not got one by now */
      if (STEPS[step] === 'Subclass' && !subclassNeededNow()) step++;
      render();
    });
    next.disabled = !canAdvance();
    if (!canAdvance()) hint.textContent = hintFor();
    foot.appendChild(next);

    switch (STEPS[step]) {
      case 'Race': stepRace(list, mid); break;
      case 'Class': stepClass(list, mid); break;
      case 'Subclass': stepSubclass(list, mid); break;
      case 'Abilities': stepAbilities(list, mid); break;
      case 'Background': stepBackground(list, mid); break;
      case 'Skills': stepSkills(list, mid); break;
      case 'Look': stepLook(list, mid); break;
      case 'Name': stepName(list, mid); break;
      case 'Review': stepReview(list, mid); break;
    }
    sidePanel(side);
  }

  function hintFor() {
    switch (STEPS[step]) {
      case 'Race': {
        if (!draft.raceId) return 'Choose a people.';
        if (race().ancestries && !draft.ancestry) return 'Choose your draconic ancestry.';
        return 'Assign your two flexible +1 bonuses.';
      }
      case 'Class': return 'Choose a class.';
      case 'Subclass': return 'Choose a subclass.';
      case 'Abilities': return draft.method === 'pointbuy' ? 'Spend your points.' : 'Assign every score.';
      case 'Background': return 'Choose a background.';
      case 'Skills': return 'Pick ' + skillsToPick() + ' skill' + (skillsToPick() === 1 ? '' : 's') +
        ' (' + draft.skills.length + ' chosen).';
      case 'Name': return 'Your character needs a name.';
    }
    return '';
  }

  /* ---------- step: race ---------- */
  function stepRace(list, mid) {
    DH.RACES.forEach(r => {
      const o = DH.ui.el('div', 'opt' + (draft.raceId === r.id ? ' on' : ''));
      const chip = DH.ui.el('div', 'chip');
      chip.style.background = (r.look.skin && r.look.skin[0]) || '#888';
      o.appendChild(chip);
      const nm = DH.ui.el('div', 'nm', DH.ui.esc(r.name) +
        '<div class="bit">' + bonusText(r) + '</div>');
      o.appendChild(nm);
      o.onclick = () => {
        draft.raceId = r.id;
        draft.ancestry = r.ancestries ? (draft.ancestry || null) : null;
        draft.flexBonus = {};
        draft.appearance.skin = r.look.skin ? r.look.skin[0] : null;
        draft.appearance.hair = r.look.hair ? r.look.hair[0] : null;
        DH.audio.sfx('select');
        render();
      };
      list.appendChild(o);
    });

    const r = race();
    if (!r) { DH.ui.add(mid, 'h1', '', 'Choose a People'); DH.ui.add(mid, 'div', 'prose', 'Fifteen peoples sail these waters, and most of them end up on Drakehaven eventually. Your choice sets your speed, your senses and a handful of things you can simply do.'); return; }
    DH.ui.add(mid, 'h1', '', r.name);
    DH.ui.add(mid, 'div', 'sub', r.size + ' · ' + r.speed + ' ft speed');
    DH.ui.add(mid, 'div', 'prose', DH.ui.esc(r.blurb));
    const tags = DH.ui.add(mid, 'div', 'tagrow');
    tags.innerHTML = Object.keys(r.bonus || {}).map(k =>
      '<span class="tag gold">' + k.toUpperCase() + ' ' + U.plus(r.bonus[k]) + '</span>').join('') +
      Object.keys(r.penalty || {}).map(k =>
        '<span class="tag">' + k.toUpperCase() + ' ' + U.plus(r.penalty[k]) + '</span>').join('');
    DH.ui.add(mid, 'div', 'body-h2', 'Traits');
    (r.traits || []).forEach(t => {
      const f = DH.ui.add(mid, 'div', 'feat');
      f.innerHTML = '<b>' + DH.ui.esc(t.name) + '</b><p>' + DH.ui.esc(t.desc) + '</p>';
    });

    if (r.ancestries) {
      DH.ui.add(mid, 'div', 'body-h2', 'Draconic Ancestry');
      DH.ui.add(mid, 'div', 'prose', 'This sets your breath weapon and what you shrug off. On an island where dragons have started shouting about their eggs, it also sets how people look at you.');
      const row = DH.ui.add(mid, 'div', 'swrow');
      r.ancestries.forEach(a => {
        const s = DH.ui.el('div', 'sw' + (draft.ancestry === a.id ? ' on' : ''));
        s.style.background = a.col;
        s.title = a.name + ' — ' + a.dmg + ' (' + a.shape + ')';
        s.onclick = () => { draft.ancestry = a.id; draft.appearance.skin = a.col; DH.audio.sfx('select'); render(); };
        row.appendChild(s);
      });
      if (draft.ancestry) {
        const a = r.ancestries.find(x => x.id === draft.ancestry);
        DH.ui.add(mid, 'div', 'small dim', a.name + ' dragonborn — ' + a.dmg + ' damage, ' + a.shape + ' breath, resistance to ' + a.dmg + '.');
      }
    }

    if (r.flexBonus) {
      DH.ui.add(mid, 'div', 'body-h2', 'Two Flexible Bonuses');
      DH.ui.add(mid, 'div', 'prose', 'Assign +1 to two different abilities other than Charisma.');
      DH.ABILITIES.forEach(ab => {
        if ((r.flexBonus.exclude || []).indexOf(ab.id) >= 0) return;
        const on = !!draft.flexBonus[ab.id];
        const o = DH.ui.el('div', 'opt' + (on ? ' on' : ''));
        o.innerHTML = '<div class="nm">' + ab.name + ' <span class="bit">' + (on ? '+1' : '') + '</span></div>';
        o.style.marginBottom = '4px';
        o.onclick = () => {
          if (on) delete draft.flexBonus[ab.id];
          else if (Object.keys(draft.flexBonus).length < r.flexBonus.count) draft.flexBonus[ab.id] = 1;
          DH.audio.sfx('select'); render();
        };
        mid.appendChild(o);
      });
    }
  }
  function bonusText(r) {
    const parts = Object.keys(r.bonus || {}).map(k => k.toUpperCase() + U.plus(r.bonus[k]));
    if (r.flexBonus) parts.push('+1 ×2 free');
    return parts.join(' ');
  }

  /* ---------- step: class ---------- */
  function stepClass(list, mid) {
    DH.CLASSES.forEach(c => {
      const o = DH.ui.el('div', 'opt' + (draft.classId === c.id ? ' on' : ''));
      o.innerHTML = '<div class="nm">' + c.name +
        '<div class="bit">d' + c.hitDie + ' · ' + c.primary.map(p => p.toUpperCase()).join('/') +
        (c.caster ? ' · caster' : '') + '</div></div>';
      o.onclick = () => {
        draft.classId = c.id;
        draft.subclassId = null;
        draft.skills = [];
        draft.fightingStyle = null;
        draft.cantrips = []; draft.spellsKnown = [];
        DH.audio.sfx('select'); render();
      };
      list.appendChild(o);
    });
    const c = cls();
    if (!c) {
