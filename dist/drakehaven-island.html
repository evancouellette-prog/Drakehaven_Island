        /* offer the sea hag's necklace on a hard test, if its charge is unspent */
        if (!adv && val(s.dc) >= 13) {
          const boon = findBoon(who);
          if (boon) {
            const use = await DH.ui.choose(
              [{ text: 'Spend the necklace\'s charge for advantage.' }, { text: 'Save it.' }],
              { who: 'The Sea Hag\'s Necklace', text: 'The salt-crusted silver goes cold against your skin. It has one favour in it, and it will not have another until you rest.' });
            DH.ui.hideDlg();
            if (use === 0) { boon.charges--; adv = true; DH.audio.sfx('shield'); }
          }
        }
        const r = await DH.ui.roller({
          label: label, dc: val(s.dc), mod: mod, adv: adv, dis: dis,
          modLabel: s.ability ? s.ability.toUpperCase() : (DH.SKILLS[s.skill] || {}).name
        });
        if (r.success) {
          if (s.set) DH.game.setFlag(s.set);
          if (s.ok) { const j = await play(s.ok); if (j === 'STOP') return 'STOP'; }
        } else {
          if (s.setFail) DH.game.setFlag(s.setFail);
          if (s.fail) { const j = await play(s.fail); if (j === 'STOP') return 'STOP'; }
        }
        return;
      }

      /* Best of the whole party, the way a table actually plays it. */
      case 'partyCheck': {
        const party = DH.game.party().filter(c => !c.dead);
        let best = party[0], bestMod = -99;
        party.forEach(c => {
          const m = s.ability ? C.abMod(c, s.ability) : C.skillMod(c, s.skill);
          if (m > bestMod) { bestMod = m; best = c; }
        });
        const r = await DH.ui.roller({
          label: (DH.SKILLS[s.skill] ? DH.SKILLS[s.skill].name : U.titleCase(s.skill)) + ' — ' + best.name,
          dc: val(s.dc), mod: bestMod, adv: !!s.adv, dis: !!s.dis
        });
        if (r.success) { if (s.set) DH.game.setFlag(s.set); if (s.ok) { const j = await play(s.ok); if (j === 'STOP') return 'STOP'; } }
        else { if (s.setFail) DH.game.setFlag(s.setFail); if (s.fail) { const j = await play(s.fail); if (j === 'STOP') return 'STOP'; } }
        return;
      }

      /* Every character rolls a save; used for gas, spores, rune rays. */
      case 'partySave': {
        const dc = val(s.dc);
        const lines = [];
        for (const c of DH.game.party().filter(x => !x.dead)) {
          const r = DH.dice.d20({ mod: C.saveMod(c, s.ability), dc: dc });
          if (!r.success) {
            if (s.dmg) { const d = DH.dice.roll(s.dmg); C.applyDamage(c, s.half ? Math.floor(d.total / 2) : d.total, s.type); lines.push(c.name + ' fails (' + r.total + ') and takes ' + d.total); }
            if (s.cond) C.addCondition(c, s.cond, s.dur || 100);
            if (!s.dmg) lines.push(c.name + ' fails (' + r.total + ')');
            if (s.setFail) DH.game.setFlag(s.setFail);
          } else {
            if (s.dmg && s.half) { const d = DH.dice.roll(s.dmg); C.applyDamage(c, Math.floor(d.total / 2), s.type); lines.push(c.name + ' saves (' + r.total + '), half: ' + Math.floor(d.total / 2)); }
            else lines.push(c.name + ' saves (' + r.total + ')');
          }
        }
        await DH.ui.say({ who: s.who || 'Saving Throws', narr: true, text: lines.join('\n') });
        return;
      }

      case 'combat': {
        DH.ui.hideDlg();
        const result = await fight(s);
        if (result.won) {
          if (s.set) DH.game.setFlag(s.set);
          if (s.onWin) { const j = await play(s.onWin); if (j === 'STOP') return 'STOP'; }
        } else {
          if (s.onLose) { const j = await play(s.onLose); if (j === 'STOP') return 'STOP'; }
          else {
            await DH.ui.say({ who: 'The Table', narr: true, text: 'The party goes down — but the story does not stop here. You come to some time later, lighter by a level and a great deal of dignity.' });
          }
        }
        return;
      }

      case 'give': DH.game.giveItem(val(s.item), val(s.qty) || 1, s.quiet); return;
      case 'giveAll': DH.game.giveItemToAll(val(s.item), val(s.qty) || 1); return;
      case 'gold': DH.game.giveGold(val(s.n)); return;
      case 'take': C.removeItem(DH.game.pc(), val(s.item), val(s.qty) || 1); return;
      case 'xp': DH.game.awardXp(val(s.n)); return;

      case 'flag': DH.game.setFlag(s.k, s.v === undefined ? true : s.v); return;
      case 'quest': DH.game.addQuest(s.id, s.title, s.desc); return;
      case 'questDone': DH.game.completeQuest(s.id, s.xp); return;
      case 'count': DH.game.bump(s.k, s.n); return;

      case 'music': DH.audio.play(s.id, { restart: s.restart }); return;
      case 'ambience': DH.audio.ambience(s.id); return;
      case 'sfx': DH.audio.sfx(s.id); return;
      case 'thunder': DH.audio.stormThunder(s.on !== false); return;

      case 'chapter':
        DH.game.state.chapter = s.n || DH.game.state.chapter;
        await DH.ui.chapter(s.label, val(s.title), val(s.sub), s.ms);
        return;

      case 'banner': DH.ui.banner(val(s.big), val(s.small), s.ms); await U.wait(s.ms || 1400); return;
      case 'toast': DH.ui.toast(val(s.text), s.kind, s.ms); return;

      case 'travel':
        DH.ui.hideDlg();
        await DH.game.travel(s.map, s.spawn);
        await U.wait(360);
        return;

      case 'wait': await U.wait(s.ms || 500); return;
      case 'fadeOut': await DH.ui.fadeOut(s.ms); return;
      case 'fadeIn': await DH.ui.fadeIn(s.ms); return;
      case 'shake': G.shake(s.amt || 5); return;
      case 'flash': G.flash(0.6); DH.audio.sfx('thunder'); return;
      case 'particles': G.emit(s.kind || 'spark', G.VW / 2 + G.cam.x, G.VH / 2 + G.cam.y, s.n || 20, { life: 40 }); return;

      case 'shop': {
        DH.ui.hideDlg();
        await openShop(s.id);
        return;
      }
      case 'minigame': {
        DH.ui.hideDlg();
        await openMinigame(s.game, s.opts);
        return;
      }

      case 'join': {
        const ch = DH.game.addCompanion(s.who);
        if (ch) {
          DH.ui.toast(ch.name + ' joins you — ' + ch.raceName + ' ' + ch.className, 'good', 2600);
          DH.audio.sfx('quest');
          if (DH.scenes.overworld.map) DH.scenes.overworld.loadMap(DH.game.state.map, null);
        }
        return;
      }
      case 'joinAll': {
        ['anvil', 'umarion', 'ball_wizard'].forEach(id => DH.game.addCompanion(id));
        DH.ui.toast('The whole party is on its feet.', 'good', 2400);
        return;
      }
      case 'pods': DH.game.issuePods(); DH.ui.toast('P.A.C.T. Pods issued to everyone.', 'item', 3000); return;
      case 'tamePet': DH.game.state.pet = s.id || 'grey_cat'; DH.ui.toast('The cat is yours now.', 'good'); DH.audio.sfx('meow'); return;
      case 'longRest': DH.game.longRest(); return;
      case 'shortRest': DH.game.shortRest(); return;
      case 'heal': DH.game.party().forEach(c => C.heal(c, val(s.n) || 999)); DH.ui.toast('Everyone patched up.', 'good'); return;

      case 'setTile': (s.edits || []).forEach(e => DH.setMapChar(DH.MAPS[s.map || DH.game.state.map], e.x, e.y, e.c)); return;
      case 'deadline': DH.game.state.contractDeadlineDay = DH.game.state.day + (s.days || 60); return;
      case 'muster': DH.game.state.musterDay = DH.game.state.day + (s.days || 1); return;

      case 'if': {
        const ok = s.flag ? DH.game.flag(s.flag) : s.test ? !!s.test(DH.game.state, ctx()) : false;
        const branch = ok ? s.then : s.else;
        if (branch) { const j = await play(branch); if (j === 'STOP') return 'STOP'; }
        return;
      }
      case 'do': if (s.fn) await s.fn(DH.game.state, ctx()); return;
      case 'run': { const l = DH.STORY[s.id]; if (l) { const j = await play(l); if (j === 'STOP') return 'STOP'; } return; }
      case 'stop': return 'STOP';

      default:
        console.warn('unknown story step', s);
        return;
    }
  }

  function meets(need) {
    if (!need) return true;
    if (need.flag && !DH.game.flag(need.flag)) return false;
    if (need.noFlag && DH.game.flag(need.noFlag)) return false;
    if (need.item && !C.hasItem(DH.game.pc(), need.item)) return false;
    if (need.gold && DH.game.partyGold() < need.gold) return false;
    if (need.skill && !C.isProficient(DH.game.pc(), need.skill)) return false;
    if (need.classId && DH.game.pc().classId !== need.classId) return false;
    if (need.companion && !DH.game.hasCompanion(need.companion)) return false;
    if (need.test && !need.test(DH.game.state)) return false;
    return true;
  }

  /* An item carried by anyone in the party that can buy advantage once per rest. */
  function findBoon(who) {
    const carriers = [who].concat(DH.game.party());
    for (const c of carriers) {
      if (!c || !c.inv) continue;
      const slot = c.inv.find(s => {
        const it = DH.item(s.id);
        return it && (it.effects || []).indexOf('boon_advantage') >= 0 && (s.charges || 0) > 0;
      });
      if (slot) return slot;
    }
    return null;
  }

  /* Who rolls? The player by default; 'party' picks whoever is best. */
  function pickChecker(skill, by) {
    const party = DH.game.party().filter(c => !c.dead);
    if (by === 'party' && skill) {
      let best = party[0], bm = -99;
      party.forEach(c => { const m = C.skillMod(c, skill); if (m > bm) { bm = m; best = c; } });
      return best;
    }
    if (by && typeof by === 'string') {
      const c = party.find(x => x.companionId === by);
      if (c) return c;
    }
    return DH.game.pc();
  }

  /* =============== bridges to the other scenes =============== */
  function fight(s) {
    return new Promise(resolve => {
      DH.game.push(DH.scenes.combat, {
        arena: val(s.arena), enemies: val(s.enemies) || [], allies: val(s.allies) || [],
        onRound: s.onRound, onDown: s.onDown, winWhen: s.winWhen,
        onDone: (result) => resolve(result)
      });
      DH.game.flushOps();
    });
  }
  function openShop(id) {
    return new Promise(resolve => {
      DH.game.push(DH.scenes.shop, { id: id, onDone: resolve });
      DH.game.flushOps();
    });
  }
  function openMinigame(game, opts) {
    return new Promise(resolve => {
      DH.game.push(DH.scenes.minigames, Object.assign({ game: game, onDone: resolve }, opts || {}));
      DH.game.flushOps();
    });
  }

  return { name: 'script', enter, exit, update, draw, run, runInline, isRunning, play, fight };
})();

</script>
<script>
/* ---- js/scenes/shop.js ---- */
/* Drakehaven Island — buying and selling. Stock is real and runs out. */
window.DH = window.DH || {};

DH.scenes.shop = (function () {
  'use strict';
  const U = DH.util, C = DH.char;

  let def = null, id = null, stock = null, sel = null, selSide = 'buy', onDone = null;

  function enter(arg) {
    id = arg.id;
    def = DH.SHOPS[id];
    onDone = arg.onDone || null;
    if (!def) { close(); return; }
    stock = DH.game.shopStock(id);
    sel = null;
    if (def.music) DH.audio.play(def.music);
    build();
  }
  function exit() { DH.ui.clear(); }
  function resume() { build(); }
  function pause() { DH.ui.clear(); }

  function close() {
    DH.game.pop();
    DH.game.flushOps();
    if (onDone) onDone();
  }

  function build() {
    DH.ui.clear();
    const root = document.getElementById('ui');
    const wrap = DH.ui.el('div'); wrap.id = 'shop';
    root.appendChild(wrap);
    const win = DH.ui.add(wrap, 'div', 'win panel gilt');

    const hd = DH.ui.add(win, 'div', 'hd');
    DH.ui.add(hd, 'h2', '', DH.ui.esc(def.name));
    const g = DH.ui.add(hd, 'div', 'gold');
    g.id = 'shop-gold';
    g.textContent = U.commas(DH.game.partyGold()) + ' gp';
    hd.appendChild(DH.ui.btn('Leave (Esc)', '', close));

    const cols = DH.ui.add(win, 'div', 'cols');

    /* buy side */
    const buy = DH.ui.add(cols, 'div', 'side');
    DH.ui.add(buy, 'h3', '', (def.shady ? 'ON OFFER — QUIETLY' : 'FOR SALE'));
    const buyList = DH.ui.add(buy, 'div', 'list'); buyList.id = 'shop-buy';
    /* sell side */
    const sell = DH.ui.add(cols, 'div', 'side');
    DH.ui.add(sell, 'h3', '', 'YOUR PACK — SELLS FOR A THIRD');
    const sellList = DH.ui.add(sell, 'div', 'list'); sellList.id = 'shop-sell';

    const detail = DH.ui.add(win, 'div', 'detail'); detail.id = 'shop-detail';
    detail.innerHTML = '<b>' + DH.ui.esc(def.keeper) + '</b><p>' + DH.ui.esc(def.greet) + '</p>';

    refresh();
  }

  function refresh() {
    const buyList = document.getElementById('shop-buy');
    const sellList = document.getElementById('shop-sell');
    const gold = DH.game.partyGold();
    if (!buyList) return;
    buyList.innerHTML = '';
    stock.forEach(row => {
      const it = DH.item(row.id);
      if (!it) return;
      const afford = gold >= it.price && row.qty > 0;
      const e = DH.ui.el('div', 'wares' + (afford ? '' : ' poor') +
        (sel && selSide === 'buy' && sel.id === row.id ? ' on' : ''));
      e.innerHTML = '<div class="grow">' + DH.ui.esc(it.name) +
        '<div class="st">' + (row.qty > 0 ? row.qty + ' in stock' : 'sold out') + '</div></div>' +
        '<div class="pr">' + U.commas(it.price) + ' gp</div>';
      e.onclick = () => { sel = row; selSide = 'buy'; showDetail(it, 'buy', row); refresh(); };
      e.ondblclick = () => doBuy(row);
      buyList.appendChild(e);
    });

    sellList.innerHTML = '';
    const pc = DH.game.pc();
    pc.inv.forEach(slot => {
      const it = DH.item(slot.id);
      if (!it) return;
      if (it.quest) return;                 // story items are not for sale
      if (def.buys && def.buys.length && def.buys.indexOf(slot.id) < 0 && it.kind !== 'material') {
        /* specialised buyers still take general goods at a worse rate */
      }
      const price = DH.sellPrice(slot.id);
      const e = DH.ui.el('div', 'wares' + (sel && selSide === 'sell' && sel.id === slot.id ? ' on' : ''));
      const equipped = Object.keys(pc.equipped).some(k => pc.equipped[k] === slot.id);
      e.innerHTML = '<div class="grow">' + DH.ui.esc(it.name) + (slot.qty > 1 ? ' ×' + slot.qty : '') +
        (equipped ? '<div class="st">equipped</div>' : '') + '</div>' +
        '<div class="pr">' + U.commas(price) + ' gp</div>';
      e.onclick = () => { sel = slot; selSide = 'sell'; showDetail(it, 'sell', slot); refresh(); };
      e.ondblclick = () => doSell(slot);
      sellList.appendChild(e);
    });
    const gd = document.getElementById('shop-gold');
    if (gd) gd.textContent = U.commas(gold) + ' gp';
  }

  function showDetail(it, side, row) {
    const d = document.getElementById('shop-detail');
    if (!d) return;
    d.innerHTML = '';
    const title = DH.ui.add(d, 'b', '', DH.ui.esc(it.name) +
      (it.rarity ? ' <span class="dim small">(' + it.rarity + ')</span>' : ''));
    const bits = [];
    if (it.kind === 'weapon') bits.push(it.dmg + ' ' + it.type + (it.props ? ' · ' + it.props.join(', ') : ''));
    if (it.kind === 'armor') bits.push(it.armorKind + (it.ac ? ' · AC ' + it.ac : '') + (it.acBonus ? ' · +' + it.acBonus + ' AC' : ''));
    if (it.attune) bits.push('requires attunement');
    if (it.illegal) bits.push('very much illegal');
    DH.ui.add(d, 'p', '', DH.ui.esc(it.desc || bits.join(' · ') || '') + (it.desc && bits.length ? '<br><span class="dim small">' + DH.ui.esc(bits.join(' · ')) + '</span>' : ''));
    const row2 = DH.ui.add(d, 'div', 'row');
    if (side === 'buy') {
      const b = DH.ui.btn('Buy — ' + U.commas(it.price) + ' gp', 'primary', () => doBuy(row));
      b.disabled = DH.game.partyGold() < it.price || row.qty <= 0;
      row2.appendChild(b);
      if (row.qty >= 5) {
        const b5 = DH.ui.btn('Buy 5', '', () => { for (let i = 0; i < 5; i++) doBuy(row, true); refresh(); });
        b5.disabled = DH.game.partyGold() < it.price * 5;
        row2.appendChild(b5);
      }
    } else {
      row2.appendChild(DH.ui.btn('Sell — ' + U.commas(DH.sellPrice(it.id)) + ' gp', 'primary', () => doSell(row)));
      if (row.qty > 1) row2.appendChild(DH.ui.btn('Sell all ' + row.qty, '', () => {
        const n = row.qty; for (let i = 0; i < n; i++) doSell(row, true); refresh();
      }));
    }
  }

  function doBuy(row, quiet) {
    const it = DH.item(row.id);
    if (!it || row.qty <= 0) return;
    if (!DH.game.spendGold(it.price)) { if (!quiet) DH.ui.toast('Not enough coin.', 'bad'); return; }
    row.qty--;
    C.addItem(DH.game.pc(), row.id, 1);
    DH.audio.sfx('coin');
    if (!quiet) { DH.ui.toast('Bought ' + it.name, 'item', 1400); refresh(); showDetail(it, 'buy', row); }
    DH.game.addAffinity('shop_' + id, 1);
  }
  function doSell(slot, quiet) {
    const it = DH.item(slot.id);
    if (!it) return;
    const price = DH.sellPrice(slot.id);
    C.removeItem(DH.game.pc(), slot.id, 1);
    DH.game.pc().gold += price;
    DH.audio.sfx('coin');
    if (!quiet) { DH.ui.toast('Sold ' + it.name + ' for ' + price + ' gp', '', 1400); refresh(); }
  }

  function update() {
    if (DH.input.tapped('cancel') && !DH.ui.modalOpen()) close();
  }
  function draw() {
    /* the world keeps ticking faintly behind the shop window */
    DH.gfx.rect(0, 0, DH.gfx.VW, DH.gfx.VH, '#0a0d14', true);
    DH.gfx.vignette(0.6);
  }

  return { name: 'shop', enter, exit, resume, pause, update, draw };
})();

</script>
<script>
/* ---- js/scenes/minigames.js ---- */
/* Drakehaven Island — the captain's ship games, the dig site, the mine's puzzles,
   fishing and crafting. Every game uses the rules as written at the table. */
window.DH = window.DH || {};

DH.scenes.minigames = (function () {
  'use strict';
  const U = DH.util, C = DH.char;

  let which = null, onDone = null, state = null, opts = null;
  let elWin = null, elField = null, elMsg = null, elRow = null;
  let timerHandle = null;

  const GAMES = {};

  function enter(arg) {
    which = arg.game;
    opts = arg;
    onDone = arg.onDone || null;
    state = {};
    build();
    const g = GAMES[which];
    if (!g) { say('That game is not set up yet.'); return; }
    g.start();
  }
  function exit() {
    DH.ui.clear();
    clearInterval(timerHandle); timerHandle = null;
  }
  function resume() { build(); const g = GAMES[which]; if (g && g.redraw) g.redraw(); }
  function pause() { DH.ui.clear(); }

  function close(result) {
    clearInterval(timerHandle); timerHandle = null;
    DH.game.pop(result);
    DH.game.flushOps();
    if (onDone) onDone(result);
  }

  /* =============== shell =============== */
  function build() {
    DH.ui.clear();
    const root = document.getElementById('ui');
    const wrap = DH.ui.el('div'); wrap.id = 'mini';
    root.appendChild(wrap);
    elWin = DH.ui.add(wrap, 'div', 'win panel gilt');
    const g = GAMES[which] || { title: 'Game', rules: '' };
    DH.ui.add(elWin, 'h2', '', g.title || 'Game');
    DH.ui.add(elWin, 'div', 'rules', g.rules || '');
    elField = DH.ui.add(elWin, 'div', 'field');
    elMsg = DH.ui.add(elWin, 'div', 'msg');
    elRow = DH.ui.add(elWin, 'div', 'row');
  }
  function say(html) { if (elMsg) elMsg.innerHTML = DH.ui.rich(html); }
  function addLine(html) { if (elMsg) elMsg.innerHTML += '<br>' + DH.ui.rich(html); }
  function buttons(list) {
    elRow.innerHTML = '';
    list.forEach(b => {
      if (!b) return;
      const btn = DH.ui.btn(b.label, b.cls || '', b.fn);
      if (b.disabled) btn.disabled = true;
      elRow.appendChild(btn);
    });
  }
  function field(html) { elField.innerHTML = html; return elField; }

  const pc = () => DH.game.pc();
  const gold = () => DH.game.partyGold();

  /* Opponents for the ship games: the captain and whoever is around. */
  function makeTable(includeParty, extra) {
    const list = [{ id: 'me', name: pc().name, me: true, ch: pc() }];
    if (includeParty) {
      DH.game.party().slice(1, 3).forEach(c => list.push({ id: c.companionId, name: c.name, ch: c }));
    }
    (extra || [{ name: 'Captain Hobbs', str: 4, dex: 3, con: 4, cheat: true }]).forEach(e => {
      list.push({
        name: e.name, npc: true, cheat: e.cheat,
        ch: { name: e.name, abilities: { str: 10 + e.str * 2, dex: 10 + e.dex * 2, con: 10 + e.con * 2, int: 10, wis: 10, cha: 10 }, prof: 3, skills: [], expertise: [], effects: [], conditions: [] }
      });
    });
    return list;
  }
  function abMod(p, ab) {
    if (p.ch && p.ch.abilities) return C.mod(p.ch.abilities[ab]);
    return 0;
  }
  function renderPlayers(players, extra) {
    let html = '<div class="players">';
    players.forEach(p => {
      html += '<div class="pl' + (p.me ? ' me' : '') + (p.out ? ' out' : '') + '">' +
        '<div class="nm">' + DH.ui.esc(p.name) + '</div>' +
        '<div class="grow">' + (extra ? extra(p) : '') + '</div>' +
        '</div>';
    });
    return html + '</div>';
  }
  function dice(vals, opts2) {
    opts2 = opts2 || {};
    return '<div class="dice">' + vals.map(v =>
      '<div class="d' + (opts2.hidden ? ' hid' : '') + (opts2.win ? ' win' : '') + '">' +
      (opts2.hidden ? '?' : v) + '</div>').join('') + '</div>';
  }

  /* ============================================================
     DRAGON'S HOARD
     Ante 10 gp. Roll 3d6 in secret. The house rolls a d6 and every
     die showing that number is taken away. Bet. Repeat once. Highest total wins.
     ============================================================ */
  GAMES.dragons_hoard = {
    title: 'Dragon\'s Hoard',
    rules: 'Everybody antes 10 gold and rolls 3d6, kept secret. The house rolls a d6 and every die showing that number is confiscated. Then everyone bets. That happens twice. All dice are shown, and the highest total takes the pot.',
    start() {
      if (!DH.game.spendGold(10)) { say('You cannot cover the ten gold ante.'); buttons([{ label: 'Leave', fn: () => close() }]); return; }
      state.players = makeTable(true);
      state.pot = 10 * state.players.length;
      state.phase = 0;
      state.players.forEach(p => { p.dice = DH.dice.nd(3, 6).rolls; p.bet = 0; });
      say('Ten gold each into the pot — <b>' + state.pot + ' gold</b> on the table. Three dice apiece, and nobody shows.');
      this.redraw();
      buttons([{ label: 'The house rolls', cls: 'primary', fn: () => this.houseRoll() }]);
    },
    redraw() {
      field(renderPlayers(state.players, p =>
        (p.me ? dice(p.dice) : dice(p.dice.map(() => '?'), { hidden: !state.revealed })) +
        (p.bet ? ' <span class="gold">bet ' + p.bet + '</span>' : '')
      ) + '<div class="small dim" style="margin-top:8px">Pot: <b class="gold">' + state.pot + ' gold</b></div>');
    },
    houseRoll() {
      const d = DH.dice.d(6);
      DH.audio.sfx('dice');
      let taken = 0;
      state.players.forEach(p => {
        const before = p.dice.length;
        p.dice = p.dice.filter(x => x !== d);
        taken += before - p.dice.length;
      });
      say('The house rolls a <b>' + d + '</b>. Every die showing a ' + d + ' is confiscated — ' + taken + ' gone from the table.');
      this.redraw();
      buttons([
        { label: 'Bet 10', fn: () => this.bet(10) },
        { label: 'Bet 25', fn: () => this.bet(25) },
        { label: 'Bet 50', fn: () => this.bet(50) },
        { label: 'Check', fn: () => this.bet(0) }
      ]);
    },
    bet(n) {
      if (n > 0 && !DH.game.spendGold(n)) { addLine('[bad]Not enough coin for that.[/]'); return; }
      state.pot += n;
      const me = state.players[0];
      me.bet += n;
      /* the others bet according to how their dice look */
      state.players.forEach(p => {
        if (p.me) return;
        const total = U.sum(p.dice);
        const want = total > 12 ? 25 : total > 7 ? 10 : 0;
        p.bet += want; state.pot += want;
      });
      state.phase++;
      this.redraw();
      if (state.phase < 2) {
        say('Round ' + (state.phase + 1) + '. The house rolls again.');
        buttons([{ label: 'The house rolls', cls: 'primary', fn: () => this.houseRoll() }]);
      } else this.reveal();
    },
    reveal() {
      state.revealed = true;
      /* the captain's charlatan's dice tilt his total */
      state.players.forEach(p => { if (p.cheat && p.dice.length) p.dice = p.dice.map(() => U.rint(4, 6)); });
      let best = -1, winners = [];
      state.players.forEach(p => {
        p.total = U.sum(p.dice);
        if (p.total > best) { best = p.total; winners = [p]; }
        else if (p.total === best) winners.push(p);
      });
      field(renderPlayers(state.players, p => dice(p.dice, { win: winners.indexOf(p) >= 0 }) +
        ' <b>' + p.total + '</b>'));
      const iWon = winners.some(p => p.me);
      if (iWon) {
        const share = Math.floor(state.pot / winners.length);
        DH.game.giveGold(share);
        say('You show ' + best + ' and take ' + (winners.length > 1 ? 'a share of ' : '') + 'the pot: [gold]' + share + ' gold[/].');
      } else {
        say('[bad]' + winners[0].name + ' shows ' + best + ' and sweeps the pot.[/]' +
          (winners[0].cheat ? '\n\nThe captain grins and shifts in his chair.' : ''));
        if (winners[0].cheat) DH.game.setFlag('captain_won_a_hand');
      }
      buttons([
        { label: 'Again', cls: 'primary', fn: () => { state = {}; build(); GAMES.dragons_hoard.start(); } },
        { label: 'Stop playing', fn: () => close({ played: 'dragons_hoard' }) }
      ]);
    }
  };

  /* ============================================================ ARM WRESTLING */
  GAMES.arm_wrestling = {
    title: 'Arm Wrestling',
    rules: 'Each player makes a Strength saving throw. The higher number takes a point. First to three points wins.',
    start() {
      state.me = 0; state.them = 0;
      state.foe = { name: 'Captain Hobbs', mod: 7 };
      say('The captain plants his elbow on the desk and grins. His forearm is the size of your thigh.');
      this.redraw();
      buttons([{ label: 'Take his hand', cls: 'primary', fn: () => this.round() }]);
    },
    redraw() {
      field('<div class="row" style="justify-content:space-around;font-size:15px">' +
        '<div>' + DH.ui.esc(pc().name) + '<br><b class="gold" style="font-size:26px">' + state.me + '</b></div>' +
        '<div class="dim" style="align-self:center">first to 3</div>' +
        '<div>' + DH.ui.esc(state.foe.name) + '<br><b class="bad" style="font-size:26px">' + state.them + '</b></div>' +
        '</div>');
    },
    async round() {
      buttons([]);
      const mine = await DH.ui.roller({ label: 'Strength Saving Throw', mod: C.saveMod(pc(), 'str'), modLabel: 'STR save' });
      const theirs = DH.dice.d20({ mod: state.foe.mod });
      if (mine.total > theirs.total) { state.me++; say('You force his wrist a hand\'s breadth toward the wood. ' + mine.total + ' to ' + theirs.total + '.'); }
      else if (theirs.total > mine.total) { state.them++; say('[bad]Your arm folds.[/] ' + mine.total + ' to ' + theirs.total + '.'); }
      else say('Deadlock. ' + mine.total + ' each. Neither of you gives an inch.');
      this.redraw();
      if (state.me >= 3) return this.win();
      if (state.them >= 3) return this.lose();
      buttons([{ label: 'Push again', cls: 'primary', fn: () => this.round() }]);
    },
    win() {
      say('[good]The captain\'s hand hits the desk.[/] He roars with laughter and shakes out his arm. "Ya got a grip on ya!"');
      DH.game.giveGold(50);
      DH.game.addAffinity('captain', 2, 'Captain Hobbs');
      buttons([{ label: 'Done', cls: 'primary', fn: () => close({ won: true }) }]);
    },
    lose() {
      say('Your knuckles meet the wood. "Don\' feel bad," he says, "I been haulin\' rope since I were six."');
      DH.game.addAffinity('captain', 1, 'Captain Hobbs');
      buttons([{ label: 'Done', fn: () => close({ won: false }) }]);
    }
  };

  /* ============================================================ DARTS */
  GAMES.darts = {
    title: 'Darts',
    rules: 'Three darts each — a Dexterity check per dart. The tightest cluster of three wins. A +1 or +2 Dexterity modifier lets you reroll one die; +3 or better lets you reroll two.',
    start() {
      state.players = makeTable(true);
      state.players.forEach(p => { p.throws = []; p.rerolls = rerollsFor(abMod(p, 'dex')); });
      state.turn = 0;
      say('A board with more holes than paint. The captain hands you three darts, points first.');
      this.redraw();
      this.next();
    },
    redraw() {
      field(renderPlayers(state.players, p =>
        dice(p.throws) + (p.spread != null ? ' <span class="dim">spread ' + p.spread + '</span>' : '') +
        (p.me && p.rerolls ? ' <span class="gold">' + p.rerolls + ' reroll' + (p.rerolls > 1 ? 's' : '') + '</span>' : '')
      ));
    },
    next() {
      const me = state.players[0];
      if (me.throws.length < 3) {
        buttons([{ label: 'Throw dart ' + (me.throws.length + 1), cls: 'primary', fn: () => this.throwDart() }]);
        return;
      }
      /* rerolls, then the others */
      if (me.rerolls > 0) {
        buttons(me.throws.map((v, i) => ({
          label: 'Reroll the ' + v, fn: () => {
            me.rerolls--;
            me.throws[i] = DH.dice.d20({ mod: C.abMod(pc(), 'dex') }).total;
            DH.audio.sfx('dice');
            this.redraw(); this.next();
          }
        })).concat([{ label: 'Keep these', cls: 'primary', fn: () => this.finish() }]));
        return;
      }
      this.finish();
    },
    async throwDart() {
      const me = state.players[0];
      const r = await DH.ui.roller({ label: 'Dexterity Check — dart ' + (me.throws.length + 1), mod: C.abMod(pc(), 'dex'), modLabel: 'DEX' });
      me.throws.push(r.total);
      this.redraw();
      this.next();
    },
    finish() {
      state.players.forEach(p => {
        if (!p.me) {
          p.throws = [];
          for (let i = 0; i < 3; i++) p.throws.push(DH.dice.d20({ mod: abMod(p, 'dex') }).total);
          let rr = rerollsFor(abMod(p, 'dex'));
          while (rr-- > 0) {
            const worst = p.throws.indexOf(Math.min.apply(null, p.throws));
            p.throws[worst] = DH.dice.d20({ mod: abMod(p, 'dex') }).total;
          }
        }
        p.spread = Math.max.apply(null, p.throws) - Math.min.apply(null, p.throws);
      });
      const best = state.players.slice().sort((a, b) => a.spread - b.spread)[0];
      this.redraw();
      if (best.me) {
        say('[good]Three darts inside a coin\'s width.[/] Spread of ' + best.spread + ' — nobody comes close.');
        DH.game.giveGold(40);
        DH.game.addAffinity('captain', 1, 'Captain Hobbs');
      } else {
        say('[bad]' + best.name + ' takes it[/] with a spread of ' + best.spread + '. Yours was ' + state.players[0].spread + '.');
      }
      buttons([
        { label: 'Again', fn: () => { state = {}; build(); GAMES.darts.start(); } },
        { label: 'Stop playing', cls: 'primary', fn: () => close({ played: 'darts' }) }
      ]);
    }
  };
  function rerollsFor(mod) { return mod >= 3 ? 2 : mod >= 1 ? 1 : 0; }

  /* ============================================================ DRINKING */
  GAMES.drinking = {
    title: 'Drinking',
    rules: 'Everyone drinks the same thing, then makes a DC 10 Constitution save. Each round the DC goes up by one. Fail twice and you are incapacitated. Last one upright wins.',
    start() {
      state.players = makeTable(true);
      state.players.forEach(p => { p.fails = 0; p.out = false; });
      state.dc = 10; state.round = 1;
      say('Little glasses. Something the colour of lamp oil. The captain pours without measuring.');
      this.redraw();
      buttons([{ label: 'Drink', cls: 'primary', fn: () => this.round() }]);
    },
    redraw() {
      field(renderPlayers(state.players, p =>
        p.out ? '<span class="bad">out cold</span>' :
          '<span class="dim">failed ' + p.fails + '/2</span>') +
        '<div class="small dim" style="margin-top:8px">Round ' + state.round + ' — DC <b class="gold">' + state.dc + '</b></div>');
    },
    async round() {
      buttons([]);
      const me = state.players[0];
      const mine = await DH.ui.roller({ label: 'Constitution Save — round ' + state.round, mod: C.saveMod(pc(), 'con'), dc: state.dc, modLabel: 'CON save' });
      if (!mine.success) { me.fails++; if (me.fails >= 2) me.out = true; }
      const lines = [];
      state.players.forEach(p => {
        if (p.me || p.out) return;
        const r = DH.dice.d20({ mod: abMod(p, 'con') + 2, dc: state.dc });
        if (!r.success) {
          p.fails++;
          if (p.fails >= 2) { p.out = true; lines.push(p.name + ' slides gently off the bench.'); }
          else lines.push(p.name + ' coughs and thumps their chest.');
        }
      });
      say((mine.success ? 'It goes down like a lit match, but it goes down.' : '[bad]That one hurt.[/]') +
        (lines.length ? '\n' + lines.join('\n') : ''));
      state.round++; state.dc++;
      this.redraw();
      const standing = state.players.filter(p => !p.out);
      if (me.out && standing.length) {
        say('[bad]You are done.[/] The room tips politely sideways.');
        C.addCondition(pc(), 'poisoned', 100);
        buttons([{ label: 'Ugh', fn: () => close({ won: false }) }]);
        return;
      }
      if (standing.length === 1 && standing[0].me) {
        say('[good]Last one upright.[/] The captain salutes you with an empty glass and then falls off his stool.');
        DH.game.giveGold(60);
        DH.game.addAffinity('captain', 3, 'Captain Hobbs');
        buttons([{ label: 'Victory, of a sort', cls: 'primary', fn: () => close({ won: true }) }]);
        return;
      }
      buttons([{ label: 'Drink again', cls: 'primary', fn: () => this.round() }]);
    }
  };

  /* ============================================================ ROULETTE */
  GAMES.roulette = {
    title: 'Roulette',
    rules: 'Bet on up to four numbers from 1 to 20, staking what you like on each. The house rolls a d20. Any number that comes up pays four times your stake.',
    start() {
      state.bets = {}; state.stake = 25;
      say('A wheel painted with twenty numbers, and a single die the captain claims is fair.');
      this.redraw();
    },
    redraw() {
      let html = '<div class="numgrid">';
      for (let n = 1; n <= 20; n++) {
        html += '<div class="n' + (state.bets[n] ? ' on' : '') + (state.rolled === n ? ' hit' : '') +
          '" data-n="' + n + '">' + n + '</div>';
      }
      html += '</div><div class="bet">Stake per number: ';
      [10, 25, 50, 100].forEach(v => html += '<span class="tag' + (state.stake === v ? ' gold' : '') + '" data-stake="' + v + '" style="cursor:pointer">' + v + '</span> ');
      html += '</div>';
      const total = Object.keys(state.bets).reduce((a, k) => a + state.bets[k], 0);
      html += '<div class="small dim" style="margin-top:6px">Staked: <b class="gold">' + total + '</b> · Purse: ' + U.commas(gold()) + '</div>';
      const f = field(html);
      f.querySelectorAll('.n').forEach(e => {
        e.onclick = () => {
          if (state.rolled) return;
          const n = +e.dataset.n;
          if (state.bets[n]) { DH.game.pc().gold += state.bets[n]; delete state.bets[n]; }
          else {
            if (Object.keys(state.bets).length >= 4) { DH.ui.toast('Four numbers is the limit.', 'bad'); return; }
            if (!DH.game.spendGold(state.stake)) { DH.ui.toast('Not enough coin.', 'bad'); return; }
            state.bets[n] = state.stake;
          }
          DH.audio.sfx('select');
          this.redraw();
        };
      });
      f.querySelectorAll('[data-stake]').forEach(e => {
        e.onclick = () => { state.stake = +e.dataset.stake; this.redraw(); };
      });
      buttons([
        { label: 'Spin', cls: 'primary', disabled: !Object.keys(state.bets).length || state.rolled, fn: () => this.spin() },
        { label: 'Leave the table', fn: () => close({ played: 'roulette' }) }
      ]);
    },
    async spin() {
      const r = await DH.ui.roller({ label: 'The House Rolls' });
      state.rolled = r.natural;
      this.redraw();
      if (state.bets[r.natural]) {
        const win = state.bets[r.natural] * 4;
        DH.game.giveGold(win);
        say('[good]' + r.natural + '.[/] Four times your stake: [gold]' + win + ' gold[/].');
      } else {
        say('[bad]' + r.natural + '.[/] Not one of yours. The captain rakes it in without looking at you.');
      }
      buttons([
        { label: 'Again', cls: 'primary', fn: () => { state = { stake: 25, bets: {} }; build(); GAMES.roulette.start(); } },
        { label: 'Walk away', fn: () => close({ played: 'roulette' }) }
      ]);
    }
  };

  /* ============================================================ THE WINNING ROLL */
  GAMES.winning_roll = {
    title: 'The Winning Roll',
    rules: 'Everyone pays in, rolls a hidden d20, and secretly bids how many rounds they will win. On three, everyone shows their bid on their fingers. Highest roll takes the round. Match your bid and you score: 1 round is worth 2 points, 2 is worth 3, 3 is worth 5. Bid zero and you score the round number instead. Each round adds another d20 to your roll.',
    start() {
      if (!DH.game.spendGold(25)) { say('Twenty-five gold to sit down, and you have not got it.'); buttons([{ label: 'Leave', fn: () => close() }]); return; }
      state.players = makeTable(true);
      state.pot = 25 * state.players.length;
      state.round = 1; state.wins = {}; state.players.forEach(p => state.wins[p.name] = 0);
      state.bid = null;
      say('Twenty-five gold each. The pot is <b>' + state.pot + '</b>. Now — how many of the three rounds do you think you will win?');
      this.bidPhase();
    },
    bidPhase() {
      field('<div class="small dim">Round ' + state.round + ' of 3. Bid on your fingers.</div>');
      buttons([0, 1, 2, 3].map(n => ({
        label: n + ' round' + (n === 1 ? '' : 's'), cls: n === 1 ? 'primary' : '',
        fn: () => { state.bid = n; state.players.forEach(p => { if (!p.me) p.bid = U.rint(0, 3); }); this.playRound(); }
      })));
    },
    async playRound() {
      const nDice = state.round;
      const me = state.players[0];
      state.players.forEach(p => {
        p.roll = 0; p.rolls = [];
        for (let i = 0; i < nDice; i++) { const d = DH.dice.d(20); p.rolls.push(d); p.roll += d; }
      });
      DH.audio.sfx('dice');
      field(renderPlayers(state.players, p => dice(p.rolls) + ' <b>' + p.roll + '</b>' +
        ' <span class="dim">bid ' + (p.bid == null ? '?' : p.bid) + '</span>'));
      const best = state.players.slice().sort((a, b) => b.roll - a.roll)[0];
      state.wins[best.name]++;
      say('Round ' + state.round + ': <b>' + best.name + '</b> shows ' + best.roll + ' and takes it.' +
        '\nRounds won so far: ' + state.players.map(p => p.name + ' ' + state.wins[p.name]).join(', '));
      state.round++;
      if (state.round <= 3) {
        buttons([{ label: 'Next round (one more die)', cls: 'primary', fn: () => this.playRound() }]);
      } else this.score();
    },
    score() {
      const POINTS = { 1: 2, 2: 3, 3: 5 };
      const results = state.players.map(p => {
        const won = state.wins[p.name];
        let pts = 0;
        if (p.bid === 0 && won === 0) pts = 3;                 // bid zero: the round number, three rounds played
        else if (p.bid === won) pts = POINTS[p.bid] || 0;
        return { p, won, pts };
      });
      const top = Math.max.apply(null, results.map(r => r.pts));
      const winners = results.filter(r => r.pts === top && top > 0);
      field(renderPlayers(state.players, p => {
        const r = results.find(x => x.p === p);
        return 'bid ' + p.bid + ', won ' + r.won + ' → <b class="gold">' + r.pts + '</b> points';
      }));
      if (winners.some(w => w.p.me)) {
        const share = Math.floor(state.pot / winners.length);
        DH.game.giveGold(share);
        say('[good]You called it exactly.[/] ' + share + ' gold.');
      } else if (!winners.length) {
        DH.game.giveGold(Math.floor(state.pot / state.players.length));
        say('Nobody matched their bid. The pot is split and the captain looks personally offended.');
      } else {
        say('[bad]' + U.listing(winners.map(w => w.p.name)) + ' called it. You did not.[/]');
      }
      buttons([
        { label: 'Again', fn: () => { state = {}; build(); GAMES.winning_roll.start(); } },
        { label: 'Stop playing', cls: 'primary', fn: () => close({ played: 'winning_roll' }) }
      ]);
    }
  };

  /* ============================================================
     THE DIG SITE
     Three shovels between you. Shovel-holders save at DC 12, the rest at DC 14.
     Everyone succeeds: the rock scale goes up by one. Anyone fails: a boulder
     rains down and everyone makes a DC 14 Dexterity save or takes damage, and
     that damage grows by 1d6 each time. A natural 20 takes three off the scale.
     Fifteen on the scale and the cave is open.
     ============================================================ */
  GAMES.dig = {
    title: 'Clearing the Cave Mouth',
    rules: 'Three shovels between everyone. With a shovel it is a DC 12 Strength save; without, DC 14. If everyone succeeds the rock scale rises by one. If anybody fails, a boulder comes down: DC 14 Dexterity save or take damage — and the damage grows by 1d6 every time it happens. A natural 20 shifts three rocks at once. Fifteen on the scale opens the way.',
    start() {
      state.scale = 0; state.dmgDice = 1; state.attempts = 0;
      const party = DH.game.party().filter(c => !c.dead);
      state.diggers = party.slice(0, 6);
      state.shovels = {};
      /* the orc and the minotaur keep one; two are free, and you may have your own */
      const withShovel = state.diggers.slice(0, C.hasItem(pc(), 'shovel') ? 3 : 2);
      withShovel.forEach(c => state.shovels[c.name] = true);
      say('The orc wipes his forehead. "Hey, you want to help?" There are three shovels and one of them is bent.');
      this.redraw();
      buttons([{ label: 'Start digging', cls: 'primary', fn: () => this.round() }]);
    },
    redraw() {
      const pct = Math.min(100, (state.scale / 15) * 100);
      field('<div class="scale"><i style="width:' + pct + '%"></i><span>' + state.scale + ' / 15 rocks shifted</span></div>' +
        renderPlayers(state.diggers.map(c => ({ name: c.name + (state.shovels[c.name] ? ' (shovel)' : ''), ch: c, me: c.isPlayer })),
          p => '<span class="dim">HP ' + p.ch.hp + '/' + p.ch.hpMax + '</span>') +
        '<div class="small dim" style="margin-top:6px">Next boulder would be ' + state.dmgDice + 'd6.</div>');
    },
    async round() {
      buttons([]);
      state.attempts++;
      const lines = [];
      let anyFail = false, nat20 = false;
      for (const c of state.diggers) {
        const dc = state.shovels[c.name] ? 12 : 14;
        const r = DH.dice.d20({ mod: C.saveMod(c, 'str'), dc: dc });
        if (r.natural === 20) nat20 = true;
        if (!r.success) { anyFail = true; lines.push('[bad]' + c.name + ' fails (' + r.total + ' vs ' + dc + ')[/]'); }
        else lines.push(c.name + ' heaves (' + r.total + ' vs ' + dc + ')');
      }
      DH.audio.sfx('dig');
      if (nat20) {
        state.scale += 3;
        lines.push('[good]A natural twenty — a whole shelf of stone slides away. Three rocks off the scale.[/]');
      } else if (!anyFail) {
        state.scale += 1;
        lines.push('[good]All together — one more rock shifted.[/]');
      }
      if (anyFail) {
        lines.push('Stone shifts overhead. [bad]Boulder![/] ' + state.dmgDice + 'd6, DC 14 Dexterity.');
        for (const c of state.diggers) {
          const r = DH.dice.d20({ mod: C.saveMod(c, 'dex'), dc: 14 });
          if (!r.success) {
            const d = DH.dice.roll(state.dmgDice + 'd6');
            C.applyDamage(c, d.total, 'bludgeoning');
            lines.push(c.name + ' takes ' + d.total + ' bludgeoning.');
          }
        }
        state.dmgDice++;
        DH.audio.sfx('hit');
      }
      say(lines.join('\n'));
      this.redraw();
      const down = state.diggers.filter(c => c.hp <= 0).length;
      if (state.scale >= 15) return this.done();
      if (down >= Math.ceil(state.diggers.length / 2)) {
        say('Too many of you are down. The orc waves you off. "Rest up, come back to it."');
        buttons([{ label: 'Step back', fn: () => close({ won: false }) }]);
        return;
      }
      buttons([
        { label: 'Keep digging', cls: 'primary', fn: () => this.round() },
        { label: 'Take a break', fn: () => close({ won: false }) }
      ]);
    },
    done() {
      DH.audio.sfx('door');
      say('[good]The final rock falls to the ground and the workers cheer.[/]\n\n"Thank you travellers, here take some gold."');
      DH.game.giveGold(175);
      DH.game.giveItem('ring_of_protection');
      DH.game.setFlag('dig_done');
      DH.game.completeQuest('dig', 250);
      buttons([{ label: 'Wonderful', cls: 'primary', fn: () => close({ won: true }) }]);
    }
  };

  /* ============================================================
     THE STATUE
     "I'm difficult for you to hear, say my name and I disappear."
     The answer is Silence. Thirty full seconds of it opens the door — and there
     is a fly in the room with AC 26 that will not shut up unless an area effect
     catches it.
     ============================================================ */
  GAMES.statue_riddle = {
    title: 'The Statue and the Fly',
    rules: 'Thirty seconds of complete silence opens the door. The statue asks a riddle. There is also a fly, and its AC is 26 unless it is caught in something that fills a space.',
    start() {
      state.silence = 0; state.flyAlive = true; state.guesses = 0; state.solved = false;
      say('The statue of a woman sparks to life and speaks:\n\n*"I\'m difficult for you to hear, say my name and I disappear."*\n\nAnd somewhere near the ceiling, a fly is buzzing.');
      this.redraw();
      this.menu();
    },
    redraw() {
      field('<div class="timer' + (state.silence > 20 ? '' : ' warn') + '">' + state.silence + ' / 30 seconds of silence</div>' +
        '<div class="small dim" style="margin-top:8px">' +
        (state.flyAlive ? 'The fly is still going. <b>AC 26</b> unless you hit it with an area effect.' : 'The fly is dealt with.') +
        '</div>');
    },
    menu() {
      buttons([
        { label: 'Say "Silence"', cls: 'primary', fn: () => this.answer('silence') },
        { label: 'Say "Quiet"', fn: () => this.answer('quiet') },
        { label: 'Say "A whisper"', fn: () => this.answer('whisper') },
        { label: state.flyAlive ? 'Swat the fly' : 'The fly is gone', disabled: !state.flyAlive, fn: () => this.swat() },
        { label: state.flyAlive ? 'Catch it in an area effect' : '—', disabled: !state.flyAlive, fn: () => this.aoe() },
        { label: 'Everyone stand perfectly still and shut up', fn: () => this.beQuiet() },
        { label: 'Leave the room', fn: () => close({ won: false }) }
      ]);
    },
    answer(a) {
      state.guesses++;
      if (a === 'silence') {
        DH.audio.sfx('confirm');
        say('You say the word, and the statue is simply not there any more. There is no sound as it goes.\n\nThe riddle is answered — but the door still wants its thirty seconds, and something is buzzing.');
        state.riddleSolved = true;
        DH.game.setFlag('statue_named');
      } else {
        DH.audio.sfx('cancel');
        say('The statue waits. That was not the word. (Attempt ' + state.guesses + '.)');
      }
      this.redraw(); this.menu();
    },
    async swat() {
      const r = await DH.ui.roller({ label: 'Attack the Fly', mod: C.abMod(pc(), 'dex') + pc().prof, dc: 26, modLabel: 'attack' });
      if (r.success) { state.flyAlive = false; say('[good]An impossible swing connects.[/] The buzzing stops.'); }
      else say('You miss it by a distance that feels insulting. Also, you made noise.');
      state.silence = 0;
      this.redraw(); this.menu();
    },
    async aoe() {
      const opts2 = [];
      const spells = C.knownSpells(pc()).filter(s => s.shape);
      spells.forEach(s => opts2.push({ label: 'Cast ' + s.name, fn: () => this.resolveAoe(s.name) }));
      opts2.push({ label: 'Throw a cloak over the whole corner', fn: () => this.resolveAoe('a thrown cloak') });
      opts2.push({ label: 'Back', fn: () => this.menu() });
      say('Something that fills a space, rather than something that hits a point.');
      buttons(opts2);
    },
    resolveAoe(what) {
      state.flyAlive = false;
      state.silence = 0;
      DH.audio.sfx('spell');
      say('[good]' + U.cap(what) + ' fills the corner and the buzzing stops mid-note.[/]\n\nNow: thirty seconds of nothing at all.');
      this.redraw(); this.menu();
    },
    beQuiet() {
      if (state.flyAlive) {
        say('You all hold still. For eleven seconds it is beautiful. Then the fly lands on the Ball Wizard\'s ear and the silence ends in swearing.');
        state.silence = 0;
        this.redraw(); this.menu();
        return;
      }
      buttons([]);
      say('Nobody moves. Nobody breathes louder than they have to.');
      clearInterval(timerHandle);
      timerHandle = setInterval(() => {
        state.silence++;
        this.redraw();
        if (state.silence >= 30) {
          clearInterval(timerHandle); timerHandle = null;
          DH.audio.sfx('door');
          say('[good]After a full thirty seconds of silence, the door opens.[/]');
          DH.game.setFlag('statue_solved');
          DH.game.awardXp(200);
          buttons([{ label: 'Go through', cls: 'primary', fn: () => close({ won: true }) }]);
        }
      }, 250);
    }
  };

  /* ============================================================
     THE SEALED ROOM
     "You must get to the next room, or die. A poisonous gas will fill the room in
     some time. Tamper as much as you please, especially you imposter."
     Twenty minutes on the clock. A pedestal with a ten-sided die. The way out is
     a screw, and behind the screw a key.
     ============================================================ */
  GAMES.gas_room = {
    title: 'The Sealed Room',
    rules: 'Twenty minutes before the gas fills the room. Every action costs time. There is a pedestal with a ten-sided die on it, and a door that will not open.',
    start() {
      state.minutes = 20; state.found = {}; state.done = false;
      say('A voice comes out of a speaker in the ceiling:\n\n*"You must get to the next room, or die. A poisonous gas will fill the room in some time. Tamper as much as you please — especially you, imposter."*\n\nEnvelopes drop from a slot, one for each of you.');
      this.redraw(); this.menu();
    },
    redraw() {
      field('<div class="timer' + (state.minutes <= 6 ? ' warn' : '') + '">' + state.minutes + ' minutes left</div>' +
        '<div class="small dim" style="margin-top:8px">' +
        (state.found.envelope ? '✓ You have read the envelopes.<br>' : '') +
        (state.found.die ? '✓ You have handled the ten-sided die.<br>' : '') +
        (state.found.plate ? '✓ You have found a plate on the door frame, held by one screw.<br>' : '') +
        (state.found.key ? '✓ You have the key.<br>' : '') +
        '</div>');
    },
    spend(n) {
      state.minutes -= n;
      if (state.minutes <= 0) return this.gas();
      return false;
    },
    menu() {
      buttons([
        { label: 'Open the envelopes', disabled: state.found.envelope, fn: () => this.act('envelope') },
        { label: 'Examine the pedestal and the d10', disabled: state.found.die, fn: () => this.act('die') },
        { label: 'Search the walls and the door frame', fn: () => this.act('search') },
        { label: state.found.plate && !state.found.key ? 'Unscrew the plate' : 'Unscrew the plate', disabled: !state.found.plate || state.found.key, fn: () => this.act('unscrew') },
        { label: 'Use the key on the door', disabled: !state.found.key, cls: state.found.key ? 'primary' : '', fn: () => this.act('unlock') },
        { label: 'Force the door', fn: () => this.act('force') }
      ]);
    },
    async act(a) {
      buttons([]);
      if (a === 'envelope') {
        state.found.envelope = true;
        if (this.spend(1) === false) { }
        say('Inside each envelope is a card. Four of them read: *"You are not the imposter."* One of them reads something else, and whoever is holding it does not say what.\n\nThe speaker crackles as if amused.');
        DH.game.setFlag('imposter_envelope');
      } else if (a === 'die') {
        state.found.die = true;
        this.spend(2);
        const r = await DH.ui.roller({ label: 'Investigation — the pedestal', mod: C.skillMod(pc(), 'investigation'), dc: 13 });
        if (r.success) {
          say('The die spins freely. Underneath the pedestal, scratched into the stone: *"the way out is held by one thing."* Something metal glints on the door frame.');
          state.found.plate = true;
        } else {
          say('It is a ten-sided die on a stone pedestal. You turn it over. It is still a ten-sided die on a stone pedestal.');
        }
      } else if (a === 'search') {
        this.spend(3);
        const r = await DH.ui.roller({ label: 'Perception — the room', mod: C.skillMod(pc(), 'perception'), dc: 12 });
        if (r.success) {
          state.found.plate = true;
          say('[good]There.[/] A small plate on the inside of the door frame, held on by a single screw.');
        } else say('Stone, stone, a speaker grille you cannot reach, and stone.');
      } else if (a === 'unscrew') {
        this.spend(3);
        const tools = C.hasItem(pc(), 'thieves_tools');
        const r = await DH.ui.roller({
          label: 'Sleight of Hand — one screw' + (tools ? ' (with tools)' : ' (with a dagger tip)'),
          mod: C.skillMod(pc(), 'sleight_of_hand') + (tools ? 2 : -2), dc: 12
        });
        if (r.success) {
          state.found.key = true;
          say('[good]The screw comes out. The plate swings aside. Behind it, on a nail, is a key.[/]');
          DH.audio.sfx('coin');
        } else say('The screw head is soft and your grip slips. It has turned, though. It will come.');
      } else if (a === 'unlock') {
        DH.audio.sfx('door');
        state.done = true;
        say('[good]The key turns. The door opens onto a corridor with no gas in it at all.[/]\n\nThe speaker says nothing, which somehow feels worse.');
        DH.game.setFlag('gas_escaped');
        DH.game.awardXp(300);
        this.redraw();
        buttons([{ label: 'Get out', cls: 'primary', fn: () => close({ won: true }) }]);
        return;
      } else if (a === 'force') {
        this.spend(2);
        const r = await DH.ui.roller({ label: 'Athletics — force the door', mod: C.skillMod(pc(), 'athletics'), dc: 20 });
        if (r.success) {
          state.done = true;
          say('[good]The frame splits and the door goes with it.[/] Grimble is going to be furious.');
          DH.game.setFlag('gas_escaped');
          DH.game.awardXp(300);
          buttons([{ label: 'Out', cls: 'primary', fn: () => close({ won: true }) }]);
          return;
        }
        say('It does not move, and your shoulder tells you about it.');
      }
      this.redraw();
      if (state.minutes > 0) this.menu();
    },
    gas() {
      say('[bad]A hiss from four corners at once.[/] The gas comes in fast and sweet-smelling.');
      DH.game.party().forEach(c => {
        const r = DH.dice.d20({ mod: C.saveMod(c, 'con'), dc: 15 });
        if (!r.success) { C.applyDamage(c, DH.dice.roll('4d6').total, 'poison'); C.addCondition(c, 'poisoned', 100); }
      });
      addLine('You crawl to the door and it opens from the other side — Grimble, looking horrified. "That one is meant to be *possible*!"');
      DH.game.setFlag('gas_escaped');
      buttons([{ label: 'Cough', fn: () => close({ won: false }) }]);
      return true;
    }
  };

  /* ============================================================ FISHING */
  GAMES.fishing = {
    title: 'Fishing off the Dock',
    rules: 'Wait for the line to dip, then strike. A Wisdom check sets the difficulty, and something bigger is always out there.',
    start() {
      state.stage = 'wait';
      say('You drop a line into the harbour. Salt, weed and the slow slap of water against the piles.');
      field('<div class="timer">…</div>');
      buttons([]);
      const delay = U.rint(900, 3200);
      state.biteAt = Date.now() + delay;
      state.window = 1100;
      clearInterval(timerHandle);
      timerHandle = setInterval(() => this.tick(), 60);
      buttons([{ label: 'Strike!', cls: 'primary', fn: () => this.strike() }, { label: 'Reel in and stop', fn: () => close() }]);
    },
    tick() {
      const now = Date.now();
      if (state.stage === 'wait' && now >= state.biteAt) {
        state.stage = 'bite';
        DH.audio.sfx('splash');
        field('<div class="timer warn">A BITE — strike now!</div>');
      } else if (state.stage === 'bite' && now > state.biteAt + state.window) {
        state.stage = 'wait';
        state.biteAt = now + U.rint(900, 2600);
        field('<div class="timer">…it lets go…</div>');
      }
    },
    async strike() {
      if (state.stage !== 'bite') {
        say('Nothing there. The line comes up bare and a gull laughs at you.');
        state.biteAt = Date.now() + U.rint(900, 2600);
        state.stage = 'wait';
        return;
      }
      clearInterval(timerHandle); timerHandle = null;
      const r = await DH.ui.roller({ label: 'Wisdom Check — set the hook', mod: C.abMod(pc(), 'wis') + (C.isProficient(pc(), 'survival') ? pc().prof : 0), dc: 11 });
      if (r.success) {
        const fish = r.natural >= 18 ? 'fish_glimmer' : U.pickWeighted([['fish_cod', 6], ['fish_eel', 3], ['fish_glimmer', 0.6], ['driftwood', 1.4]]);
        DH.game.giveItem(fish);
        say('[good]Landed:[/] ' + DH.item(fish).name + '.');
      } else {
        say('It rolls once, snaps the line and is gone. You have lost a hook and gained a grudge.');
      }
      DH.game.advanceMinutes(20);
      buttons([
        { label: 'Cast again', cls: 'primary', fn: () => { state = {}; GAMES.fishing.start(); } },
        { label: 'Done', fn: () => close() }
      ]);
    }
  };

  /* ============================================================ CRAFTING */
  GAMES.craft = {
    title: 'The Workbench',
    rules: 'Herbs, mushrooms and ore become something useful. What you can make depends on what you have gathered.',
    start() { this.redraw(); },
    redraw() {
      const inv = pc();
      let html = '';
      DH.RECIPES.forEach((rec, i) => {
        const can = Object.keys(rec.need).every(k => C.countItem(inv, k) >= rec.need[k]);
        const out = DH.item(rec.out);
        html += '<div class="wares' + (can ? '' : ' poor') + '" data-i="' + i + '">' +
          '<div class="grow">' + DH.ui.esc(out.name) + (rec.qty > 1 ? ' ×' + rec.qty : '') +
          '<div class="st">' + Object.keys(rec.need).map(k =>
            DH.item(k).name + ' ×' + rec.need[k] + ' (' + C.countItem(inv, k) + ')').join(', ') + '</div></div>' +
          '<div class="pr">' + (can ? 'make' : '—') + '</div></div>';
      });
      const f = field(html);
      f.querySelectorAll('.wares').forEach(e => {
        e.onclick = () => {
          const rec = DH.RECIPES[+e.dataset.i];
          const can = Object.keys(rec.need).every(k => C.countItem(pc(), k) >= rec.need[k]);
          if (!can) { DH.ui.toast('Not enough materials.', 'bad'); return; }
          Object.keys(rec.need).forEach(k => C.removeItem(pc(), k, rec.need[k]));
          DH.game.giveItem(rec.out, rec.qty);
          DH.game.advanceMinutes(30);
          DH.audio.sfx('confirm');
          this.redraw();
        };
      });
      say('Glass, a burner, and a great many stains.');
      buttons([{ label: 'Done', cls: 'primary', fn: () => close() }]);
    }
  };

  /* ============================================================ ARENA BRACKET */
  GAMES.arena_signup = {
    title: 'The Arena',
    rules: 'Four rounds. A crazed silver dragon until ten fighters remain. Then keep hold of an egg. Then two three-way fights. Then one against one.',
    start() {
      const done = DH.game.counter('arena_round');
      say('The Arena Master looks you over. "Four rounds. Most people stop after the first. You have cleared ' + done + '."');
      field('<div class="players">' +
        ['A crazed silver dragon, until ten are left standing',
          'Hold an egg when the timer runs out',
          'Two three-way fights',
          'One against one'].map((t, i) =>
            '<div class="pl' + (i < done ? ' out' : '') + '"><div class="nm">Round ' + (i + 1) + '</div><div class="grow">' + t +
            (i < done ? ' <span class="good">cleared</span>' : '') + '</div></div>').join('') + '</div>');
      buttons([
        { label: done >= 4 ? 'All four are done' : 'Enter round ' + (done + 1), cls: 'primary', disabled: done >= 4, fn: () => close({ enter: done + 1 }) },
        { label: 'Not today', fn: () => close({}) }
      ]);
    }
  };

  function update() {
    if (DH.input.tapped('cancel') && !DH.ui.modalOpen() && GAMES[which] && which !== 'gas_room') close();
  }
  function draw() {
    DH.gfx.rect(0, 0, DH.gfx.VW, DH.gfx.VH, '#0a0d14', true);
    DH.gfx.vignette(0.6);
  }

  return { name: 'minigames', enter, exit, resume, pause, update, draw, GAMES };
})();

</script>
<script>
/* ---- js/scenes/journal.js ---- */
/* Drakehaven Island — the book: sheet, inventory, spells, party, quests, bestiary. */
window.DH = window.DH || {};

DH.scenes.journal = (function () {
  'use strict';
  const U = DH.util, C = DH.char;

  const TABS = [
    { id: 'sheet', name: 'SHEET' },
    { id: 'inventory', name: 'PACK' },
    { id: 'spells', name: 'SPELLS' },
    { id: 'party', name: 'PARTY' },
    { id: 'quests', name: 'JOURNAL' },
    { id: 'pod', name: 'POD' },
    { id: 'bestiary', name: 'BESTIARY' },
    { id: 'rules', name: 'RULES' }
  ];
  let tab = 'sheet', who = 0;

  function enter(arg) { tab = (arg && arg.tab) || 'sheet'; who = 0; build(); }
  function exit() { DH.ui.clear(); }
  function close() { DH.game.pop(); DH.game.flushOps(); }

  function build() {
    DH.ui.clear();
    const root = document.getElementById('ui');
    const wrap = DH.ui.el('div'); wrap.id = 'book';
    root.appendChild(wrap);
    const tabs = DH.ui.add(wrap, 'div'); tabs.id = 'book-tabs';
    TABS.forEach(t => {
      if (t.id === 'spells' && !DH.game.pc().caster) return;
      if (t.id === 'pod' && !DH.game.pc().pod) return;
      const e = DH.ui.add(tabs, 'div', 'tb' + (tab === t.id ? ' on' : ''), t.name);
      e.onclick = () => { tab = t.id; build(); };
    });
    const body = DH.ui.add(wrap, 'div'); body.id = 'book-body';
    const closeBtn = DH.ui.btn('Close (Esc)', '', close);
    closeBtn.id = 'book-close';
    wrap.appendChild(closeBtn);

    switch (tab) {
      case 'sheet': drawSheet(body); break;
      case 'inventory': drawInventory(body); break;
      case 'spells': drawSpells(body); break;
      case 'party': drawParty(body); break;
      case 'quests': drawQuests(body); break;
      case 'pod': drawPod(body); break;
      case 'bestiary': drawBestiary(body); break;
      case 'rules': drawRules(body); break;
    }
  }

  const target = () => DH.game.party()[who] || DH.game.pc();

  function memberPicker(col) {
    const row = DH.ui.add(col, 'div', 'swrow');
    DH.game.party().forEach((c, i) => {
      row.appendChild(DH.ui.btn(c.name, i === who ? 'primary' : '', () => { who = i; build(); }));
    });
  }

  /* ---------------- sheet ---------------- */
  function drawSheet(body) {
    const ch = target();
    const left = DH.ui.add(body, 'div', 'col');
    const mid = DH.ui.add(body, 'div', 'col');
    const right = DH.ui.add(body, 'div', 'col');

    memberPicker(left);
    DH.ui.add(left, 'h3', '', DH.ui.esc(ch.name));
    DH.ui.add(left, 'div', 'small dim', (ch.raceName || '') + ' ' + (ch.className || '') +
      (ch.subclassName ? ' — ' + ch.subclassName : (C.subclass(ch) ? ' — ' + C.subclass(ch).name : '')) +
      ' · Level ' + ch.level);
    if (ch.backgroundName) DH.ui.add(left, 'div', 'small faint', ch.backgroundName);
    const grid = DH.ui.add(left, 'div', 'statgrid');
    const stat = (k, v) => {
      const s = DH.ui.add(grid, 'div', 'stat');
      s.innerHTML = '<div class="k">' + k + '</div><div class="v">' + v + '</div>';
    };
    stat('HIT POINTS', ch.hp + ' / ' + ch.hpMax + (ch.tempHp ? ' +' + ch.tempHp : ''));
    stat('ARMOUR CLASS', ch.ac);
    stat('SPEED', ch.speed + ' ft');
    stat('PROFICIENCY', U.plus(ch.prof));
    stat('INITIATIVE', U.plus(ch.initBonus != null ? ch.initBonus : C.abMod(ch, 'dex')));
    stat('HIT DICE', (ch.hitDiceLeft || 0) + 'd' + (ch.hitDie || 8));
    if (ch.isPlayer) {
      stat('EXPERIENCE', U.commas(ch.xp));
      stat('NEXT LEVEL', ch.level >= C.MAX_LEVEL ? 'max' : U.commas(C.xpForLevel(ch.level + 1)));
    }
    if (ch.spellDC) { stat('SPELL SAVE DC', ch.spellDC); stat('SPELL ATTACK', U.plus(ch.spellAtk)); }

    DH.ui.add(mid, 'h3', '', 'ABILITIES AND SAVES');
    DH.ABILITIES.forEach(ab => {
      const v = ch.abilities[ab.id];
      const e = DH.ui.add(mid, 'div', 'kv');
      const prof = (ch.saveProfs || []).indexOf(ab.id) >= 0;
      e.innerHTML = '<span>' + ab.name + '</span><span>' + v + ' (' + U.plus(C.mod(v)) + ')' +
        ' · save ' + U.plus(C.saveMod(ch, ab.id)) + (prof ? ' ●' : '') + '</span>';
    });
    DH.ui.add(mid, 'h3', '', 'SKILLS');
    Object.keys(DH.SKILLS).forEach(s => {
      const prof = (ch.skills || []).indexOf(s) >= 0;
      const exp = (ch.expertise || []).indexOf(s) >= 0;
      const e = DH.ui.add(mid, 'div', 'kv');
      e.innerHTML = '<span>' + (exp ? '◆ ' : prof ? '● ' : '　') + DH.SKILLS[s].name +
        ' <span class="faint tiny">' + DH.SKILLS[s].ab.toUpperCase() + '</span></span>' +
        '<span>' + U.plus(C.skillMod(ch, s)) + '</span>';
    });

    DH.ui.add(right, 'h3', '', 'RESOURCES');
    const res = ch.res || {};
    let anyRes = false;
    Object.keys(res).forEach(k => {
      if (k.indexOf('act_') === 0) return;
      anyRes = true;
      const e = DH.ui.add(right, 'div', 'kv');
      e.innerHTML = '<span>' + U.titleCase(k) + '</span><span>' + res[k].cur + ' / ' + res[k].max + '</span>';
    });
    if (!anyRes) DH.ui.add(right, 'div', 'small faint', 'Nothing to spend but effort.');

    DH.ui.add(right, 'h3', '', 'FEATURES AND TRAITS');
    const race = DH.raceById(ch.raceId);
    if (race) (race.traits || []).forEach(t => {
      const f = DH.ui.add(right, 'div', 'feat');
      f.innerHTML = '<b>' + DH.ui.esc(t.name) + '</b><p>' + DH.ui.esc(t.desc) + '</p>';
    });
    const cls = DH.classById(ch.classId);
    if (cls) for (let L = 1; L <= ch.level; L++) {
      (cls.features[L] || []).forEach(f2 => {
        const f = DH.ui.add(right, 'div', 'feat');
        f.innerHTML = '<b>' + DH.ui.esc(f2.name) + '</b><p>' + DH.ui.esc(f2.desc) + '</p>';
      });
    }
    const sub = C.subclass(ch);
    if (sub) Object.keys(sub.features || {}).forEach(k => {
      if (+k > ch.level) return;
      sub.features[k].forEach(f2 => {
        const f = DH.ui.add(right, 'div', 'feat');
        f.innerHTML = '<b>' + DH.ui.esc(f2.name) + '</b><p>' + DH.ui.esc(f2.desc) + '</p>';
      });
    });
    if (ch.effects && ch.effects.length && !cls) {
      DH.ui.add(right, 'div', 'small faint', ch.effects.join(', '));
    }
    if (ch.conditions && ch.conditions.length) {
      DH.ui.add(right, 'h3', '', 'CONDITIONS');
      ch.conditions.forEach(c2 => {
        const info = DH.CONDITION_INFO[c2.id] || { name: c2.id, desc: '' };
        const f = DH.ui.add(right, 'div', 'feat');
        f.innerHTML = '<b>' + info.name + '</b><p>' + DH.ui.esc(info.desc) + '</p>';
      });
    }
  }

  /* ---------------- inventory ---------------- */
  function drawInventory(body) {
    const ch = DH.game.pc();
    const left = DH.ui.add(body, 'div', 'col');
    const right = DH.ui.add(body, 'div', 'col');

    DH.ui.add(left, 'h3', '', 'CARRIED — ' + U.commas(ch.gold) + ' GOLD');
    const groups = { weapon: [], armor: [], potion: [], wondrous: [], quest: [], other: [] };
    ch.inv.forEach(slot => {
      const it = DH.item(slot.id);
      if (!it) return;
      const g = groups[it.kind] ? it.kind : (it.kind === 'poison' ? 'potion' : 'other');
      groups[g].push({ slot, it });
    });
    const titles = { weapon: 'Weapons', armor: 'Armour', potion: 'Potions and Poisons', wondrous: 'Wondrous Items', quest: 'Story Items', other: 'Everything Else' };
    Object.keys(groups).forEach(g => {
      if (!groups[g].length) return;
      DH.ui.add(left, 'div', 'small gold', titles[g]);
      groups[g].forEach(({ slot, it }) => {
        const equipped = Object.keys(ch.equipped).some(k => ch.equipped[k] === it.id);
        const row = DH.ui.el('div', 'itemrow' + (equipped ? ' eq' : ''));
        row.innerHTML = '<div class="grow">' + DH.ui.esc(it.name) + (slot.qty > 1 ? ' <span class="q">×' + slot.qty + '</span>' : '') +
          (equipped ? ' <span class="q">worn</span>' : '') + '</div>' +
          '<div class="q">' + (it.price ? it.price + ' gp' : '') + '</div>';
        row.onclick = () => showItem(right, slot, it);
        left.appendChild(row);
      });
    });
    if (!ch.inv.length) DH.ui.add(left, 'div', 'small faint', 'Nothing but lint.');

    DH.ui.add(right, 'h3', '', 'EQUIPPED');
    const slots = ['mainHand', 'offHand', 'armor', 'shield', 'head', 'neck', 'ring', 'arms', 'back', 'hands', 'trinket', 'pod'];
    slots.forEach(s => {
      const id = ch.equipped[s];
      const e = DH.ui.add(right, 'div', 'kv');
      e.innerHTML = '<span>' + U.titleCase(s) + '</span><span>' + (id ? DH.ui.esc(DH.item(id).name) : '—') + '</span>';
      if (id) e.style.cursor = 'pointer';
      if (id) e.onclick = () => { C.unequip(ch, s); DH.scenes.overworld.refreshPlayerLook && DH.scenes.overworld.refreshPlayerLook(); build(); };
    });
    DH.ui.add(right, 'div', 'small faint', 'Click an equipped line to take it off. Click an item on the left to use, equip or drop it.');
  }
  function showItem(panel, slot, it) {
    const ch = DH.game.pc();
    panel.innerHTML = '';
    DH.ui.add(panel, 'h3', '', DH.ui.esc(it.name));
    const bits = [];
    if (it.kind === 'weapon') bits.push(it.dmg + ' ' + it.type + (it.props && it.props.length ? ' · ' + it.props.join(', ') : ''));
    if (it.kind === 'armor') bits.push((it.ac ? 'AC ' + it.ac : '+' + it.acBonus + ' AC') + ' · ' + it.armorKind);
    if (it.rarity) bits.push(it.rarity);
    if (it.attune) bits.push('requires attunement');
    if (bits.length) DH.ui.add(panel, 'div', 'small gold', bits.join(' · '));
    DH.ui.add(panel, 'div', 'prose', DH.ui.esc(it.desc || ''));
    const row = DH.ui.add(panel, 'div', 'swrow');
    if (it.kind === 'weapon' || it.kind === 'armor' || it.slot) {
      if (C.canEquip(ch, it.id)) {
        row.appendChild(DH.ui.btn('Equip', 'primary', () => {
          C.equip(ch, it.id);
          DH.scenes.overworld.refreshPlayerLook && DH.scenes.overworld.refreshPlayerLook();
          build();
        }));
      } else DH.ui.add(panel, 'div', 'small bad', 'You are not trained with that.');
    }
    if (it.use) {
      row.appendChild(DH.ui.btn('Use now', '', () => {
        const use = it.use;
        if (use.heal) {
          const r = DH.dice.roll(use.heal);
          const got = C.heal(ch, r.total);
          DH.ui.toast('Healed ' + got + ' hit points.', 'good');
        }
        if (use.cure) use.cure.forEach(c2 => C.removeCondition(ch, c2));
        if (use.cond) C.addCondition(ch, use.cond, use.dur || 100);
        if (use.buff) { ch.buffs = ch.buffs || {}; ch.buffs[it.id] = Object.assign({}, use.buff); DH.ui.toast(it.name + ' takes effect.', 'good'); }
        C.removeItem(ch, it.id, 1);
        DH.audio.sfx('heal');
        build();
      }));
    }
    if (!it.quest) {
      row.appendChild(DH.ui.btn('Drop', 'danger', () => { C.removeItem(ch, it.id, 1); build(); }));
    }
  }

  /* ---------------- spells ---------------- */
  function drawSpells(body) {
    const ch = DH.game.pc();
    const left = DH.ui.add(body, 'div', 'col');
    const right = DH.ui.add(body, 'div', 'col');
    if (!ch.caster) { DH.ui.add(left, 'div', 'small faint', 'You do not cast spells.'); return; }

    DH.ui.add(left, 'h3', '', 'SPELL SLOTS');
    C.slotsAvailable(ch).forEach(s => {
      const row = DH.ui.add(left, 'div', 'slots');
      let html = '<span style="width:52px">Level ' + s.level + '</span>';
      for (let i = 0; i < s.max; i++) html += '<span class="s' + (i < s.cur ? ' f' : '') + '"></span>';
      row.innerHTML = html;
    });
    if (ch.caster.type === 'pact') DH.ui.add(left, 'div', 'small faint', 'Pact slots return on a short rest.');
    DH.ui.add(left, 'div', 'kv').innerHTML = '<span>Spell save DC</span><span>' + ch.spellDC + '</span>';
    DH.ui.add(left, 'div', 'kv').innerHTML = '<span>Spell attack</span><span>' + U.plus(ch.spellAtk) + '</span>';

    DH.ui.add(left, 'h3', '', 'KNOWN');
    (ch.spells.cantrips || []).forEach(id => spellRow(left, id, right, false));
    const list = ch.caster.prepares ? (ch.spells.prepared || []) : (ch.spells.known || []);
    list.forEach(id => spellRow(left, id, right, false));

    /* prepared casters can swap what is ready */
    if (ch.caster.prepares) {
      DH.ui.add(right, 'h3', '', 'PREPARE SPELLS — ' + (ch.spells.prepared || []).length + ' / ' + ch.preparedCount);
      DH.ui.add(right, 'div', 'small faint', 'Click to prepare or set aside. Cantrips are always ready.');
      const code = DH.LIST_CODE[ch.classId] || 'w';
      DH.spellsFor(code, ch.maxSpellLevel).filter(s => s.lv > 0).forEach(sp => {
        const on = (ch.spells.prepared || []).indexOf(sp.id) >= 0;
        const row = DH.ui.el('div', 'spellrow' + (on ? ' eq' : ''));
        row.innerHTML = '<div class="lv">' + sp.lv + '</div><div class="grow">' +
          (on ? '● ' : '○ ') + DH.ui.esc(sp.name) + '</div><div class="q">' + sp.school + '</div>';
        row.onclick = () => {
          if (on) U.remove(ch.spells.prepared, sp.id);
          else {
            if (ch.spells.prepared.length >= ch.preparedCount) { DH.ui.toast('That is as many as you can hold ready.', 'bad'); return; }
            ch.spells.prepared.push(sp.id);
          }
          DH.audio.sfx('select');
          build();
        };
        right.appendChild(row);
      });
    } else {
      DH.ui.add(right, 'h3', '', 'YOUR SPELLS');
      DH.ui.add(right, 'div', 'small faint', 'Click one on the left to read it.');
    }
  }
  function spellRow(col, id, panel, dim) {
    const sp = DH.spellById(id);
    if (!sp) return;
    const row = DH.ui.el('div', 'spellrow');
    row.innerHTML = '<div class="lv">' + (sp.lv || 'c') + '</div><div class="grow">' + DH.ui.esc(sp.name) +
      '</div><div class="q">' + sp.school.slice(0, 4) + '</div>';
    row.onclick = () => {
      panel.innerHTML = '';
      DH.ui.add(panel, 'h3', '', DH.ui.esc(sp.name));
      DH.ui.add(panel, 'div', 'small gold', (sp.lv ? U.ord(sp.lv) + '-level ' : 'Cantrip · ') + sp.school +
        ' · ' + U.titleCase(sp.cast) + (sp.conc ? ' · concentration' : ''));
      const bits = [];
      bits.push('Range ' + (sp.range === 0 ? 'self' : sp.range === 5 ? 'touch' : sp.range + ' ft'));
      if (sp.shape) bits.push(sp.shape.size + '-ft ' + sp.shape.k);
      if (sp.dmg) bits.push(sp.dmg + ' ' + (sp.type || ''));
      if (sp.heal) bits.push('heals ' + sp.heal);
      if (sp.save) bits.push(sp.save.toUpperCase() + ' save');
      DH.ui.add(panel, 'div', 'small dim', bits.join(' · '));
      DH.ui.add(panel, 'div', 'prose', DH.ui.esc(sp.desc || ''));
    };
    col.appendChild(row);
  }

  /* ---------------- party ---------------- */
  function drawParty(body) {
    const col = DH.ui.add(body, 'div', 'col');
    const right = DH.ui.add(body, 'div', 'col');
    DH.ui.add(col, 'h3', '', 'THE PARTY');
    DH.game.party().forEach((c, i) => {
      const row = DH.ui.el('div', 'itemrow');
      row.innerHTML = '<div class="grow"><b>' + DH.ui.esc(c.name) + '</b> — ' +
        DH.ui.esc((c.raceName || '') + ' ' + (c.className || '')) + ' ' + c.level +
        '<div class="q">HP ' + c.hp + '/' + c.hpMax + ' · AC ' + c.ac + (c.pod ? ' · pod ' + c.pod.charges + '/' + c.pod.max : '') + '</div></div>';
      row.onclick = () => { who = i; tab = 'sheet'; build(); };
      col.appendChild(row);
    });
    DH.ui.add(right, 'h3', '', 'WHO THEY ARE');
    DH.game.party().forEach(c => {
      if (!c.blurb) return;
      const f = DH.ui.add(right, 'div', 'feat');
      f.innerHTML = '<b>' + DH.ui.esc(c.name) + '</b><p>' + DH.ui.esc(c.blurb) + '</p>';
    });
    if (DH.game.state.pet) {
      const f = DH.ui.add(right, 'div', 'feat');
      const m = DH.monster(DH.game.state.pet);
      f.innerHTML = '<b>' + DH.ui.esc(m.name) + '</b><p>Tamed, and fights beside you. ' +
        m.hp + ' hit points, AC ' + m.ac + ', a claw for 1d4.</p>';
    }
    DH.ui.add(right, 'h3', '', 'REGARD');
    const aff = DH.game.state.affinity;
    const keys = Object.keys(aff).filter(k => aff[k] > 0);
    if (!keys.length) DH.ui.add(right, 'div', 'small faint', 'Nobody on this island has an opinion about you yet.');
    keys.forEach(k => {
      const e = DH.ui.add(right, 'div', 'kv');
      e.innerHTML = '<span>' + U.titleCase(k.replace('shop_', '')) + '</span><span>' +
        '♥'.repeat(Math.ceil(aff[k] / 2)) + ' ' + aff[k] + '/10</span>';
    });
  }

  /* ---------------- quests ---------------- */
  function drawQuests(body) {
    const col = DH.ui.add(body, 'div', 'col');
    const right = DH.ui.add(body, 'div', 'col');
    const st = DH.game.state;
    DH.ui.add(col, 'h3', '', 'TASKS');
    const open = st.quests.filter(q => !q.done);
    const done = st.quests.filter(q => q.done);
    if (!open.length) DH.ui.add(col, 'div', 'small faint', 'Nothing outstanding.');
    open.forEach(q => {
      const c = DH.ui.add(col, 'div', 'questcard');
      c.innerHTML = '<b>' + DH.ui.esc(q.title) + '</b><p>' + DH.ui.esc(q.desc || '') + '</p>' +
        (q.steps || []).map(s => '<p class="faint">· ' + DH.ui.esc(s) + '</p>').join('');
    });
    if (done.length) {
      DH.ui.add(col, 'h3', '', 'FINISHED');
      done.forEach(q => {
        const c = DH.ui.add(col, 'div', 'questcard done');
        c.innerHTML = '<b>' + DH.ui.esc(q.title) + '</b>';
      });
    }

    DH.ui.add(right, 'h3', '', 'WHERE YOU ARE');
    DH.ui.add(right, 'div', 'prose', DH.ui.esc(st.placeName) + ' — day ' + st.day + ', ' + DH.game.clock() + '.');
    if (st.contractDeadlineDay) {
      const left = st.contractDeadlineDay - st.day;
      const e = DH.ui.add(right, 'div', 'questcard');
      e.innerHTML = '<b>The Shady Man\'s Contract</b><p>' +
        (DH.game.flag('contract_done') ? 'Settled.' :
          left > 0 ? left + ' days left. Fail, and you all become new targets.' :
            '<span class="bad">The time is up.</span>') + '</p>';
    }
    if (st.musterDay) {
      const e = DH.ui.add(right, 'div', 'questcard');
      e.innerHTML = '<b>The Town\'s Defence</b><p>You put your name on the muster for day ' + st.musterDay + '.</p>';
    }
    DH.ui.add(right, 'h3', '', 'THE ISLAND SO FAR');
    const notes = [];
    if (DH.game.flag('has_pods')) notes.push('You each carry a P.A.C.T. Pod, and the Command Pod charges four of them on a long rest.');
    if (DH.game.flag('act1_done')) notes.push('An Ancient Golden Dragon spoke through you on the dock: "Where have they gone, please, help me child."');
    if (DH.game.flag('half_dragon_beaten')) notes.push('The crazy ones are caught, and the Half-Dragon in the square is down. They all said the same thing about eggs, in the same voice.');
    if (DH.game.flag('mine_done')) notes.push('Grimble the gnome brews something that keeps small dragons calm. He is looking for a gnome named Grimey.');
    if (DH.game.flag('green_dragon_took_egg')) notes.push('An adult green dragon dropped a five-foot golden egg in the swamp, then came back for it. MINE, it said, inside your heads.');
    if (!notes.length) notes.push('Nothing has gone badly wrong yet.');
